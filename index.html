<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADMIN TEMO</title>
<style>body{background:#080808;color:#fff;font-family:sans-serif;padding:15px}h1{color:#ff0033;text-align:center}input,button{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #ff003355;background:#151515;color:#fff}button{background:#ff0033;font-weight:bold;cursor:pointer}.card{background:#121212;padding:15px;border-radius:15px;margin:10px 0;border:1px solid #ff003322}</style>
</head><body>
<h1>🔒 ADMIN BASE TEMO</h1>
<div class="card">
<h3>➕ CREAR PRODUCTO NUEVO</h3>
<input id="nom" placeholder="Nombre Ej: DIAMANTES">
<input id="ico" placeholder="Icono Ej: 💎">
<button onclick="addProd()">CREAR PRODUCTO</button>
</div>
<div class="card">
<h3>➕ AGREGAR PRECIO A PRODUCTO</h3>
<select id="selProd" style="width:100%;padding:12px;background:#151515;color:#fff;border-radius:10px"></select>
<input id="dur" placeholder="Ej: 100 Diamantes">
<input id="pre" type="number" placeholder="Precio Ej: 18">
<button onclick="addPrecio()">AGREGAR PRECIO</button>
</div>
<button onclick="guardar()" style="background:#00ff88;color:#000;margin-top:20px">💾 GUARDAR TODO Y ACTUALIZAR TIENDA PÚBLICA</button>
<div id="lista"></div>
<script>
let BASE = JSON.parse(localStorage.getItem('BASE_TEMO')||'[]');
function render(){
 let s=document.getElementById('selProd'); s.innerHTML='';
 BASE.forEach((p,i)=>{s.innerHTML+=`<option value="${i}">${p.n}</option>`});
 document.getElementById('lista').innerHTML = BASE.map((p,i)=>`<div class="card">${p.i} ${p.n} (${p.ps.length} precios) <button onclick="BASE.splice(${i},1);render()">Eliminar</button></div>`).join('');
 localStorage.setItem('BASE_TEMO', JSON.stringify(BASE));
}
function addProd(){
 let n=document.getElementById('nom').value, i=document.getElementById('ico').value;
 if(!n)return alert('Pon nombre');
 BASE.push({n:n,i:i||'💎',ps:[]}); render();
}
function addPrecio(){
 let idx=document.getElementById('selProd').value, d=document.getElementById('dur').value, p=document.getElementById('pre').value;
 if(!d||!p)return alert('Faltan datos');
 BASE[idx].ps.push({d:d,p:parseInt(p)}); render();
}
function guardar(){
 localStorage.setItem('BASE_TEMO', JSON.stringify(BASE));
 alert('¡Guardado! Ahora copia este código y pegalo en tu index.html público. Tu BASE ya está actualizada.');
 console.log(JSON.stringify(BASE));
}
render();
</script>
</body></html>
