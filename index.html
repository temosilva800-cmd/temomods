<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TEMO STORE OFICIAL</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#0a0a0a;color:#fff}.top{background:linear-gradient(90deg,red,#800);padding:12px;display:flex;justify-content:space-between;position:sticky;top:0;z-index:10}.banner{margin:12px;border:1px solid red;border-radius:12px;padding:14px;background:#120000;box-shadow:0 0 15px red}.box{margin:12px;background:#1a1a1a;border:1px solid #333;border-radius:12px;padding:12px}.id{width:100%;background:#000;color:#fff;padding:10px;border:1px solid #333;border-radius:8px}.product{margin:10px 12px;background:#1a1a1a;border:1px solid #333;border-radius:12px;padding:12px;display:flex;justify-content:space-between;align-items:center}.btn{background:red;color:#fff;padding:8px 14px;border-radius:20px;border:none;font-weight:bold} #adminPanel{display:none;position:fixed;inset:0;background:#000;z-index:9999;padding:12px;overflow:auto}</style>
</head><body>
<div class="top"><b>🔥 TEMO STORE OFICIAL</b><span>💰 $<span id="sal">0</span></span></div>
<div class="banner"><h2 style="color:red">BIENVENIDO A TEMO STORE 🔥</h2><p style="color:#888;font-size:13px">Entrega automática - ID único</p></div>
<div class="box"><input id="myid" class="id" readonly><div style="text-align:center;margin-top:8px">ID: <b id="idd"></b> | Saldo: $<span id="sal2">0</span></div><button onclick="navigator.clipboard.writeText(document.getElementById('myid').value);alert('ID copiado')" style="width:100%;margin-top:8px;padding:8px;background:#222;color:#fff;border:1px solid #333;border-radius:8px">📋 Copiar ID</button></div>
<div id="lista"></div>
<div id="adminPanel">
<div id="alogin" style="max-width:350px;margin:40px auto;background:#111;padding:20px;border-radius:12px;border:1px solid red;text-align:center"><h2 style="color:#0f0">ADMIN TEMO</h2><input id="au" placeholder="Usuario" style="width:100%;padding:10px;margin:6px 0;background:#000;border:1px solid #333;color:#fff;border-radius:6px"><input id="ap" type="password" placeholder="Pass" style="width:100%;padding:10px;margin:6px 0;background:#000;border:1px solid #333;color:#fff;border-radius:6px"><button onclick="loginA()" style="width:100%;padding:10px;background:#0f0;border:none;border-radius:6px;font-weight:bold">ENTRAR</button><button onclick="document.getElementById('adminPanel').style.display='none';history.replaceState(null,'','/')" style="width:100%;margin-top:8px;background:#333;color:#fff;padding:8px;border-radius:6px;border:none">Cerrar</button></div>
<div id="acont" style="display:none"><h2 style="color:#0f0;text-align:center">GESTION KEYS + SALDO</h2><div style="display:flex;gap:6px;margin:12px 0"><input id="rid" placeholder="ID TEMO-XXXX" style="flex:1;padding:8px;background:#000;border:1px solid #333;color:#fff;border-radius:6px"><input id="rm" type="number" placeholder="$" style="width:70px;padding:8px;background:#000;border:1px solid #333;color:#fff;border-radius:6px"><button onclick="rec()" style="padding:8px 12px;background:#0f0;border:none;border-radius:6px;font-weight:bold">+</button></div><div id="adminList"></div></div>
</div>
<script>
let prods=[
{n:'DRIP CLIENT',id:'drip',icon:'💧',plans:[{id:'drip-1d',d:'1 DIA',p:4},{id:'drip-7d',d:'7 DIAS',p:12},{id:'drip-15d',d:'15 DIAS',p:15},{id:'drip-30d',d:'30 DIAS',p:20}]},
{n:'FLOURITE',id:'flou',icon:'💎',plans:[{id:'flou-7d',d:'7 DIAS',p:30},{id:'flou-30d',d:'30 DIAS',p:50}]},
{n:'CUBAN MODS',id:'cuban',icon:'🇨🇺',plans:[{id:'cuban-1d',d:'1 DIA',p:3},{id:'cuban-7d',d:'7 DIAS',p:5},{id:'cuban-30d',d:'30 DIAS',p:10}]},
{n:'HG CHEATS',id:'hg',icon:'⚡',plans:[{id:'hg-1d',d:'1 DIA',p:5},{id:'hg-10d',d:'10 DIAS',p:12},{id:'hg-30d',d:'30 DIAS',p:18}]},
{n:'PATO TEAM',id:'pato',icon:'🦆',plans:[{id:'pato-30d',d:'30 DIAS',p:14}]},
{n:'CAKE',id:'cake',icon:'🎂',plans:[{id:'cake-1d',d:'1 DIA',p:4},{id:'cake-7d',d:'7 DIAS',p:10},{id:'cake-15d',d:'15 DIAS',p:16},{id:'cake-30d',d:'30 DIAS',p:22}]}
];
let Gk=()=>JSON.parse(localStorage.getItem('temo_keys')||'{}'),Sk=k=>localStorage.setItem('temo_keys',JSON.stringify(k)),Gu=()=>JSON.parse(localStorage.getItem('temo_users')||'{}'),Su=u=>localStorage.setItem('temo_users',JSON.stringify(u));
let my=localStorage.getItem('temo_myID')||'TEMO-'+Math.random().toString(36).substr(2,6).toUpperCase();localStorage.setItem('temo_myID',my);
let u=Gu();if(!u[my])u[my]={saldo:0,historial:[]};Su(u);
document.getElementById('myid').value=my;document.getElementById('idd').innerText=my;
function upd(){let users=Gu();document.getElementById('sal').innerText=users[my].saldo;document.getElementById('sal2').innerText=users[my].saldo}upd();
function render(){let c=document.getElementById('lista');let k=Gk();c.innerHTML='';prods.forEach(p=>{let stock=0;p.plans.forEach(pl=>stock+=(k[pl.id]?.length||0));let d=document.createElement('div');d.className='product';d.innerHTML=`<div><b>${p.icon} ${p.n}</b><br><small style="color:#666">${p.plans.length} planes - ${stock} keys</small></div><button class="btn" onclick="ver('${p.id}')">VER</button>`;c.appendChild(d)})}render();
function ver(id){let p=prods.find(x=>x.id===id);let k=Gk();let txt=p.plans.map(pl=>`${pl.d} - $${pl.p} - Stock: ${k[pl.id]?.length||0}`).join('\n');let r=prompt(`${p.n}\n${txt}\n\nEscribe: 1 DIA, 7 DIAS, 15 DIAS, etc`);if(!r)return;let plan=p.plans.find(pl=>pl.d.toLowerCase()===r.toLowerCase()||pl.d.toLowerCase().includes(r.toLowerCase()));if(!plan)return alert('No encontrado');buy(plan.id)}
function buy(pid){let users=Gu();let k=Gk();let all=prods.flatMap(x=>x.plans).find(x=>x.id===pid);if((k[pid]?.length||0)==0)return alert('Sin stock');if(users[my].saldo<all.p)return alert('Saldo insuficiente: $'+users[my].saldo);let key=k[pid].shift();Sk(k);users[my].saldo-=all.p;users[my].historial.push({plan:pid,key:key,fecha:new Date().toLocaleString()});Su(users);upd();render();alert('COMPRA OK\nKEY: '+key);navigator.clipboard.writeText(key)}
if(location.href.toLowerCase().includes('admin'))document.getElementById('adminPanel').style.display='block';
function loginA(){if(document.getElementById('au').value==='Temo2007'&&document.getElementById('ap').value==='Temo2007'){document.getElementById('alogin').style.display='none';document.getElementById('acont').style.display='block';renderA()}else alert('Incorrecto')}
function renderA(){let c=document.getElementById('adminList');let k=Gk();c.innerHTML='';prods.forEach(p=>{p.plans.forEach(pl=>{let s=k[pl.id]?.length||0;let d=document.createElement('div');d.style.cssText='background:#111;border:1px solid #333;padding:10px;border-radius:8px;margin-bottom:8px';d.innerHTML=`<b style="color:#0f0">${p.n} ${pl.d} $${pl.p} - ${s} keys</b><br><small>${pl.id}</small><textarea id="ta-${pl.id}" style="width:100%;background:#000;color:#0f0;border:1px solid #333;padding:6px;border-radius:6px;margin-top:6px;min-height:60px" placeholder="Pega keys una por linea"></textarea><button onclick="saveK('${pl.id}')" style="width:100%;margin-top:6px;background:#0f0;border:none;padding:8px;border-radius:6px;font-weight:bold">GUARDAR KEYS</button>`;c.appendChild(d)})})}
function saveK(id){let t=document.getElementById('ta-'+id).value.trim();if(!t)return;let arr=t.split('\n').map(s=>s.trim()).filter(s=>s);let k=Gk();if(!k[id])k[id]=[];k
