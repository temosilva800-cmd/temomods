<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TEMO STORE</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-black text-white">
<header class="bg-red-600 p-3 flex justify-between sticky top-0 z-50"><b>TEMO STORE 🔥</b><div class="flex gap-2"><span id="saldoDisplay" class="bg-black px-2 py-1 rounded-full text-[10px] border">💰 $0</span><button id="btnAdmin" class="bg-black px-2 py-1 rounded-full">⚙️</button><button id="cartBtn" class="bg-white text-black px-3 py-1 rounded-full font-black">🛒 <span id="cartCount">0</span></button></div></header>
<main id="productos" class="max-w-md mx-auto p-3 grid grid-cols-1 gap-3"><p class="text-center text-zinc-500 text-xs mt-10">Cargando...</p></main>
<div id="adminPanel" class="max-w-md mx-auto bg-zinc-900 p-4 border-2 border-green-500 rounded-xl mt-4">
<b class="text-green-400">✅ MODO RECUPERACIÓN ADMIN</b>
<p class="text-[11px] mt-2">Si estás aquí es porque pusiste /?admin</p>
<input id="pass" type="password" placeholder="temo123" class="w-full p-3 rounded text-black mt-2">
<button id="btnLogin" class="bg-green-500 w-full py-3 rounded-full font-black mt-2">1️⃣ ENTRAR ADMIN</button>
<button id="btnRestaurar" class="hidden bg-yellow-400 text-black w-full py-4 rounded-full font-black mt-3 border-2 border-white animate-pulse">2️⃣ RESTAURAR PRODUCTOS AHORA</button>
<div id="lista" class="mt-3"></div>
</div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import {getFirestore,collection,doc,setDoc,getDoc,onSnapshot,deleteDoc} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyDFsZ812v6bExs5VkjOA5T3YIBoW_0zGeU",authDomain:"temo-store-5b025.firebaseapp.com",projectId:"temo-store-5b025",storageBucket:"temo-store-5b025.firebasestorage.app",messagingSenderId:"18400776607",appId:"1:18400776607:web:79cc6e9e716afcd41c6daa"};
let app=initializeApp(firebaseConfig),db=getFirestore(app);
let precios={};
const BASE={drip:{nombre:"DRIP",opciones:[{dias:1,precio:4,keys:[]},{dias:7,precio:12,keys:[]},{dias:15,precio:15,keys:[]},{dias:30,precio:20,keys:[]}]},cuban:{nombre:"CUBAN",opciones:[{dias:1,precio:3,keys:[]},{dias:7,precio:5,keys:[]},{dias:30,precio:10,keys:[]}]},hg:{nombre:"HG",opciones:[{dias:1,precio:5,keys:[]},{dias:10,precio:12,keys:[]},{dias:30,precio:18,keys:[]}]},vlt:{nombre:"VLT",opciones:[{dias:1,precio:5,keys:[]},{dias:7,precio:12,keys:[]},{dias:30,precio:25,keys:[]}]},pato:{nombre:"PATO",opciones:[{dias:30,precio:14,keys:[]}]},flourite:{nombre:"FLOURITE",opciones:[{dias:7,precio:30,keys:[]},{dias:30,precio:50,keys:[]}]}};

function renderTienda(){
  let c=document.getElementById('productos'); c.innerHTML='';
  let data = Object.keys(precios).length>0? precios : BASE;
  Object.entries(data).forEach(([id,prod])=>{
    let ops = (prod.opciones||[]).sort((a,b)=>a.dias-b.dias);
    let htmlOps=''; ops.forEach((op,i)=>{ htmlOps+=`<div class="flex justify-between bg-zinc-800 rounded-full p-1 pl-3 mt-1"><span class="text-[11px]">${op.dias}D $${op.precio}</span><button onclick="alert('compra')" class="bg-white text-black px-3 rounded-full text-[9px]">BUY</button></div>`; });
    c.innerHTML+=`<div class="bg-zinc-900 border border-red-600 rounded-2xl p-3"><b>${prod.nombre}</b>${htmlOps}</div>`;
  });
}
onSnapshot(collection(db,"temo_precios"),snap=>{
  precios={}; snap.forEach(d=>{ if(d.data().opciones) precios[d.id]=d.data(); });
  renderTienda();
  document.getElementById('lista').innerHTML = "Productos en Firebase: "+Object.keys(precios).length + " | " + Object.keys(precios).join(", ");
});

document.getElementById('btnLogin').onclick=()=>{
  if(document.getElementById('pass').value!=='temo123') return alert("pass temo123");
  document.getElementById('btnRestaurar').classList.remove('hidden');
  alert("Ahora dale a RESTAURAR");
};
document.getElementById('btnRestaurar').onclick=async()=>{
  for(let id in BASE){ await setDoc(doc(db,"temo_precios",id), BASE[id]); }
  alert("✅ LISTO! Ahora borra el /?admin de la url y recarga temomods.vercel.app normal");
  window.location.href="/";
};
document.getElementById('btnAdmin').onclick=()=>{ window.location.href="/?admin"; };
</script></body></html>
