<html lang="es">

<title>TEMO STORE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#080808;color:#fff;font-family:Arial,sans-serif}
.hdr{background:#000;border-bottom:3px solid #ff0000;padding:15px;text-align:center;font-weight:900;font-size:22px;letter-spacing:1px}
.hdr span{color:#ff0000}
.box{max-width:480px;margin:12px auto;background:#121212;border-radius:14px;padding:14px;border:1px solid #222}
.green{border:2px solid #00ff00;box-shadow:0 0 15px #00ff0040}

.btn{width:100%;padding:14px;border-radius:10px;font-weight:900;border:none;margin-top:7px;cursor:pointer;font-size:15px}
.btn-g{background:#00ff00;color:#000}
.btn-r{background:#ff0000;color:#fff}
.btn-d{background:#333;color:#fff}
.btn-y{background:#ffeb00;color:#000}
.prod{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:#1a1a1a;border:1px solid #333;border-radius:12px;padding:10px;text-align:center}
.card b{font-size:14px}
#ADMIN{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:99999;overflow:auto;padding:12px}
