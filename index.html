function renderPagos(){let pagos=getPagos();let c=document.getElementById('pagosList');c.innerHTML='';pagos.forEach((p,i)=>{let d=document.createElement('div');d.style.cssText='display:flex;gap:9px;margin:14px 0';d.innerHTML=`<input id="pagoN-${i}" value="${p.nombre}" class="barraInput" style="flex:1"><input id="pagoD-${i}" value="${p.dato}" class="barraInput" style="flex:1"><button onclick="savePago(${i})" style="width:54px;height:54px;background:#f00;color:#000;border:none;border-radius:13px">💾</button><button onclick="delPago(${i})" style="width:54px;height:54px;background:#000;border:2px solid #f00;color:#f00;border-radius:13px">X</button>`;c.appendChild(d);});}
function addBarraPago(){let cont=document.getElementById('contPagos');let id='pago-'+Date.now();let d=document.createElement('div');d.id='row-'+id;d.style.cssText='background:#000;border:3px solid #f00;border-radius:15px;padding:13px;margin:10px 0';d.innerHTML=`<input id="newPN-${id}" class="barraInput" style="flex:1" placeholder="Nombre"><input id="newPD-${id}" class="barraInput" style="flex:1;margin-top:8px" placeholder="Numero"><div style="display:flex;gap:8px;margin-top:8px"><button onclick="guardarNuevoPago('${id}')" style="flex:1;padding:12px;background:#f00;color:#000;border:none;border-radius:10px">✔</button><button onclick="document.getElementById('row-${id}').remove()" style="width:54px;background:#000;border:2px solid #f00;color:#f00;border-radius:10px">X</button></div>`;cont.appendChild(d);}
function guardarNuevoPago(id){let n=document.getElementById('newPN-'+id).value.trim();let d=document.getElementById('newPD-'+id).value.trim();if(!n||!d){alert('Llena');return;}let p=getPagos();p.push({nombre:n.toUpperCase(),dato:d});setPagos(p);document.getElementById('row-'+id).remove();}
function savePago(i){let p=getPagos();p[i].nombre=document.getElementById(`pagoN-${i}`).value.toUpperCase();p[i].dato=document.getElementById(`pagoD-${i}`).value;setPagos(p);}
function delPago(i){let p=getPagos();p.splice(i,1);setPagos(p);}
function renderRevs(){let revs=getRevs();let c=document.getElementById('revList');if(!c) return;c.innerHTML='';revs.forEach((r,i)=>{let link=location.origin+location.pathname+'?ref='+r.codigo;let div=document.createElement('div');div.style.cssText='background:#000;border:2px solid #f00;border-radius:15px;padding:13px;margin:10px 0;box-shadow:0 0 15px #f00';div.innerHTML=`<div style="display:flex;gap:8px"><input id="revN-${i}" value="${r.nombre}" class="barraInput" style="flex:1"><input id="revCod-${i}" value="${r.codigo}" class="barraInput" style="width:100px"><input id="revW-${i}" value="${r.whatsapp}" class="barraInput" style="flex:1"></div><div style="display:flex;gap:8px;margin-top:8px"><button onclick="saveRev(${i})" style="flex:1;padding:10px;background:#f00;color:#000;border:none;border-radius:10px">💾</button><button onclick="delRev(${i})" style="width:54px;background:#000;border:2px solid #f00;color:#f00;border-radius:10px">X</button><button onclick="verVentasRev('${r.codigo}')" style="flex:1;padding:10px;background:#000;border:2px solid #f00;color:#f00;border-radius:10px">📊</button></div><div style="font-size:10px;color:#f00;margin-top:6px">${link}</div><div style="display:flex;justify-content:space-between;margin-top:4px"><small style="color:#f00">Ventas: ${r.ventas||0}</small><small style="color:#f00">$${(parseFloat(r.ganancia||0)).toFixed(2)} (15%)</small></div>`;c.appendChild(div);});}
function addBarraRevendedor(){let cont=document.getElementById('contRev');let id='rev-'+Date.now();let d=document.createElement('div');d.id='row-'+id;d.style.cssText='background:#000;border:3px solid #f00;border-radius:15px;padding:13px;margin:10px 0';d.innerHTML=`<input id="newRN-${id}" class="barraInput" placeholder="Nombre"><input id="newRCod-${id}" class="barraInput" style="margin-top:8px" placeholder="codigo"><input id="newRW-${id}" class="barraInput" style="margin-top:8px" placeholder="WhatsApp"><div style="display:flex;gap:8px;margin-top:8px"><button onclick="guardarNuevoRev('${id}')" style="flex:1;padding:12px;background:#f00;color:#000;border:none;border-radius:10px">✔</button><button onclick="document.getElementById('row-${id}').remove()" style="width:54px;background:#000;border:2px solid #f00;color:#f00;border-radius:10px">X</button></div>`;cont.appendChild(d);}
function guardarNuevoRev(id){let n=document.getElementById('newRN-'+id).value.trim().toUpperCase();let cod=document.getElementById('newRCod-'+id).value.trim().toLowerCase()||n.toLowerCase()+Date.now().toString().slice(-3);let w=document.getElementById('newRW-'+id).value.trim();if(!n||!w){alert('Llena');return;}let r=getRevs();r.push({nombre:n,comision:'15',codigo:cod,whatsapp:w,ventas:0,ganancia:0});setRevs(r);document.getElementById('row-'+id).remove();}
function saveRev(i){let r=getRevs();r[i].nombre=document.getElementById(`revN-${i}`).value.toUpperCase();r[i].codigo=document.getElementById(`revCod-${i}`).value.toLowerCase();r[i].whatsapp=document.getElementById(`revW-${i}`).value;setRevs(r);}
function delRev(i){if(!confirm('Borrar?'))return;let r=getRevs();r.splice(i,1);setRevs(r);}
function verVentasRev(codigo){let ventas=JSON.parse(localStorage.getItem('temo_ventas_log')||'[]').filter(v=>v.codigo===codigo.toLowerCase());alert(ventas.length===0?'Sin ventas':ventas.map(v=>`${v.fecha} - ${v.producto} $${v.precio} → $${v.comision}`).join('\n'));}
function renderAdmin(){let prods=getProds();let keys=getKeys();let c=document.getElementById('aList');c.innerHTML='';prods.forEach(p=>{let card=document.createElement('div');card.className='cardA';let html=`<div style="display:flex;gap:9px"><input id="name-${p.id}" value="${p.n}" class="barraInput" style="flex:1"><input id="icon-${p.id}" value="${p.i}" class="barraInput" style="width:80px"><button onclick="saveName('${p.id}')" style="width:64px;height:64px;background:#f00;color:#000;border:none;border-radius:14px">💾</button><button onclick="delProd('${p.id}')" style="width:64px;height:64px;background:#000;border:2px solid #f00;color:#f00;border-radius:14px">X</button></div><div id="cont-${p.id}">`;p.ps.forEach(pl=>{html+=`<div style="display:flex;gap:8px;margin:8px 0"><input id="d-${pl.id}" value="${pl.d}" class="barraInput" style="flex:1"><input id="p-${pl.id}" type="number" value="${pl.p}" class="barraInput" style="width:90px"><button onclick="savePlan('${p.id}','${pl.id}')" style="width:54px;background:#f00;color:#000;border:none;border-radius:10px">💾</button><button onclick="delPlan('${p.id}','${pl.id}')" style="width:54px;background:#000;border:2px solid #f00;color:#f00;border-radius:10px">X</button></div><textarea id="ta-${pl.id}" style="width:100%;min-height:60px;background:#000;border:2px solid #f00;color:#f00;border-radius:10px;padding:8px">${(keys[pl.id]?keys[pl.id].join('\n'):'')}</textarea><button onclick="saveKeys('${pl.id}')" style="width:100%;padding:8px;background:#000;border:2px solid #f00;color:#f00;border-radius:10px;margin:8px 0">💾 KEYS (${keys[pl.id]?keys[pl.id].length:0})</button>`;});html+=`</div>`;card.innerHTML=html;c.appendChild(card)});}
function saveName(pid){let prods=getProds();let p=prods.find(x=>x.id===pid);p.n=document.getElementById('name-'+pid).value.toUpperCase();p.i=document.getElementById('icon-'+pid).value;setProds(prods);renderAdmin()}
function delProd(pid){setProds(getProds().filter(x=>x.id!==pid));renderAdmin()}
function savePlan(pid,plid){let pl=getProds().find(x=>x.id===pid).ps.find(x=>x.id===plid);pl.d=document.getElementById('d-'+plid).value.toUpperCase();pl.p=parseInt(document.getElementById('p-'+plid).value);setProds(getProds());}
function delPlan(pid,plid){let p=getProds().find(x=>x.id===pid);p.ps=p.ps.filter(x=>x.id!==plid);setProds(getProds());renderAdmin();}
function saveKeys(id){let lines=document.getElementById('ta-'+id).value.split('\n').map(s=>s.trim()).filter(s=>s);let k=getKeys();k[id]=lines;setKeys(k);render();renderAdmin();}
function guardarConfig(){alert('✅ GUARDADO V48 '+MI_NUMERO);}
function limpiarVaciosForzado(){let todos=JSON.parse(localStorage.getItem('temo_pagos')||'[]');let conDato=todos.filter(x=>x.dato&&x.dato.toString().trim()!=='');localStorage.setItem('temo_pagos',JSON.stringify(conDato));renderPagos();renderPagosFront();}
</script></body></html>
