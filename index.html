<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TEMO STORE</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-black text-white">
<header class="bg-red-600 p-3 flex justify-between sticky top-0 z-10"><b>TEMO STORE 🔥</b><div class="flex gap-2"><span id="saldoDisplay" class="bg-black px-3 py-1 rounded-full text-[10px] font-black">$0</span><button id="cartBtn" class="bg-white text-black px-3 py-1 rounded-full font-black">🛒<span id="cartCount">0</span></button></div></header>
<div class="bg-zinc-900 p-3"><div class="flex gap-2"><input id="userId" placeholder="TEMO-XXXX" class="flex-1 p-2 rounded-full text-black text-xs font-bold"><button onclick="cargarSaldo()" class="bg-red-600 px-4 py-2 rounded-full font-black text-xs">ENTRAR</button></div><button onclick="crearAleatorio()" class="bg-yellow-400 text-black w-full mt-2 py-3 rounded-full font-black text-sm">🎲 CREAR TU ID ALEATORIO</button><p id="miIdGenerado" class="hidden text-center bg-black border border-green-500 text-green-400 p-2 mt-2 rounded-xl text-xs font-black"></p></div>
<main id="productos" class="p-3 grid grid-cols-2 gap-3"></main>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";import{getFirestore,collection,doc,setDoc,onSnapshot,getDoc,updateDoc}from"https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyDFsZ812v6bExs5VkjOA5T3YIBoW_0zGeU",authDomain:"temo-store-5b025.firebaseapp.com",projectId:"temo-store-5b025",storageBucket:"temo-store-5b025.firebasestorage.app",messagingSenderId:"18400776607",appId:"1:18400776607:web:79cc6e9e716afcd41c6daa"};
const app=initializeApp(firebaseConfig);const db=getFirestore(app);
let cart=[],precios={},usuarioActual=localStorage.getItem('temo_id')||null,saldoActual=0;
const base=[{id:"drip1",n:"Drip 1 Dia",p:4},{id:"drip7",n:"Drip 7 Dias",p:12},{id:"drip15",n:"Drip 15 Dias",p:15},{id:"drip30",n:"Drip 30 Dias",p:20},{id:"flou7",n:"Flourite 7 Dias",p:30},{id:"flou30",n:"Flourite 30 Dias",p:50},{id:"cuban1",n:"Cuban 1 Dia",p:3},{id:"cuban7",n:"Cuban 7 Dias",p:5},{id:"cuban30",n:"Cuban 30 Dias",p:10},{id:"hg1",n:"HG 1 Dia",p:5},{id:"hg10",n:"HG 10 Dias",p:12},{id:"hg30",n:"HG 30 Dias",p:18},{id:"pato30",n:"Pato Team 30 Dias",p:14}];
if(usuarioActual){document.getElementById('userId').value=usuarioActual;cargarSaldo();}
function generarId(){let c="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",r="";for(let i=0;i<5;i++)r+=c[Math.floor(Math.random()*c.length)];return"TEMO-"+r;}
window.crearAleatorio=async()=>{let id=generarId();let ref=doc(db,"users",id);let s=await getDoc(ref);while(s.exists()){id=generarId();ref=doc(db,"users",id);s=await getDoc(ref);}await setDoc(ref,{saldo:0});usuarioActual=id;saldoActual=0;localStorage.setItem('temo_id',id);document.getElementById('userId').value=id;document.getElementById('saldoDisplay').innerText=`$${saldoActual} | ${id}`;let b=document.getElementById('miIdGenerado');b.classList.remove('hidden');b.innerText=`TU ID: ${id} - GUARDALO PARA RECARGAS`;};
window.cargarSaldo=async()=>{let id=document.getElementById('userId').value.trim().toUpperCase();if(!id)return;let ref=doc(db,"users",id);let s=await getDoc(ref);if(!s.exists())return alert("No existe, crea uno");usuarioActual=id;saldoActual=s.data().saldo||0;localStorage.setItem('temo_id',id);document.getElementById('saldoDisplay').innerText=`$${saldoActual} | ${id}`;};
function renderTienda(){let c=document.getElementById('productos');c.innerHTML='';Object.entries(precios).forEach(([id,p])=>{let st=p.keys?p.keys.length:0;c.innerHTML+=`<div class="bg-zinc-900 border border-zinc-800 rounded-xl p-3"><b class="text-xs">${p.nombre}</b><p class="text-green-400 font-black">$${p.precio}</p><p class="text-[10px]">${st} keys</p><button onclick="add('${id}','${p.nombre}',${p.precio})" class="bg-white text-black w-full mt-2 py-1 rounded-full font-bold text-xs">Comprar</button></div>`;});}
onSnapshot(collection(db,"temo_precios"),s=>{s.forEach(d=>precios[d.id]=d.data());renderTienda();});
window.add=(id,n,p)=>{cart.push({id,n,p});cartCount.innerText=cart.length;};
cartBtn.onclick=()=>{let t=cart.reduce((a,b)=>a+b.p,0);alert("Total $"+t+" - ID: "+usuarioActual+" - Manda WhatsApp 3224528803 para pagar");};
</script></body></html>
