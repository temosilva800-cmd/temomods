<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TEMO V53 MIS VENTAS</title>
<style>

</style></head><body>

</div>

<div id="planModal" class="modal"><div class="modalBox"><h2 id="planTitle" style="color:#f00;text-align:center"></h2><div id="planList"></div><button onclick="closeModal('planModal')" class="btnNeonRed">CERRAR</button></div></div>
<div id="revRegisterModal" class="modal"><div class="modalBox"><h2 style="color:#f00;text-align:center">👥 SER REVENDEDOR 15%</h2><input id="regNombre" class="barraInput" placeholder="TU NOMBRE Ej: SEBA" style="margin:8px 0"><input id="regWhats" class="barraInput" placeholder="TU WHATSAPP" style="margin:8px 0"><input id="regCodigo" class="barraInput" placeholder="CODIGO Ej: seba" style="margin:8px 0"><div id="previewLink" style="width:100%;padding:10px;background:#000;border:2px dashed #f00;color:#f00;border-radius:10px;margin-top:8px;font-size:11px;word-break:break-all">Tu link:?ref=TU_CODIGO</div><button onclick="registrarRevPublico()" class="btnNeonSolid">✅ CREAR MI LINK 15%</button><button onclick="closeModal('revRegisterModal')" class="btnNeonRed">CERRAR</button></div></div>

<div id="revPanelBody"></div>
<button onclick="closeModal('revPanelModal')" class="btnNeonRed" style="margin-top:14px">CERRAR</button>
</div></div>

<div id="ventaModal" class="modal" style="z-index:10003"><div class="modalBox"><h2 style="color:#f00;text-align:center">✅ YA HICE UNA VENTA</h2><input id="ventaProducto" class="barraInput" placeholder="¿Qué vendiste?" style="margin:10px 0"><input id="ventaPrecio" type="number" class="barraInput" placeholder="¿Por cuánto?" style="margin:10px 0"><button onclick="confirmarVenta()" class="btnNeonSolid">🔥 REGISTRAR</button><button onclick="closeModal('ventaModal')" class="btnNeonRed">CANCELAR</button></div></div>
<div id="loginAdmin"><div class="modalBox"><h2 style="color:#f00;text-align:center">🔥 TEMOSTOR 🔥</h2><input id="adminUser" placeholder="USUARIO" class="barraInput"><input id="adminPass" type="password" placeholder="CONTRA" class="barraInput" style="margin-top:8px"><button onclick="checkAdmin()" class="btnNeonSolid" style="margin-top:12px">⚡ ENTRAR ⚡</button></div></div>
<div id="admin" style="position:fixed;inset:0;background:#000;z-index:10000;display:none;overflow:auto;padding:12px"><div style="max-width:900px;margin:auto"><h1 style="color:#f00;text-align:center">🔥 ADMIN V53 🔥</h1><div id="aList"></div><button onclick="location.href=location.pathname" class="btnNeonRed" style="margin:20px 0">← SALIR</button></div></div>

<script>
function openModal(id){document.getElementById(id).style.display='flex';}
function closeModal(id){document.getElementById(id).style.display='none';}
const MI_NUMERO='523224528803';
function getProds(){return JSON.parse(localStorage.getItem('temo_prods')||'[{"n":"DRIP CLIENT","i":"💧","id":"drip","ps":[{"id":"drip-1d","d":"1 DIA","p":3},{"id":"drip-7d","d":"7 DIAS","p":10}]}]');}
function getPagos(){return JSON.parse(localStorage.getItem('temo_pagos')||'[{"nombre":"BINANCE","dato":"1150540078"}]');}
function getRevs(){try{return JSON.parse(localStorage.getItem('temo_revs')||'[]')}catch(e){return[]}}
function setRevs(r){localStorage.setItem('temo_revs',JSON.stringify(r));}
if(getRevs().length===0){
  setRevs([{nombre:'SEBA',codigo:'seba',whatsapp:'523224528803',ventas:1,ganancia:1.5},{nombre:'CHIRI',codigo:'chiri2370',whatsapp:'523224528803',ventas:0,ganancia:0}]);
  localStorage.setItem('temo_ventas_log', JSON.stringify([{codigo:'seba',producto:'7 días drip',precio:10,comision:'1.50',fecha:'9/9/2026, 9:39:44 p.m.'}]));
}
function getRef(){return new URLSearchParams(location.search).get('ref')}
function getPanel(){return new URLSearchParams(location.search).get('panel')}
document.getElementById('regCodigo')?.addEventListener('input',function(){let cod=this.value.toLowerCase().replace(/[^a-z0-9]/g,'');this.value=cod;document.getElementById('previewLink').innerText='Tu link: '+location.origin+location.pathname+'?ref='+(cod||'TU_CODIGO');});
function registrarRevPublico(){let n=document.getElementById('regNombre').value.trim().toUpperCase();let w=document.getElementById('regWhats').value.trim();let c=document.getElementById('regCodigo').value.trim().toLowerCase();if(!n||!w||!c){alert('Llena todo');return;}let revs=getRevs();revs.push({nombre:n,codigo:c,whatsapp:w,ventas:0,ganancia:0});setRevs(revs);closeModal('revRegisterModal');alert('✅ CREADO');}
function render(){let prods=getProds();let c=document.getElementById('lista');c.innerHTML='';prods.forEach(p=>{let d=document.createElement('div');d.className='prod';d.innerHTML='<div><b>'+p.i+' '+p.n+'</b></div><button style="padding:10px 20px;background:#f00;color:#000;border:none;border-radius:20px;font-weight:900" onclick=ver("'+p.id+'")>VER</button>';c.appendChild(d);});let pagos=getPagos();document.getElementById('pagosFront').innerHTML='<div class=pagosBox><h3 style="text-align:center">💳 METODOS</h3>'+pagos.map(p=>'<div class=pagoItem><b>'+p.nombre+'</b><span>'+p.dato+'</span></div>').join('')+'</div>';let ref=getRef();if(ref){let r=getRevs().find(x=>x.codigo.toLowerCase()===ref.toLowerCase());if(r){document.getElementById('refBanner').innerHTML='<div style="margin:12px;border:3px solid #f00;border-radius:16px;padding:12px;text-align:center;box-shadow:0 0 20px #f00"><b>👥 COMPRANDO CON: '+r.nombre+'</b></div>';}}let panel=getPanel();if(panel){mostrarPanelRev(panel);}}render();
let codigoActualVenta='';
function mostrarMiPanelDirecto(){let urlPanel=getPanel();if(urlPanel){mostrarPanelRev(urlPanel);return;}let ultimo=localStorage.getItem('ultimo_panel');if(ultimo){mostrarPanelRev(ultimo);return;}let revs=getRevs();if(revs.length>0){mostrarPanelRev(revs[0].codigo);return;}}
function mostrarPanelRev(codigo){codigoActualVenta=codigo.toLowerCase();localStorage.setItem('ultimo_panel',codigoActualVenta);let revs=getRevs();let r=revs.find(x=>x.codigo.toLowerCase()===codigoActualVenta);if(!r){alert('No existe '+codigo);return;}let log=JSON.parse(localStorage.getItem('temo_ventas_log')||'[]').filter(v=>v.codigo===codigoActualVenta);let link=location.origin+location.pathname+'?ref='+codigoActualVenta;document.getElementById('revPanelTitle').innerHTML='👥 PANEL DE '+r.nombre;document.getElementById('revPanelBody').innerHTML=`<div style="text-align:center"><button onclick="openModal('ventaModal')" style="width:100%;padding:18px;background:#000;border:3px solid #f00;color:#f00;border-radius:15px;font-weight:900;box-shadow:0 0 20px #f00;margin:10px 0">✅ YA HICE UNA VENTA<br><small>AVISAR AL JEFE 523224528803</small></button><div style="display:flex;gap:10px"><div style="flex:1;border:2px solid #f00;padding:14px;border-radius:15px"><b>${r.ventas||0}</b><br><small>VENTAS</small></div><div style="flex:1;border:2px solid #f00;padding:14px;border-radius:15px"><b>$${(parseFloat(r.ganancia||0)).toFixed(2)}</b><br><small>GANADO</small></div></div><div style="margin-top:10px;border:2px dashed #f00;padding:10px;border-radius:12px"><div style="font-size:11px;word-break:break-all">${link}</div><button onclick="navigator.clipboard.writeText('${link}');alert('Copiado')" style="margin-top:8px;padding:8px 16px;background:#f00;color:#000;border:none;border-radius:8px;font-weight:900">COPIAR LINK</button></div><div style="margin-top:10px;text-align:left;max-height:200px;overflow:auto">${log.length?log.map(v=>`<div style="border-bottom:1px solid #f00;padding:6px 0"><small>📅 ${v.fecha}<br>📦 ${v.producto} $${v.precio} → $${v.comision}</small></div>`).join(''):'<small>Sin ventas</small>'}</div></div>`;openModal('revPanelModal');}
function confirmarVenta(){let prod=document.getElementById('ventaProducto').value.trim();let prec=parseFloat(document.getElementById('ventaPrecio').value);if(!prod||!prec){alert('Llena');return;}let com=prec*0.15;let revs=getRevs();let idx=revs.findIndex(x=>x.codigo.toLowerCase()===codigoActualVenta.toLowerCase());if(idx>=0){revs[idx].ventas++;revs[idx].ganancia+=com;setRevs(revs);let log=JSON.parse(localStorage.getItem('temo_ventas_log')||'[]');log.push({codigo:codigoActualVenta,producto:prod,precio:prec,comision:com.toFixed(2),fecha:new Date().toLocaleString()});localStorage.setItem('temo_ventas_log',JSON.stringify(log));closeModal('ventaModal');window.open('https://wa.me/'+MI_NUMERO+'?text=VENTA '+revs[idx].nombre+' '+prod+' $'+prec+' com $'+com.toFixed(2),'_blank');mostrarPanelRev(codigoActualVenta);}}
function ver(pid){let p=getProds().find(x=>x.id===pid);document.getElementById('planTitle').innerText=p.n;let l=document.getElementById('planList');l.innerHTML='';p.ps.forEach(pl=>{let d=document.createElement('div');d.style.cssText='display:flex;justify-content:space-between;border:2px solid #f00;padding:10px;margin:8px 0;border-radius:12px';d.innerHTML='<div><b>'+pl.d+'</b><br>$'+pl.p+'</div><a href="https://wa.me/'+MI_NUMERO+'" target="_blank" style="padding:8px 14px;background:#f00;color:#000;border-radius:16px;text-decoration:none">COMPRAR</a>';l.appendChild(d);});openModal('planModal');}
if(location.search.includes('temo7')){document.getElementById('loginAdmin').style.display='flex';}else{document.getElementById('loginAdmin').style.display='none';}
function checkAdmin(){if(document.getElementById('adminUser').value==="TEMOSTOR"&&document.getElementById('adminPass').value==="TEMOSTOR"){document.getElementById('loginAdmin').style.display='none';document.getElementById('admin').style.display='block';}}
</script></body></html>
