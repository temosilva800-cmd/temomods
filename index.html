<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TEMO STORE OFICIAL 🔥</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#000;color:#fff;padding-bottom:40px}
.top{background:red;padding:14px;display:flex;justify-content:space-between;font-weight:900;position:sticky;top:0;z-index:10}
.banner{margin:12px;border:2px solid red;border-radius:14px;padding:14px;background:#140000;text-align:center;font-weight:900}
.box{margin:12px;background:#111;border:1px solid #333;border-radius:14px;padding:14px;text-align:center}
.box input{width:100%;padding:12px;background:#000;color:#0f0;border:1px solid #333;border-radius:8px;text-align:center;font-weight:900}
.prod{margin:10px 12px;background:#111;border:1px solid #333;border-radius:12px;padding:14px;display:flex;justify-content:space-between;align-items:center}
.btn{background:red;color:#fff;border:none;padding:9px 18px;border-radius:20px;font-weight:900}
.btn2{background:#0f0;color:#000;border:none;padding:10px;border-radius:8px;font-weight:900;width:100%;margin-top:8px}
#admin{position:fixed;inset:0;background:#000;z-index:9999;display:none;overflow:auto;padding:12px}
.cardA{background:#151515;border:1px solid #333;border-radius:12px;padding:12px;margin:12px 0}
.cardA textarea{width:100%;min-height:70px;background:#000;color:#0f0;border:1px solid #333;border-radius:8px;padding:8px;margin-top:6px}
.in{width:100%;padding:9px;background:#000;border:1px solid #444;color:#fff;border-radius:6px;margin:4px 0}
.row{display:flex;gap:6px}.row.in{flex:1}
.editBtn{background:#222;border:1px solid #555;color:#fff;padding:7px 12px;border-radius:6px;font-weight:900}
.saveBtn{background:#ff0;color:#000;border:none;padding:7px 12px;border-radius:6px;font-weight:900}
</style>
</head>
<body>
<div class="top"><span>🔥 TEMO STORE</span><span>💰 $<span id="sTop">0</span></span></div>
<div class="banner">🔥 BIENVENIDO A TEMO STORE OFICIAL 🔥</div>
<div class="box">
<input id="idIn" readonly>
<div style="margin-top:10px">ID: <b id="idTxt" style="color:#0f0"></b> | Saldo: $<b id="sTxt" style="color:yellow">0</b></div>
<div style="margin-top:10px"><button onclick="navigator.clipboard.writeText(ID);alert('Copiado: '+ID)" style="width:100%;padding:11px;background:#222;border:1px solid #444;border-radius:8px;color:#fff;font-weight:900">📋 COPIAR MI ID</button></div>
</div>
<div id="lista"></div>
<div id="admin">
<div id="aLogin" style="max-width:360px;margin:80px auto;background:#111;border:2px solid #0f0;border-radius:14px;padding:20px;text-align:center">
<h2 style="color:#0f0">ADMIN TEMO</h2>
<input id="aUser" placeholder="Usuario" class="in"><input id="aPass" type="password" placeholder="Contraseña" class="in">
<button onclick="loginA()" style="width:100%;padding:12px;background:#0f0;border:none;border-radius:8px;font-weight:900;margin-top:8px">ENTRAR</button>
</div>
<div id="aContent" style="display:none;max-width:700px;margin:0 auto">
<h2 style="color:#0f0;text-align:center">PANEL ADMIN</h2>
<div class="row"><button onclick="restaurarTodo()" style="flex:1;padding:12px;background:#0f0;color:#000;border:none;border-radius:8px;font-weight:900">✅ RESTAURAR</button><button onclick="borrarKeys()" style="flex:1;padding:12px;background:red;color:#fff;border:none;border-radius:8px;font-weight:900">🗑️ BORRAR</button></div>
<div class="cardA"><h3 style="color:yellow">💰 RECARGAR</h3><input id="recId" placeholder="ID TEMO-XXXX" class="in"><input id="recMonto" type="number" placeholder="Monto" class="in"><button onclick="addSaldo()" style="width:100%;padding:10px;background:#0f0;color:#000;border:none;border-radius:6px;font-weight:900;margin-top:6px">+ AGREGAR SALDO</button></div>
<div id="aList"></div>
<button onclick="location.href=location.pathname" style="width:100%;padding:12px;background:#222;border:1px solid #444;color:#fff;border-radius:8px;margin:20px 0">← SALIR</button>
</div>
</div>
<script>
let ID="";try{ID=localStorage.getItem('temo_myID')||""}catch(e){}ID=(ID+"").trim().toUpperCase();if(!ID||ID.length<6||ID==="|"||ID.includes("|")||ID.includes(" ")){ID='TEMO-'+Math.random().toString(36).substring(2,8).toUpperCase();localStorage.setItem('temo_myID',ID)}
const BASE=[{n:'DRIP CLIENT',i:'💧',id:'drip',ps:[{id:'drip-1d',d:'1 DIA',p:4},{id:'drip-7d',d:'7 DIAS',p:12},{id:'drip-15d',d:'15 DIAS',p:15},{id:'drip-30d',d:'30 DIAS',p:20}]},{n:'FLOURITE',i:'💎',id:'flou',ps:[{id:'flou-7d',d:'7 DIAS',p:30},{id:'flou-30d',d:'30 DIAS',p:50}]},{n:'CUBAN MODS',i:'🇨🇺',id:'cuban',ps:[{id:'cuban-1d',d:'1 DIA',p:3},{id:'cuban-7d',d:'7 DIAS',p:5},{id:'cuban-30d',d:'30 DIAS',p:10}]},{n:'HG CHEATS',i:'⚡',id:'hg',ps:[{id:'hg-1d',d:'1 DIA',p:5},{id:'hg-10d',d:'10 DIAS',p:12},{id:'hg-30d',d:'30 DIAS',p:18}]},{n:'PATO TEAM',i:'🦆',id:'pato',ps:[{id:'pato-30d',d:'30 DIAS',p:14}]},{n:'CAKE',i:'🎂',id:'cake',ps:[{id:'cake-1d',d:'1 DIA',p:4},{id:'cake-7d',d:'7 DIAS',p:10},{id:'cake-15d',d:'15 DIAS',p:16},{id:'cake-30d',d:'30 DIAS',p:22}]}];
function getProds(){try{let c=localStorage.getItem('temo_prods');return c?JSON.parse(c):BASE}catch(e){return BASE}}
function setProds(p){localStorage.setItem('temo_prods',JSON.stringify(p))}
function getKeys(){try{return JSON.parse(localStorage.getItem('temo_keys')||'{}')}catch(e){return{}}}
function setKeys(k){localStorage.setItem('temo_keys',JSON.stringify(k))}
function getUsers(){try{return JSON.parse(localStorage.getItem('temo_users')||'{}')}catch(e){return{}}}
function setUsers(u){localStorage.setItem('temo_users',JSON.stringify(u))}
let users=getUsers();if(!users[ID]){users[ID]={saldo:0};setUsers(users)}
document.getElementById('idIn').value=ID;document.getElementById('idTxt').innerText=ID;document.getElementById('sTop').innerText=users[ID].saldo;document.getElementById('sTxt').innerText=users[ID].saldo;
function render(){let prods=getProds();let keys=getKeys();let c=document.getElementById('lista');c.innerHTML='';prods.forEach(p=>{let stock=0;p.ps.forEach(pl=>{stock+=(keys[pl.id]?keys[pl.id].length:0)});let d=document.createElement('div');d.className='prod';d.innerHTML='<div><b>'+p.i+' '+p.n+'</b><br><small style=color:#888>'+p.ps.length+' planes - '+stock+' keys</small></div><button class=btn onclick=ver(\''+p.id+'\')>VER</button>';c.appendChild(d)})}render();
function ver(pid){let prods=getProds();let keys=getKeys();let users=getUsers();let me=users[ID];let p=prods.find(x=>x.id===pid);let txt=p.n+"\n\n";p.ps.forEach(pl=>{txt+=pl.d+" - $"+pl.p+" (Stock:"+(keys[pl.id]?keys[pl.id].length:0)+")\n"});txt+="\nTu saldo $"+me.saldo+"\nEscribe que quieres comprar";let ans=prompt(txt);if(!ans)return;let plan=p.ps.find(pl=>pl.d.toLowerCase()===ans.trim().toLowerCase());if(!plan){alert("Escribe bien");return}if((keys[plan.id]?keys[plan.id].length:0)<=0){alert("Sin stock");return}if(me.saldo<plan.p){alert("Saldo insuficiente");return}let k=keys[plan.id].shift();setKeys(k);users[ID].saldo-=plan.p;setUsers(users);document.getElementById('sTop').innerText=users[ID].saldo;document.getElementById('sTxt').innerText=users[ID].saldo;render();alert("✅ "+p.n+" "+plan.d+"\nKey: "+k)}
if(location.search.toLowerCase().includes('admin'))document.getElementById('admin').style.display='block';
function loginA(){let u=document.getElementById('aUser').value.trim();let p=document.getElementById('aPass').value.trim();if(u==='Temo2007'&&p==='Temo2007'){document.getElementById('aLogin').style.display='none';document.getElementById('aContent').style.display='block';renderAdmin()}else document.getElementById('aErr').style.display='block'}
function renderAdmin(){let prods=getProds();let keys=getKeys();let c=document.getElementById('aList');c.innerHTML='';prods.forEach(p=>{let card=document.createElement('div');card.className='cardA';let html='<div style="border-left:4px solid red;padding-left:8px;margin-bottom:10px"><div style="display:flex;gap:6px"><input id="icon-'+p.id+'" value="'+p.i+'" style="width:50px" class="in"><input id="name-'+p.id+'" value="'+p.n+'" class="in" style="flex:1"><button class="saveBtn" onclick="saveProdName(\''+p.id+'\')">💾</button></div></div>';p.ps.forEach(pl=>{let cnt=keys[pl.id]?keys[pl.id].length:0;let st=keys[pl.id]?keys[pl.id].join('\n'):"";html+='<div style="background:#000;padding:10px;border-radius:8px;margin:8px 0"><div class="row"><input id="d-'+pl.id+'" value="'+pl.d+'" class="in"><input id="p-'+pl.id+'" type="number" value="'+pl.p+'" class="in"></div><div class="row" style="margin-top:4px"><button class="editBtn" style="flex:1" onclick="savePlan(\''+p.id+'\',\''+pl.id+'\')">✏️ EDITAR '+pl.d+' $'+pl.p+'</button><span style="color:#0f0;padding:7px;font-size:12px">'+cnt+' keys</span></div><textarea id="ta-'+pl.id+'">'+st+'</textarea><button class="btn2" onclick="saveKeys(\''+pl.id+'\')">💾 GUARDAR KEYS</button></div>'});card.innerHTML=html;c.appendChild(card)})}
function saveProdName(pid){let prods=getProds();let p=prods.find(x=>x.id===pid);p.n=document.getElementById('name-'+pid).value.trim();p.i=document.getElementById('icon-'+pid).value.trim();setProds(prods);render();renderAdmin();alert("Producto actualizado")}
function savePlan(prodId,planId){let prods=getProds();let prod=prods.find(x=>x.id===prodId);let plan=prod.ps.find(x=>x.id===planId);plan.d=document.getElementById('d-'+planId).value.trim().toUpperCase();plan.p=parseInt(document.getElementById('p-'+planId).value)||0;setProds(prods);render();renderAdmin();alert("Plan: "+plan.d+" $"+plan.p)}
function saveKeys(planId){let keys=getKeys();let ta=document.getElementById('ta-'+planId);let lines=ta.value.split('\n').map(s=>s.trim()).filter(s=>s);keys[planId]=lines;setKeys(keys);render();renderAdmin();alert("Guardado "+lines.length)}
function restaurarTodo(){if(!confirm("Restaurar?"))return;localStorage.removeItem('temo_prods');location.href=location.pathname+"?admin"}
function borrarKeys(){if(!confirm("Borrar todo?"))return;setKeys({});render();renderAdmin()}
function addSaldo(){let id=document.getElementById('recId').value.trim().toUpperCase();let monto=parseInt(document.getElementById('recMonto').value);if(!id||isNaN(monto))return alert("ID y monto");let users=getUsers();if(!users[id])users[id]={saldo:0};users[id].saldo+=monto;setUsers(users);alert("Recargado $"+monto);if(id===ID){document.getElementById('sTop').innerText=users[id].saldo;document.getElementById('sTxt').innerText=users[id].saldo}renderAdmin()}
</script>
</body>
</html>
