<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TEMO V11.3</title>
<script>
try{
 let id=localStorage.getItem('temo_myID')||'';
 if(!id || id.includes('|') || id.length<6){
   localStorage.setItem('temo_myID','TEMO-'+Math.random().toString(36).substring(2,8).toUpperCase());
 }
}catch(e){ localStorage.clear(); localStorage.setItem('temo_myID','TEMO-'+Math.random().toString(36).substring(2,8).toUpperCase()); }
</script>
<style>body{background:#000;color:#fff;font-family:Arial;margin:0;padding-bottom:80px}.top{background:red;padding:14px;font-weight:900;display:flex;justify-content:space-between}.banner{margin:12px;border:2px solid red;border-radius:14px;padding:14px;text-align:center;background:#140000}.box{margin:12px;background:#111;border:1px solid #333;border-radius:14px;padding:14px;text-align:center}.box input{width:100%;padding:12px;background:#000;color:#0f0;border:2px solid #0f0;border-radius:8px;text-align:center;font-weight:900}.prod{margin:10px 12px;background:#111;border:1px solid #333;border-radius:12px;padding:14px;display:flex;justify-content:space-between;align-items:center}.btn{background:red;color:#fff;border:none;padding:10px 18px;border-radius:20px;font-weight:900}.btn2{background:#0f0;color:#000;border:none;padding:10px;border-radius:8px;font-weight:900;width:100%;margin-top:8px}.in{width:100%;padding:9px;background:#000;border:1px solid #444;color:#fff;border-radius:6px;margin:4px 0}.row{display:flex;gap:6px}#admin{position:fixed;inset:0;background:#000;z-index:9999;display:none;overflow:auto;padding:12px}.cardA{background:#151515;border:1px solid #333;border-radius:12px;padding:12px;margin:12px 0}.cardA textarea{width:100%;min-height:90px;background:#000;color:#0f0;border:1px solid #333;border-radius:8px;padding:8px;margin-top:6px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:99999;display:none;align-items:center;justify-content:center;padding:16px}.modalBox{background:#111;border:2px solid #0f0;border-radius:16px;padding:18px;max-width:420px;width:100%;text-align:center}.keyBox{background:#000;border:1px solid #333;border-radius:8px;padding:12px;color:#0f0;font-weight:900;word-break:break-all;margin:12px 0}</style>
</head><body>
<div class="top"><span>🔥 TEMO STORE V11.3</span><span id="saldoTop">$0</span></div>
<div class="banner">✅ V11.3 - PRODUCTOS FORZADOS<br><button onclick="localStorage.clear();location.reload()" style="margin-top:8px;padding:10px 20px;background:#0f0;color:#000;border:none;border-radius:10px;font-weight:900">🔧 LIMPIAR Y RECARGAR</button><br><small style="color:#0f0">Si ves esto, el HTML si se actualizó</small></div>
<div class="box"><input id="idIn" readonly><div>ID: <b id="idTxt" style="color:#0f0"></b> | Saldo: $<b id="sTxt" style="color:yellow">0</b></div><div class="row" style="margin-top:10px"><button onclick="copyID()" style="flex:1;padding:11px;background:#111;border:2px solid #0f0;border-radius:10px;color:#fff;font-weight:900">📋 COPIAR ID</button><button onclick="openHist()" style="flex:1;padding:11px;background:#222;border:1px solid #555;border-radius:10px;color:#fff;font-weight:900">📜 HIST</button></div></div>
<div id="lista"></div>
<div id="keyModal" class="modal"><div class="modalBox"><h3 style="color:#0f0">✅ COMPRA</h3><p id="modalProd"></p><div id="modalKey" class="keyBox"></div><button onclick="navigator.clipboard.writeText(lastKey)" style="width:100%;padding:14px;background:#0f0;color:#000;border:none;border-radius:10px;font-weight:900">📋 COPIAR</button><button onclick="document.getElementById('keyModal').style.display='none'" style="width:100%;padding:10px;background:#222;color:#fff;border-radius:8px;margin-top:8px">Cerrar</button></div></div>
<div id="histModal" class="modal"><div class="modalBox"><h3>HISTORIAL</h3><div id="histList"></div><button onclick="document.getElementById('histModal').style.display='none'" style="width:100%;padding:10px;background:#222;color:#fff;border-radius:8px;margin-top:10px">Cerrar</button></div></div>
<div id="admin"><div id="aLogin" style="max-width:360px;margin:80px auto;background:#111;border:2px solid #0f0;border-radius:14px;padding:20px;text-align:center"><h2 style="color:#0f0">ADMIN</h2><input id="aUser" placeholder="Temo2007" class="in"><input id="aPass" type="password" placeholder="Temo2007" class="in"><button onclick="doLogin()" style="width:100%;padding:12px;background:#0f0;border:none;border-radius:8px;font-weight:900;margin-top:8px">ENTRAR</button></div><div id="aContent" style="display:none;max-width:750px;margin:0 auto"><h2 style="color:#0f0;text-align:center">ADMIN - KEYS</h2><div id="aList"></div><button onclick="location.href=location.pathname" style="width:100%;padding:12px;background:#222;color:#fff;border-radius:8px;margin:20px 0">← SALIR</button></div></div>
<script>
var BASE=[
 {n:'DRIP CLIENT',i:'💧',id:'drip',ps:[{id:'drip-1d',d:'1 DIA',p:4},{id:'drip-7d',d:'7 DIAS',p:12},{id:'drip-15d',d:'15 DIAS',p:15},{id:'drip-30d',d:'30 DIAS',p:20}]},
 {n:'FLOURITE',i:'💎',id:'flou',ps:[{id:'flou-7d',d:'7 DIAS',p:30},{id:'flou-30d',d:'30 DIAS',p:50}]},
 {n:'CUBAN MODS',i:'🇨🇺',id:'cuban',ps:[{id:'cuban-1d',d:'1 DIA',p:3},{id:'cuban-7d',d:'7 DIAS',p:5},{id:'cuban-30d',d:'30 DIAS',p:10}]},
 {n:'HG CHEATS',i:'⚡',id:'hg',ps:[{id:'hg-1d',d:'1 DIA',p:5},{id:'hg-10d',d:'10 DIAS',p:12},{id:'hg-30d',d:'30 DIAS',p:18}]},
 {n:'PATO TEAM',i:'🦆',id:'pato',ps:[{id:'pato-30d',d:'30 DIAS',p:14}]},
 {n:'CAKE',i:'🎂',id:'cake',ps:[{id:'cake-1d',d:'1 DIA',p:4},{id:'cake-7d',d:'7 DIAS',p:10},{id:'cake-15d',d:'15 DIAS',p:16},{id:'cake-30d',d:'30 DIAS',p:22}]},
 {n:'ANDROID PROXY',i:'📦',id:'proxy',ps:[{id:'proxy-30d',d:'30 DIAS',p:8}]}
];
var ID = localStorage.getItem('temo_myID');
if(!ID){ ID='TEMO-'+Math.random().toString(36).substr(2,6).toUpperCase(); localStorage.setItem('temo_myID',ID); }
function L(k,d){try{let v=localStorage.getItem(k);if(!v)return d;return JSON.parse(v);}catch(e){return d}}
function S(k,v){localStorage.setItem(k,JSON.stringify(v))}
var users=L('temo_users',{}); if(!users[ID]){users[ID]={saldo:50}; S('temo_users',users);}
var keys=L('temo_keys',{});
if(!localStorage.getItem('temo_keys')){
 keys={'drip-1d':['DRIP-KEY-TEST-1','DRIP-KEY-2'],'drip-30d':['DRIP30-ABC'],'flou-30d':['FLOU-30-XYZ']};
 S('temo_keys',keys);
}
document.getElementById('idIn').value=ID;
document.getElementById('idTxt').innerText=ID;
document.getElementById('saldoTop').innerText='$'+(users[ID].saldo||0);
document.getElementById('sTxt').innerText=users[ID].saldo||0;
var lastKey='';
function render(){
 var l=document.getElementById('lista');
 var k=L('temo_keys',{});
 var u=L('temo_users',{})[ID]||{saldo:0};
 document.getElementById('saldoTop').innerText='$'+u.saldo;
 document.getElementById('sTxt').innerText=u.saldo;
 var html='';
 for(var i=0;i<BASE.length;i++){
  var p=BASE[i];
  var stock=0;
  for(var j=0;j<p.ps.length;j++){ var pid=p.ps[j].id; if(k[pid]) stock+=k[pid].length; }
  html+='<div class=prod><div><b>'+p.i+' '+p.n+'</b><br><small>'+p.ps.length+' planes - '+stock+' keys</small></div><button class=btn onclick="ver(\''+p.id+'\')">VER</button></div>';
 }
 l.innerHTML=html;
}
render();
function ver(pid){
 var k=L('temo_keys',{});
 var u=L('temo_users',{});
 var p=null;
 for(var i=0;i<BASE.length;i++) if(BASE[i].id==pid) p=BASE[i];
 var txt=p.n+'\n';
 for(var i=0;i<p.ps.length;i++) txt+=p.ps[i].d+' $'+p.ps[i].p+' ('+(k[p.ps[i].id]?k[p.ps[i].id].length:0)+' keys)\n';
 var ans=prompt(txt+'\nSaldo $'+u[ID].saldo+'\nEscribe plan (ej: 30 DIAS)');
 if(!ans) return;
 var plan=null;
 for(var i=0;i<p.ps.length;i++) if(p.ps[i].d.toLowerCase()==ans.trim().toLowerCase()) plan=p.ps[i];
 if(!plan) return alert('Plan no existe');
 if(!k[plan.id] || k[plan.id].length==0) return alert('Sin stock, agrega en admin');
 if(u[ID].saldo < plan.p) return alert('Saldo insuficiente');
 var key=k[plan.id].shift();
 S('temo_keys',k);
 u[ID].saldo-=plan.p;
 S('temo_users',u);
 var hist=L('temo_hist',{}); if(!hist[ID]) hist[ID]=[]; hist[ID].push({prod:p.n,plan:plan.d,key:key,date:new Date().toLocaleString()}); S('temo_hist',hist);
 lastKey=key;
 document.getElementById('modalProd').innerText=p.n+' - '+plan.d;
 document.getElementById('modalKey').innerText=key;
 document.getElementById('keyModal').style.display='flex';
 render();
}
function copyID(){ navigator.clipboard.writeText(ID); alert(ID); }
function openHist(){
 var h=L('temo_hist',{})[ID]||[];
 var html=h.length?h.slice().reverse().map(x=>'<div style=background:#000;padding:8px;margin:6px 0;border-radius:6px><b>'+x.prod+'-'+x.plan+'</b><br><small>'+x.date+'</small><br><span style=color:#0f0>'+x.key+'</span></div>').join(''):'<p>Sin compras</p>';
 document.getElementById('histList').innerHTML=html;
 document.getElementById('histModal').style.display='flex';
}
function doLogin(){ if(document.getElementById('aUser').value=='Temo2007' && document.getElementById('aPass').value=='Temo2007'){ document.getElementById('aLogin').style.display='none'; document.getElementById('aContent').style.display='block'; renderAdmin(); } else alert('mal'); }
function renderAdmin(){
 var k=L('temo_keys',{});
 var html='';
 for(var i=0;i<BASE.length;i++){
  var p=BASE[i];
  html+='<div class=cardA><b>'+p.i+' '+p.n+'</b>';
  for(var j=0;j<p.ps.length;j++){
   var pl=p.ps[j];
   var cnt=k[pl.id]?k[pl.id].length:0;
   var st=k[pl.id]?k[pl.id].join('\n'):'';
   html+='<div style=background:#000;padding:10px;margin:8px 0;border-radius:8px><b>'+pl.d+' $'+pl.p+' - '+cnt+' keys</b><textarea id=ta-'+pl.id+'>'+st+'</textarea><button class=btn2 onclick="saveKeys(\''+pl.id+'\')">💾 GUARDAR</button></div>';
  }
  html+='</div>';
 }
 document.getElementById('aList').innerHTML=html;
}
function saveKeys(id){
 var ta=document.getElementById('ta-'+id);
 var clean=ta.value.split('\n').map(s=>s.trim()).filter(s=>s.length>1);
 var k=L('temo_keys',{}); k[id]=clean; S('temo_keys',k);
 alert('Guardado '+clean.length+' keys en '+id);
 render();
}
if(location.search.toLowerCase().includes('admin')) document.getElementById('admin').style.display='block';
</script></body></html>
