<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TEMO STORE OFICIAL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#000;color:#fff;padding-bottom:20px}
.top{background:red;padding:12px;display:flex;justify-content:space-between;font-weight:bold;position:sticky;top:0;z-index:10}
.banner{margin:12px;border:2px solid red;border-radius:12px;padding:12px;background:#140000;text-align:center}
.box{margin:12px;background:#111;border:1px solid #333;border-radius:12px;padding:12px;text-align:center}
.box input{width:100%;padding:12px;background:#000;color:#fff;border:1px solid #333;border-radius:8px;text-align:center;font-weight:bold}
.prod{margin:10px 12px;background:#111;border:1px solid #333;border-radius:10px;padding:12px;display:flex;justify-content:space-between;align-items:center}
.btn{background:red;color:#fff;border:none;padding:8px 14px;border-radius:20px;font-weight:bold}
#admin{position:fixed;inset:0;background:#000;z-index:9999;display:none;overflow:auto;padding:15px}
#baneado{position:fixed;inset:0;background:#000;z-index:99999;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center}
</style>
</head>
<body>
<div id="baneado"><h1 style="color:red;font-size:50px">🚫 BANEADO</h1><p id="banIdTxt"></p></div>
<div class="top"><span>🔥 TEMO STORE</span><span>💰 $<span id="sTop">0</span></span></div>
<div class="banner"><b style="color:red">BIENVENIDO A TEMO STORE 🔥</b></div>
<div class="box">
<input id="idIn" readonly>
<div style="margin-top:8px">ID: <b id="idTxt"></b> | Saldo: $<b id="sTxt" style="color:yellow">0</b></div>
<button onclick="navigator.clipboard.writeText(ID);alert('Copiado')" style="width:100%;margin-top:8px;padding:10px;background:#222;border:1px solid #444;border-radius:8px;color:#fff">📋 Copiar ID</button>
</div>
<div id="lista"></div>
<div id="admin">
<div id="aLogin" style="max-width:360px;margin:60px auto;background:#111;border:2px solid #0f0;border-radius:12px;padding:20px;text-align:center">
<h2 style="color:#0f0">ADMIN TEMO</h2>
<input id="aUser" placeholder="Usuario" style="width:100%;padding:12px;margin:6px 0;background:#000;border:1px solid #333;color:#fff;border-radius:6px">
<input id="aPass" type="password" placeholder="Contraseña" style="width:100%;padding:12px;margin:6px 0;background:#000;border:1px solid #333;color:#fff;border-radius:6px">
<button onclick="loginA()" style="width:100%;padding:12px;background:#0f0;border:none;border-radius:8px;font-weight:bold">ENTRAR</button>
<p id="aErr" style="color:red;display:none">Datos mal</p>
</div>
<div id="aContent" style="display:none">
<h2 style="color:#0f0;text-align:center">PANEL ADMIN</h2>
<button onclick="restaurarTodo()" style="width:100%;padding:12px;background:#0f0;color:#000;border:none;border-radius:8px;font-weight:900;margin:10px 0">✅ RESTAURAR ORIGINALES</button>
<div id="aList"></div>
</div>
</div>
<script>
// FIX DEFINITIVO DEL ID CON |
let ID = "";
try{ ID = localStorage.getItem('temo_myID') || "" }catch(e){}
ID = ID.toString().trim().toUpperCase();
// Si es | o vacio o con espacio, crea nuevo TEMO-XXXX
if(!ID || ID.length < 6 || ID === "|" || ID.includes("|") || ID.includes(" ")){
  ID = 'TEMO-' + Math.random().toString(36).substring(2,8).toUpperCase();
  localStorage.setItem('temo_myID', ID);
}

const BASE=[{n:'DRIP CLIENT',i:'💧',id:'drip',ps:[{id:'drip-1d',d:'1 DIA',p:4},{id:'drip-7d',d:'7 DIAS',p:12},{id:'drip-15d',d:'15 DIAS',p:15},{id:'drip-30d',d:'30 DIAS',p:20}]},{n:'FLOURITE',i:'💎',id:'flou',ps:[{id:'flou-7d',d:'7 DIAS',p:30},{id:'flou-30d',d:'30 DIAS',p:50}]},{n:'CUBAN MODS',i:'🇨🇺',id:'cuban',ps:[{id:'cuban-1d',d:'1 DIA',p:3},{id:'cuban-7d',d:'7 DIAS',p:5},{id:'cuban-30d',d:'30 DIAS',p:10}]},{n:'HG CHEATS',i:'⚡',id:'hg',ps:[{id:'hg-1d',d:'1 DIA',p:5},{id:'hg-10d',d:'10 DIAS',p:12},{id:'hg-30d',d:'30 DIAS',p:18}]},{n:'PATO TEAM',i:'🦆',id:'pato',ps:[{id:'pato-30d',d:'30 DIAS',p:14}]},{n:'CAKE',i:'🎂',id:'cake',ps:[{id:'cake-1d',d:'1 DIA',p:4},{id:'cake-7d',d:'7 DIAS',p:10},{id:'cake-15d',d:'15 DIAS',p:16},{id:'cake-30d',d:'30 DIAS',p:22}]}];

function getProds(){ try{ let c=localStorage.getItem('temo_prods'); return c?JSON.parse(c):BASE }catch(e){ return BASE } }
function setProds(p){ localStorage.setItem('temo_prods',JSON.stringify(p)) }
function getKeys(){ try{ return JSON.parse(localStorage.getItem('temo_keys')||'{}') }catch(e){ return {} } }
function getUsers(){ try{ return JSON.parse(localStorage.getItem('temo_users')||'{}') }catch(e){ return {} } }
function setUsers(u){ localStorage.setItem('temo_users',JSON.stringify(u)) }

let users=getUsers(); if(!users[ID]){ users[ID]={saldo:0}; setUsers(users) }
document.getElementById('idIn').value=ID;
document.getElementById('idTxt').innerText=ID;
document.getElementById('sTop').innerText=users[ID].saldo;
document.getElementById('sTxt').innerText=users[ID].saldo;

function render(){
let prods=getProds(); let keys=getKeys(); let c=document.getElementById('lista'); c.innerHTML='';
prods.forEach(p=>{
let stock=0; p.ps.forEach(pl=>{ stock+=(keys[pl.id]?keys[pl.id].length:0) });
let d=document.createElement('div'); d.className='prod';
d.innerHTML='<div><b>'+p.i+' '+p.n+'</b><br><small>'+stock+' keys</small></div><button class=btn onclick=ver(\''+p.id+'\')>VER</button>';
c.appendChild(d);
});
}
render();

function ver(pid){
let prods=getProds(); let keys=getKeys(); let p=prods.find(x=>x.id===pid);
let txt=p.ps.map(pl=>pl.d+' $'+pl.p+' Stock:'+(keys[pl.id]?keys[pl.id].length:0)).join('\n');
let ans=prompt(p.n+'\n'+txt+'\nEscribe los dias: 1 DIA'); if(!ans)return;
let plan=p.ps.find(pl=>pl.d.toLowerCase()===ans.toLowerCase());
if(plan) alert('Plan: '+plan.d+' $'+plan.p);
}

if(location.search.toLowerCase().includes('admin')) document.getElementById('admin').style.display='block';
function loginA(){
let u=document.getElementById('aUser').value.trim();
let p=document.getElementById('aPass').value.trim();
if(u==='Temo2007' && p==='Temo2007'){
document.getElementById('aLogin').style.display='none';
document.getElementById('aContent').style.display='block';
}
}
function restaurarTodo(){ localStorage.removeItem('temo_prods'); location.reload(); }
</script>
</body>
</html>
