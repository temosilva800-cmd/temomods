<div class="cardPago"><div style="display:flex;justify-content:space-between;align-items:center"><div><h3 style="color:#f00;text-shadow:0 0 30px #f00">💳 METODOS - 130 BANCOS - TODOS VISIBLES</h3><small style="color:#f00">Llena tu numero y dale 💾 - Se guarda solo</small></div><button class="btnPlus" onclick="addBarraPago()">+</button></div><div id="pagosList" style="margin-top:14px"></div><div id="contPagos"></div></div>

<script>
let BASE=[{n:'DRIP CLIENT',i:'💧',id:'drip',ps:[{id:'drip-1d',d:'1 DIA',p:4},{id:'drip-7d',d:'7 DIAS',p:12},{id:'drip-30d',d:'30 DIAS',p:25}]},{n:'HOLO VIP',i:'💎',id:'holo',ps:[{id:'holo-1d',d:'1 DIA',p:5}]},{n:'HG PROXY',i:'💰',id:'hgproxy',ps:[{id:'hg-1d',d:'1 DIA',p:3}]}];
const BANCOS_POR_PAIS={
"MEXICO 🇲🇽":["OXXO","CLABE STP","BBVA MX","Banorte","Santander MX","Azteca","Nu MX","Mercado Pago MX","Binance ID 1150540078","Spin OXXO","HSBC MX"],
"COLOMBIA 🇨🇴":["Bancolombia Ahorros","Nequi","Daviplata","Nu Bank CO","Bre-B","BBVA CO","Davivienda","Transfiya","Dale","Lulo Bank"],
"PERU 🇵🇪":["Yape","Yape QR","Plin","BCP Ahorros","Interbank","BBVA Peru","Scotiabank Peru","Banco de la Nacion"],
"CHILE 🇨🇱":["Banco Estado Caja Vecina","Banco Estado Transferencia","CuentaRUT","Mach","Mercado Pago CL","Banco de Chile","Santander CL","BCI","Tenpo"],
"ECUADOR 🇪🇨":["Banco Guayaquil Ahorro","Banco Pichincha Ahorro","Produbanco","Banco Bolivariano","DeUna","PeiGo"],
"BRASIL 🇧🇷":["PIX CPF","PIX Celular","PIX Aleatorio","Nubank","PicPay","Mercado Pago BR"],
"ARGENTINA 🇦🇷":["Mercado Pago","CBU / CVU","Uala","Brubank","Naranja X","BBVA AR","Lemon Cash","Prex AR"],
"BOLIVIA 🇧🇴":["Tigo Money","Banco Union","Banco Nacional","BNB","Yape Bolivia"],
"VENEZUELA 🇻🇪":["Pago Movil","Binance VZLA","Zinli","Banesco","Provincial","Mercantil"],
"URUGUAY 🇺🇾":["Prex","Mercado Pago UY","Midinero","BROU"],
"PARAGUAY 🇵🇾":["Tigo Money PY","Ueno","Personal Pay PY","Bancard"],
"DOMINICANA 🇩🇴":["Banreservas","Banco Popular","BHD Leon","Qik"],
"PANAMA 🇵🇦":["Yappy","Nequi Panama","Banistmo","Mercado Pago PA"],
"COSTA RICA 🇨🇷":["SINPE Movil","BAC CR","BNCR","Davivienda CR"],
"GUATEMALA 🇬🇹":["Nequi GT","Bi Bank","Banrural","Promerica GT"],
"EL SALVADOR 🇸🇻":["Chivo Wallet","Banco Agricola","Davivienda SV"],
"HONDURAS 🇭🇳":["Tigo Money HN","BAC HN","Atlantida"],
"USA 🇺🇸":["Zelle","PayPal","CashApp","Venmo"],
"ESPAÑA 🇪🇸":["Bizum","IBAN","Revolut","N26","BBVA ES"]
};
let TODOS=[];
for(let pais in BANCOS_POR_PAIS){
BANCOS_POR_PAIS[pais].forEach(b=>{
let esBinance = b.includes('Binance');
TODOS.push({nombre: pais+' - '+b.replace(' 1150540078',''), dato: esBinance?'1150540078':''});
});
}
if(!localStorage.getItem('temo_prods')) localStorage.setItem('temo_prods',JSON.stringify(BASE));
let guardados = JSON.parse(localStorage.getItem('temo_pagos')||'[]');
// Si tienes menos de 30, te carga los 130 completos
if(guardados.length<30){
localStorage.setItem('temo_pagos',JSON.stringify(TODOS));
}else{
let merge=[...guardados];
TODOS.forEach(n=>{
if(!merge.find(e=>e.nombre.toLowerCase().trim()===n.nombre.toLowerCase().trim())){
merge.push(n);
}
});
localStorage.setItem('temo_pagos',JSON.stringify(merge));
}
function getProds(){return JSON.parse(localStorage.getItem('temo_prods'))}function setProds(p){localStorage.setItem('temo_prods',JSON.stringify(p));render();renderPagosFront();autoSaveStatus()}
function getPagos(){return JSON.parse(localStorage.getItem('temo_pagos'))}function setPagos(p){localStorage.setItem('temo_pagos',JSON.stringify(p));renderPagosFront();renderPagos();autoSaveStatus()}
function getKeys(){try{return JSON.parse(localStorage.getItem('temo_keys')||'{}')}catch(e){return{}}}function setKeys(k){localStorage.setItem('temo_keys',JSON.stringify(k));autoSaveStatus()}
function render(){let prods=getProds();let keys=getKeys();let c=document.getElementById('lista');c.innerHTML='';prods.forEach(p=>{let s=0;p.ps.forEach(pl=>s+=(keys[pl.id]?keys[pl.id].length:0));let d=document.createElement('div');d.className='prod';d.innerHTML='<div><b style=text-shadow:0 0 20px #f00>'+p.i+' '+p.n+'</b><br><small>Stock: '+s+'</small></div><button class=btn onclick=ver(\''+p.id+'\')>VER</button>';c.appendChild(d)})}
function renderPagosFront(){let pagos=getPagos();let c=document.getElementById('pagosFront');c.innerHTML='<div class=pagosBox><h3 style="color:#f00;text-align:center;text-shadow:0 0 30px #f00">💳 '+pagos.length+' BANCOS - TODO ROJO NEON</h3>'+pagos.map(p=>'<div class=pagoItem><b>'+p.nombre+'</b><span style=color:#f00;font-weight:900;text-shadow:0 0 15px #f00">'+(p.dato||'VACIO')+'</span></div>').join('')+'</div>'}
render();renderPagosFront();
function ver(pid){let p=getProds().find(x=>x.id===pid);document.getElementById('planTitle').innerText=p.i+' '+p.n;let l=document.getElementById('planList');l.innerHTML='';p.ps.forEach(pl=>{let div=document.createElement('div');div.style.cssText='display:flex;justify-content:space-between;align-items:center;background:#000;border:3px solid #f00;padding:14px;border-radius:14px;margin:10px 0;box-shadow:0 0 30px #f00';div.innerHTML='<div><b>'+pl.d+'</b><br><b style=color:#f00>$'+pl.p+'</b></div><a href="https://wa.me/523224528803?text=Hola%20quiero%20'+encodeURIComponent(p.n+' '+pl.d)+'" target="_blank" style="padding:12px 18px;background:#f00;color:#fff;border-radius:24px;text-decoration:none;font-weight:900">COMPRAR</a>';l.appendChild(div)});document.getElementById('planModal').style.display='flex'}
if(location.search.includes('temo7'))document.getElementById('loginAdmin').style.display='flex';
function checkAdmin(){if(document.getElementById('adminUser').value==="TEMOSTOR"&&document.getElementById('adminPass').value==="TEMOSTOR"){document.getElementById('loginAdmin').style.display='none';document.getElementById('admin').style.display='block';renderAdmin();renderPagos();}}
function crearProducto(){let n=document.getElementById('newProdName').value.trim().toUpperCase();let i=document.getElementById('newProdIcon').value.trim()||'🔥';if(!n)return;let pr=getProds();pr.push({n:n,i:i,id:n.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-'+Date.now(),ps:[]});setProds(pr);document.getElementById('newProdName').value='';renderAdmin();}
function renderPagos(){let pagos=getPagos();let c=document.getElementById('pagosList');c.innerHTML='';pagos.forEach((p,i)=>{let d=document.createElement('div');d.className='barraDespliegue';d.innerHTML=`<input id="pagoN-${i}" value="${p.nombre}" class="barraInput" style="flex:1" oninput="autoSaveStatus()"><input id="pagoD-${i}" value="${p.dato}" class="barraInput" style="flex:1" placeholder="NUMERO" oninput="autoSaveStatus()"><button onclick="savePago(${i})" style="width:54px;height:54px;background:#f00;color:#fff;border:none;border-radius:13px;box-shadow:0 0 20px #f00">💾</button><button onclick="delPago(${i})" style="width:54px;height:54px;background:#000;border:3px solid #f00;color:#f00;border-radius:13px">X</button>`;c.appendChild(d);});}
function addBarraPago(){let cont=document.getElementById('contPagos');let id='pago-'+Date.now();let paises=Object.keys(BANCOS_POR_PAIS);let d=document.createElement('div');d.id='row-'+id;d.className='barraDespliegueCol';d.innerHTML=`<div style="display:flex;gap:9px;width:100%;flex-wrap:wrap"><select id="paisSel-${id}" onchange="cambiarBancos('${id}')" class="barraInput" style="flex:1;border:4px solid #f00;color:#f00"><option value="">🌎 PAIS</option>${paises.map(p=>`<option value="${p}">${p}</option>`).join('')}</select><select id="bancoSel-${id}" onchange="autoFill('${id}')" class="barraInput" style="flex:1;border:4px solid #f00;color:#f00"><option value="">🏦 BANCO</option></select></div><div style="display:flex;gap:9px;width:100%"><input id="newPN-${id}" class="barraInput" style="flex:1;border:4px solid #f00" placeholder="Nombre"><input id="newPD-${id}" class="barraInput" style="flex:1;border:4px solid #f00" placeholder="NUMERO"><button onclick="guardarNuevoPago('${id}')" style="width:70px;height:70px;background:#f00;color:#fff;border:none;border-radius:18px;font-size:34px;box-shadow:0 0 40px #f00">✔</button><button onclick="document.getElementById('row-${id}').remove()" style="width:56px;height:56px;background:#000;border:3px solid #f00;color:#f00;border-radius:13px">X</button></div>`;cont.appendChild(d);d.scrollIntoView({behavior:'smooth'});}
function cambiarBancos(id){let pais=document.getElementById('paisSel-'+id).value;let sel=document.getElementById('bancoSel-'+id);sel.innerHTML='<option value="">🏦 BANCO</option>';if(BANCOS_POR_PAIS[pais]){BANCOS_POR_PAIS[pais].forEach(b=>{let o=document.createElement('option');o.value=b;o.innerText=b;sel.appendChild(o);});}}
function autoFill(id){let pais=document.getElementById('paisSel-'+id).value;let banco=document.getElementById('bancoSel-'+id).value;let input=document.getElementById('newPN-'+id);if(banco)input.value=pais+' - '+banco.replace(' 1150540078','');}
function guardarNuevoPago(id){let n=document.getElementById('newPN-'+id).value.trim();let d=document.getElementById('newPD-'+id).value.trim();if(!n||!d)return;let p=getPagos();p.push({nombre:n.toUpperCase(),dato:d});setPagos(p);document.getElementById('row-'+id).remove();}
function savePago(i){let p=getPagos();p[i].nombre=document.getElementById(`pagoN-${i}`).value.toUpperCase();p[i].dato=document.getElementById(`pagoD-${i}`).value;setPagos(p);}
function delPago(i){if(!confirm('Borrar banco?'))return;let p=getPagos();p.splice(i,1);setPagos(p);}
function renderAdmin(){let prods=getProds();let keys=getKeys();let c=document.getElementById('aList');c.innerHTML='';prods.forEach(p=>{let card=document.createElement('div');card.className='cardA';let html=`<div style="display:flex;gap:9px"><input id="name-${p.id}" value="${p.n}" class="barraInput" style="flex:1"><input id="icon-${p.id}" value="${p.i}" class="barraInput" style="width:80px;text-align:center"><button onclick="saveName('${p.id}')" style="width:64px;height:64px;background:#f00;color:#fff;border:none;border-radius:14px">💾</button><button onclick="delProd('${p.id}')" style="width:64px;height:64px;background:#000;border:3px solid #f00;color:#f00;border-radius:14px">X</button></div><div style="margin:16px 0 8px;display:flex;gap:12px;align-items:center"><div style="flex:1;color:#f00;font-weight:900">🔴 DURACIONES:</div><button class="btnPlus" onclick="addBarra('${p.id}')">+</button></div><div id="cont-${p.id}">`;p.ps.forEach(pl=>{html+=`<div class="barraDespliegue"><input id="d-${pl.id}" value="${pl.d}" class="barraInput" style="flex:1"><input id="p-${pl.id}" type="number" value="${pl.p}" class="barraInput" style="width:115px"><button onclick="savePlan('${p.id}','${pl.id}')" style="width:54px;height:54px;background:#f00;color:#fff;border:none;border-radius:13px">💾</button><button onclick="delPlan('${p.id}','${pl.id}')" style="width:54px;height:54px;background:#000;border:3px solid #f00;color:#f00;border-radius:13px">X</button></div><textarea id="ta-${pl.id}" style="width:100%;min-height:65px;background:#000;border:3px solid #f00;color:#fff;border-radius:11px;padding:10px;margin-bottom:13px">${(keys[pl.id]?keys[pl.id].join('\n'):'')}</textarea><button onclick="saveKeys('${pl.id}')" style="width:100%;padding:11px;background:#000;border:3px solid #f00;color:#f00;border-radius:11px;margin-bottom:16px;font-weight:900">💾 GUARDAR KEYS (${keys[pl.id]?keys[pl.id].length:0})</button>`;});html+=`</div>`;card.innerHTML=html;c.appendChild(card)});}
function addBarra(pid){let cont=document.getElementById('cont-'+pid);let id='temp-'+Date.now();let d=document.createElement('div');d.id='row-'+id;d.className='barraDespliegue';d.innerHTML=`<input id="newD-${id}" class="barraInput" style="flex:1;border:4px solid #f00" placeholder="EJ: 7 DIAS"><input id="newP-${id}" type="number" class="barraInput" style="width:115px;border:4px solid #f00" placeholder="$"><button onclick="guardarNuevaBarra('${pid}','${id}')" style="width:70px;height:70px;background:#f00;color:#fff;border:none;border-radius:18px;font-size:34px">✔</button><button onclick="document.getElementById('row-${id}').remove()" style="width:54px;height:54px;background:#000;border:3px solid #f00;color:#f00;border-radius:13px">X</button>`;cont.appendChild(d);}
function guardarNuevaBarra(pid,id){let d=document.getElementById('newD-'+id).value.trim().toUpperCase();let pr=parseInt(document.getElementById('newP-'+id).value);if(!d||isNaN(pr))return;let prods=getProds();prods.find(x=>x.id===pid).ps.push({id:pid+'-'+Date.now(),d:d,p:pr});setProds(prods);renderAdmin();}
function saveName(pid){let prods=getProds();let p=prods.find(x=>x.id===pid);p.n=document.getElementById('name-'+pid).value.toUpperCase();p.i=document.getElementById('icon-'+pid).value;setProds(prods);renderAdmin()}
function delProd(pid){setProds(getProds().filter(x=>x.id!==pid));renderAdmin()}
function savePlan(pid,plid){let pl=getProds().find(x=>x.id===pid).ps.find(x=>x.id===plid);pl.d=document.getElementById('d-'+plid).value.toUpperCase();pl.p=parseInt(document.getElementById('p-'+plid).value);setProds(getProds());}
function delPlan(pid,plid){let p=getProds().find(x=>x.id===pid);p.ps=p.ps.filter(x=>x.id!==plid);setProds(getProds());renderAdmin();}
function saveKeys(id){let lines=document.getElementById('ta-'+id).value.split('\n').map(s=>s.trim()).filter(s=>s);let k=getKeys();k[id]=lines;setKeys(k);render();renderAdmin();}
function autoSaveStatus(){let s=document.getElementById('saveStatus');if(!s)return;s.innerText='💾 GUARDANDO...';setTimeout(()=>{s.innerText='✅ GUARDADO - '+new Date().toLocaleTimeString()+' - Todo se guarda solo';},700);}
function guardarConfig(){localStorage.setItem('temo_prods',JSON.stringify(getProds()));localStorage.setItem('temo_pagos',JSON.stringify(getPagos()));localStorage.setItem('temo_keys',JSON.stringify(getKeys()));document.getElementById('saveStatus').innerText='✅ CONFIGURACION GUARDADA - '+new Date().toLocaleTimeString();alert('✅ GUARDADO\nProductos:'+getProds().length+'\nBancos:'+getPagos().length);}
function descargarBackup(){let data={prods:getProds(),pagos:getPagos(),keys:getKeys(),fecha:new Date().toISOString()};let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download='TEMO-V35-BACKUP-'+new Date().toISOString().slice(0,10)+'.json';a.click();}
function cargarBackup(e){let file=e.target.files[0];if(!file)return;let r=new FileReader();r.onload=function(ev){try{let data=JSON.parse(ev.target.result);if(data.prods)localStorage.setItem('temo_prods',JSON.stringify(data.prods));if(data.pagos)localStorage.setItem('temo_pagos',JSON.stringify(data.pagos));if(data.keys)localStorage.setItem('temo_keys',JSON.stringify(data.keys));alert('✅ RESTAURADO');location.reload();}catch{alert('❌ Archivo invalido');}};r.readAsText(file);}
setInterval(()=>{if(document.getElementById('admin').style.display==='block'){localStorage.setItem('temo_prods',JSON.stringify(getProds()));localStorage.setItem('temo_pagos',JSON.stringify(getPagos()));localStorage.setItem('temo_keys',JSON.stringify(getKeys()));let s=document.getElementById('saveStatus');if(s)s.innerText='✅ AUTOGUARDADO - '+new Date().toLocaleTimeString();}},3000);
</script></body></html>
