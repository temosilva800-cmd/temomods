<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TEMO STORE - OFICIAL</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@keyframes slideDown{0%{opacity:0;transform:translateY(-15px) scale(0.95)}100%{opacity:1;transform:translateY(0) scale(1)}}
.anim-open{animation:slideDown 0.35s cubic-bezier(0.34,1.56,0.64,1) forwards}
</style>
</head>
<body class="bg-[#0a0a0a] text-white">
<header class="bg-gradient-to-r from-red-700 to-red-500 p-3 sticky top-0 z-50">
<div class="max-w-6xl mx-auto flex justify-between items-center">
<div class="flex gap-2 items-center"><span>🔥</span><b class="tracking-widest">TEMO STORE</b><span class="bg-black text-[8px] px-2 py-1 rounded-full">OFICIAL</span></div>
<div class="flex gap-2"><span id="saldoDisplay" class="bg-black/80 px-3 py-1.5 rounded-full text-xs border border-white/20">💰 $0</span><button id="cartBtn" class="bg-white text-black px-4 py-1.5 rounded-full font-black text-sm">🛒 <span id="cartCount">0</span></button></div>
</div>
</header>

<div class="max-w-6xl mx-auto p-3">
<div class="bg-gradient-to-br from-zinc-900 to-black border border-red-600/50 rounded-[20px] p-4">
<h1 class="text-2xl font-black">BIENVENIDO A <span class="text-red-500">TEMO STORE</span> 🔥</h1>
<p class="text-[11px] text-zinc-400">Las mejores herramientas Free Fire - Entrega inmediata</p>
<div class="flex gap-2 mt-3"><span class="bg-green-500/20 text-green-400 text-[10px] px-3 py-1 rounded-full border border-green-500/30">⚡ ENTREGA AUTO</span><span class="bg-blue-500/20 text-blue-400 text-[10px] px-3 py-1 rounded-full border border-blue-500/30">🛡️ SEGURO</span></div>
</div>

<div class="bg-zinc-900 border border-zinc-800 rounded-[20px] p-3 mt-3">
<div class="flex gap-2">
<input id="userId" placeholder="TEMO-XXXX" class="flex-1 bg-black border border-zinc-700 p-3 rounded-full text-white font-bold uppercase text-xs outline-none">
<button id="btnCopiar" class="bg-white text-black px-4 rounded-full font-black text-xs">📋</button>
</div>
<button id="btnCrear" class="bg-gradient-to-r from-yellow-400 to-orange-400 text-black w-full py-3.5 rounded-full font-black mt-2">🎲 CREAR TU ID UNICO</button>
<div class="grid grid-cols-2 gap-2 mt-2">
<button id="btnHistorial" class="bg-zinc-800 border border-zinc-700 py-3 rounded-full text-[11px] font-bold">📜 HISTORIAL</button>
<button id="btnResetear" class="bg-zinc-800 border border-yellow-400/50 py-3 rounded-full text-[11px] font-bold text-yellow-400">♻️ RESETEAR</button>
</div>
<p id="miIdTexto" class="text-[10px] text-center mt-2 text-zinc-400"></p>
</div>

<input id="buscador" placeholder="Buscar DRIP, CUBAN, VLT..." class="w-full bg-zinc-900 border border-zinc-800 p-3 rounded-full text-xs mt-3 outline-none">
<h2 class="font-black text-sm mt-4 mb-3">🔥 PRODUCTOS DISPONIBLES</h2>
<div id="productos" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
</div>

<!-- MODALES -->
<div id="cartModal" class="fixed inset-0 bg-black/80 hidden z-50 flex items-end justify-center"><div class="bg-white text-black w-full max-w-md rounded-t-[20px] p-4"><div id="cartItems" class="text-sm"></div><div id="cartTotal" class="font-black mt-3 text-lg"></div><button id="checkout" class="bg-green-500 text-white w-full p-3 rounded-full mt-3 font-black">COMPRAR AHORA</button><button onclick="cartModal.classList.add('hidden')" class="w-full mt-2 text-xs text-zinc-500">Cerrar</button></div></div>

<div id="keyModal" class="fixed inset-0 bg-black/95 hidden z-50 flex items-center justify-center p-4"><div class="bg-zinc-900 border-2 border-red-600 w-full max-w-md rounded-[20px] p-5 text-center"><h2 class="font-black text-green-400 text-lg">COMPRA EXITOSA 🔥</h2><div id="keysEntregadas" class="bg-black rounded-xl p-3 mt-3 text-left text-xs"></div><button onclick="keyModal.classList.add('hidden')" class="bg-red-600 w-full mt-4 py-3 rounded-full font-black">LISTO</button></div></div>

<div id="historialModal" class="fixed inset-0 bg-black/90 hidden z-50 flex items-center justify-center p-4"><div class="bg-zinc-900 border border-zinc-700 w-full max-w-md rounded-[20px] p-4 max-h-[85vh] flex flex-col"><div class="flex justify-between items-center"><b>📜 TU HISTORIAL</b><button onclick="historialModal.classList.add('hidden')" class="bg-red-600 px-3 py-1 rounded-full text-xs">X</button></div><div id="historialLista" class="mt-3 grid gap-3 text-[11px] overflow-auto flex-1"></div><button id="btnResetDesdeHistorial" class="bg-yellow-400 text-black w-full py-3 rounded-full font-black text-xs mt-3">♻️ RESETEAR POR WHATSAPP</button></div></div>

<div id="adminPanel" class="hidden fixed inset-0 bg-black z-[100] overflow-auto p-4"><div class="max-w-md mx-auto bg-zinc-900 p-4 rounded-2xl border-2 border-green-500 mt-6"><div class="flex justify-between"><b class="text-green-400">ADMIN TEMO</b><button onclick="location.href='/'" class="bg-red-600 px-3 py-1 rounded-full text-xs">X</button></div><div id="loginDiv" class="mt-3 space-y-2"><input id="adminUser" placeholder="Usuario" class="w-full p-3 rounded text-black"><input id="pass" type="password" placeholder="Contraseña" class="w-full p-3 rounded text-black"><button id="btnLogin" class="bg-white text-black w-full p-3 rounded-full font-black mt-2">ENTRAR</button></div><div id="panel" class="hidden mt-3"><button onclick="restaurarTodo()" class="bg-green-500 w-full py-2 rounded-full font-black text-xs">✅ RESTAURAR PRECIOS BASE</button><div class="bg-blue-500/10 border border-blue-500 rounded-xl p-2 mt-2"><div class="flex gap-1"><input id="recargaId" placeholder="TEMO-XXXX" class="flex-1 p-2 rounded text-black text-xs"><input id="recargaMonto" type="number" placeholder="$" class="w-16 p-2 rounded text-black"><button id="btnRecarga" class="bg-green-500 px-3 rounded-full">+</button></div><div class="flex gap-1 mt-2"><input id="verHistorialId" placeholder="ID para ver/reset" class="flex-1 p-2 rounded text-black text-xs"><button id="btnVerHistorialAdmin" class="bg-blue-500 px-3 rounded-full text-xs">VER</button><button id="btnResetAdmin" class="bg-red-600 px-3 rounded-full text-xs">RESET</button></div><div id="historialAdmin" class="bg-black rounded p-2 mt-2 text-[10px] max-h-40 overflow-auto"></div></div><div id="lista" class="grid gap-2 mt-3"></div></div></div></div>

<script>
// === TIENDA LOCAL - SIEMPRE SE VE ===
const BASE_FIJO={drip:{nombre:"DRIP",icono:"💧",opciones:[{dias:1,precio:4,keys:[]},{dias:7,precio:12,keys:[]},{dias:15,precio:15,keys:[]},{dias:30,precio:20,keys:[]}]},cuban:{nombre:"CUBAN",icono:"🇨🇺",opciones:[{dias:1,precio:3,keys:[]},{dias:7,precio:5,keys:[]},{dias:30,precio:10,keys:[]}]},hg:{nombre:"HG",icono:"⚡",opciones:[{dias:1,precio:5,keys:[]},{dias:10,precio:12,keys:[]},{dias:30,precio:18,keys:[]}]},vlt:{nombre:"VLT",icono:"🔮",opciones:[{dias:1,precio:5,keys:[]},{dias:7,precio:12,keys:[]},{dias:30,precio:25,keys:[]}]},pato:{nombre:"PATO",icono:"🦆",opciones:[{dias:30,precio:14,keys:[]}]},flourite:{nombre:"FLOURITE",icono:"💎",opciones:[{dias:7,precio:30,keys:[]},{dias:30,precio:50,keys:[]}]}};
let preciosLocal=BASE_FIJO; let cart=[];
window.toggleOpts=(id)=>{let el=document.getElementById('opts_'+id); let btn=document.getElementById('btn_'+id); let card=document.getElementById('card_'+id); if(el.classList.contains('hidden')){el.classList.remove('hidden'); el.classList.add('anim-open'); btn.innerText='✕'; card.classList.add('border-red-600'); card.classList.remove('border-zinc-800');}else{el.classList.add('hidden'); el.classList.remove('anim-open'); btn.innerText='VER'; card.classList.remove('border-red-600'); card.classList.add('border-zinc-800');}};
function renderTiendaLocal(filtro=""){let c=document.getElementById('productos'); if(!c) return; c.innerHTML=''; Object.entries(preciosLocal).forEach(([id,prod])=>{ if(filtro&&!prod.nombre.toLowerCase().includes(filtro.toLowerCase())) return; let ops=(prod.opciones||[]).sort((a,b)=>a.dias-b.dias); let html=''; ops.forEach((op,i)=>{ html+=`<div class="flex justify-between items-center bg-black/50 rounded-full p-1.5 pl-4 mt-2 border border-zinc-800"><div><b class="text-[11px]">${op.dias} DIAS</b><p class="text-green-400 font-black text-xs">$${op.precio} MXN • ${op.keys?.length||0} keys</p></div><button onclick="addCart('${id}','${prod.nombre}',${op.precio},${op.dias},${i})" class="bg-white text-black px-5 py-2 rounded-full font-black text-[10px]">COMPRAR</button></div>`}); c.innerHTML+=`<div id="card_${id}" class="bg-gradient-to-br from-zinc-900 to-black border border-zinc-800 rounded-[20px] p-4"><div class="flex justify-between items-center cursor-pointer" onclick="toggleOpts('${id}')"><div class="flex items-center gap-3"><div class="w-12 h-12 bg-red-600/20 rounded-full flex items-center justify-center text-xl">${prod.icono}</div><div><b class="text-sm">${prod.nombre}</b><p class="text-[10px] text-zinc-500">${ops.length} planes</p></div></div><span id="btn_${id}" class="bg-red-600 px-4 py-1.5 rounded-full text-[10px] font-black">VER</span></div><div id="opts_${id}" class="hidden mt-3">${html}</div></div>`; });}
window.addCart=(id,n,p,d,i)=>{cart.push({id,n,p,d,idx:i}); document.getElementById('cartCount').innerText=cart.length; let h='',t=0; cart.forEach(x=>{h+=`<div class='flex justify-between py-1'><span>${x.n} ${x.d}D</span><span class='font-black'>$${x.p}</span></div>`;t+=x.p}); document.getElementById('cartItems').innerHTML=h; document.getElementById('cartTotal').innerText='Total $'+t; document.getElementById('cartModal').classList.remove('hidden');};
renderTiendaLocal();
document.getElementById('buscador').oninput=e=>renderTiendaLocal(e.target.value);
document.getElementById('cartBtn').onclick=()=>{ let h='',t=0; cart.forEach(x=>{h+=`<div class='flex justify-between'><span>${x.n} ${x.d}D</span><span>$${x.p}</span></div>`;t+=x.p}); document.getElementById('cartItems').innerHTML=h; document.getElementById('cartTotal').innerText='Total $'+t; document.getElementById('cartModal').classList.remove('hidden'); };
function actualizarUI(id,saldo){document.getElementById('saldoDisplay').innerText="💰 $"+saldo;document.getElementById('miIdTexto').innerHTML=`Tu ID: <b>${id}</b> | $${saldo}`;document.getElementById('userId').value=id;document.getElementById('btnCrear').innerText="✅ ID: "+id;document.getElementById('btnCrear').disabled=true;document.getElementById('btnCrear').style.opacity="0.5";}
document.getElementById('btnCrear').onclick=()=>{let ex=localStorage.getItem('temo_id');if(ex){alert("Ya tienes ID: "+ex);actualizarUI(ex,localStorage.getItem('temo_saldo')||0);return;}let c="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",r="";for(let i=0;i<5;i++)r+=c[Math.floor(Math.random()*c.length)];let id="TEMO-"+r;localStorage.setItem('temo_id',id);localStorage.setItem('temo_saldo',"0");localStorage.setItem('temo_historial',JSON.stringify([]));alert("Tu ID creado: "+id);actualizarUI(id,0);if(window.guardarFB)window.guardarFB(id);};
document.getElementById('btnCopiar').onclick=()=>{let id=document.getElementById('userId').value||localStorage.getItem('temo_id');if(!id)return alert("Crea ID primero");navigator.clipboard.writeText(id).then(()=>alert("Copiado: "+id));};
document.getElementById('btnHistorial').onclick=()=>{let id=localStorage.getItem('temo_id');if(!id)return alert("Crea ID primero");let hist=JSON.parse(localStorage.getItem('temo_historial')||"[]");let cont=document.getElementById('historialLista');cont.innerHTML='';if(hist.length===0)cont.innerHTML='<p class="text-center py-10 text-zinc-500">Sin compras</p>';else hist.slice().reverse().forEach(h=>{let fecha=new Date(h.fecha).toLocaleString();let num="523224528803";let msg=`Hola Temo quiero resetear esta KEY%0A%0AID: ${id}%0APRODUCTO: ${h.producto} ${h.dias}D%0AKEY: ${h.key}%0AFecha: ${fecha}`;cont.innerHTML+=`<div class="bg-black p-3 rounded-xl border border-zinc-800 anim-open"><div class="flex justify-between"><div><b>${h.producto}</b> - ${h.dias}D<br><span class="text-[9px] text-zinc-400">${fecha}</span><br><span class="font-mono text-[10px] text-green-400 break-all">${h.key||''}</span></div><div class="text-green-400 font-black">$${h.precio}</div></div><a href="https://wa.me/${num}?text=${msg}" target="_blank" class="bg-yellow-400 text-black block text-center py-2.5 rounded-full text-[10px] font-black mt-3">♻️ RESETEAR ESTA KEY</a></div>`;});document.getElementById('historialModal').classList.remove('hidden');};
document.getElementById('btnResetear').onclick=()=>{let id=localStorage.getItem('temo_id');if(!id)return alert("Crea ID primero");let hist=JSON.parse(localStorage.getItem('temo_historial')||"[]");let ultima=hist[hist.length-1];let keyTxt=ultima?`%0AKEY: ${ultima.key}%0AProducto: ${ultima.producto}`:'';let num="523224528803";let msg=`Hola Temo quiero resetear mi dispositivo%0AID: ${id}${keyTxt}`;window.open(`https://wa.me/${num}?text=${msg}`,"_blank");};
document.getElementById('btnResetDesdeHistorial').onclick=()=>{let id=localStorage.getItem('temo_id');if(!id)return;let num="523224528803";let msg=`Hola Temo quiero resetear mi dispositivo%0AID: ${id}`;window.open(`https://wa.me/${num}?text=${msg}`,"_blank");};
let idG=localStorage.getItem('temo_id');if(idG)actualizarUI(idG,localStorage.getItem('temo_saldo')||0);
</script>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,collection,doc,setDoc,getDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyDFsZ812v6bExs5VkjOA5T3YIBoW_0zGeU",authDomain:"temo-store-5b025.firebaseapp.com",projectId:"temo-store-5b025",storageBucket:"temo-store-5b025.firebasestorage.app",messagingSenderId:"18400776607",appId:"1:18400776607:web:79cc6e9e716afcd41c6daa"};
const app=initializeApp(firebaseConfig),db=getFirestore(app);
window.guardarFB=async(id)=>{try{await setDoc(doc(db,"users",id),{saldo:0,creado:Date.now(),historial:[]},{merge:true});}catch(e){}};
async function cargarFB(id){try{let s=await getDoc(doc(db,"users",id));if(!s.exists())return;localStorage.setItem('temo_saldo',s.data().saldo||0);localStorage.setItem('temo_historial',JSON.stringify(s.data().historial||[]));actualizarUI(id,s.data().saldo||0);}catch(e){}}
let id=localStorage.getItem('temo_id');if(id)cargarFB(id);
try{onSnapshot(collection(db,"temo_precios"),snap=>{ if(!snap.empty){ let tmp={}; snap.forEach(d=>{if(d.data().opciones)tmp[d.id]=d.data()}); if(Object.keys(tmp).length>0){ preciosLocal=tmp; renderTiendaLocal(document.getElementById('buscador').value); if(document.getElementById('panel')&&!document.getElementById('panel').classList.contains('hidden'))renderAdminFirebase(tmp); } } });}catch(e){}
window.renderAdminFirebase=(precios)=>{let h='';Object.entries(precios).forEach(([id,prod])=>{let o='';(prod.opciones||[]).forEach((op,i)=>{o+=`<div class="bg-zinc-800 rounded p-2 mt-2"><b class="text-[10px] text-yellow-400">${op.dias}D $${op.precio} - ${op.keys?.length||0} keys</b><textarea id="keys_${id}_${i}" class="w-full p-1 rounded text-black text-[10px] h-12 mt-1" placeholder="Pega keys una por linea"></textarea><button onclick="addKeys('${id}',${i})" class="bg-green-500 w-full py-1 rounded-full text-[9px] font-black mt-1">GUARDAR KEYS</button></div>`});h+=`<div class="bg-black p-2 rounded border border-zinc-700"><b>${prod.nombre} (${id})</b>${o}</div>`});document.getElementById('lista').innerHTML=h;};
window.addKeys=async(id,i)=>{let txt=document.getElementById('keys_'+id+'_'+i).value.trim();if(!txt)return;let r=doc(db,"temo_precios",id);let s=await getDoc(r);let p=s.data();let n=txt.split('\n').map(k=>k.trim()).filter(k=>k);p.opciones[i].keys=[...(p.opciones[i].keys||[]),...n];await setDoc(r,p);alert(n.length+" keys guardadas");};
window.restaurarTodo=async()=>{for(let id in BASE_FIJO){await setDoc(doc(db,"temo_precios",id),BASE_FIJO[id])}alert("Precios restaurados
if(new URLSearchParams(window.location.search).get('admin')==='Temo2007')
