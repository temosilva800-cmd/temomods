<!doctype html>
<html lang=es>
<head>
<meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1">
<title>TEMO STORE - OFICIAL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:Arial,sans-serif}
.header{background:#000;border-bottom:3px solid #f00;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
.logo{font-weight:900;font-size:20px}.logo span{color:#f00}
.hero{background:linear-gradient(135deg,#000,#1a0000);padding:18px;text-align:center}
.hero h1{font-size:22px;font-weight:900}
.badge{display:inline-block;background:#f00;color:#fff;padding:3px 8px;border-radius:12px;font-size:9px;font-weight:900;margin:2px}
.card{max-width:600px;margin:10px auto;background:#111;border-radius:12px;padding:12px;border:1px solid #222}
.card-green{border:2px solid #0f0}.card-yellow{border:2px solid #f3ba2f}
.b{width:100%;padding:12px;border-radius:10px;font-weight:900;border:none;margin-top:6px;cursor:pointer;display:block;text-align:center;text-decoration:none}
.buy{background:linear-gradient(90deg,#f00,#ff3300);color:#fff}
.w{background:#25D366;color:#fff}
.n{background:#000;padding:10px;border-radius:8px;border:1px dashed #555;text-align:center;font-weight:900;margin:6px 0;word-break:break-all;font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.prod{background:#1a1a1a;border:1px solid #333;border-radius:10px;padding:8px;text-align:center}
.prod-title{font-size:11px;font-weight:900;min-height:22px}
.stock{font-size:9px;background:#000;border:1px solid #333;border-radius:6px;padding:3px 5px;display:inline-block;margin:3px 0;font-weight:700}
input,select,textarea{width:100%;padding:12px;margin:4px 0;background:#000;color:#fff;border:1px solid #333;border-radius:8px}
.sec
