<div id="revRegisterModal" class="modal"><div class="modalBox"><h2 style="color:#f00;text-align:center">👥 SER REVENDEDOR</h2><input id="regNombre" class="barraInput" placeholder="TU NOMBRE" style="margin:8px 0"><input id="regWhats" class="barraInput" placeholder="WHATSAPP" style="margin:8px 0"><input id="regCodigo" class="barraInput" placeholder="CODIGO chiri2370" style="margin:8px 0"><button onclick="registrarRevPublico()" class="btnNeonSolid">✅ CREAR</button><button onclick="closeModal('revRegisterModal')" class="btnNeonRed" style="margin-top:10px">CERRAR</button></div></div>
<div id="revPanelModal" class="modal"><div class="modalBox"><h2 id="revPanelTitle" style="color:#f00;text-align:center"></h2><div id="revPanelBody"></div><button onclick="closeModal('revPanelModal')" class="btnNeonRed">CERRAR</button></div></div>
<div id="ventaModal" class="modal"><div class="modalBox"><h2 style="color:#f00;text-align:center">✅ YA HICE UNA VENTA</h2><input id="ventaProducto" class="barraInput" placeholder="Que vendiste?" style="margin:8px 0"><input id="ventaPrecio" type="number" class="barraInput" placeholder="Precio?" style="margin:8px 0"><button onclick="confirmarVenta()" class="btnNeonSolid">🔥 REGISTRAR</button><button onclick="closeModal('ventaModal')" class="btnNeonRed">CANCELAR</button></div></div>
<div id="planModal" class="modal"><div class="modalBox"><h2 id="planTitle" style="color:#f00;text-align:center"></h2><div id="planList"></div><button onclick="closeModal('planModal')" class="btnNeonRed">CERRAR</button></div></div>

<div id="admin" style="position:fixed;inset:0;background:#000;z-index:10000;display:none;overflow:auto;padding:12px"><div style="max-width:900px;margin:auto"><h1 style="color:#f00;text-align:center">🔥 ADMIN V49 🔥</h1><div id="pagosList"></div><div id="revList"></div><div id="aList"></div><button onclick="location.href=location.pathname" class="btnNeonRed" style="margin:20px 0">SALIR</button></div></div>

<script>
function openModal(id){document.getElementById(id).style.display='flex'; console.log('Abriendo '+id);}
function closeModal(id){document.getElementById(id).style.display='none';}
const MI_NUMERO='523224528803';
function getRevs(){try{return JSON.parse(localStorage.getItem('temo_revs')||'[]')}catch(e){return[]}}
function setRevs(r){localStorage.setItem('temo_revs',JSON.stringify(r))}
function getProds(){return JSON.parse(localStorage.getItem('temo_prods')||'[{"n":"DRIP CLIENT","i":"💧","id":"drip","ps":[{"id":"drip-1d","d":"1 DIA","p":3}]}]')}
function getPagos(){return JSON.parse(localStorage.getItem('temo_pagos')||'[{"nombre":"BINANCE","dato":"1150540078"}]')}
function irAMiPanel(){let cod=document.getElementById('miPanelCodigo').value.trim().toLowerCase();if(!cod){alert('Pon codigo');return;}let r=getRevs().find(x=>x.codigo.toLowerCase()===cod);if(!r){alert('No existe '+cod);return;}closeModal('miPanelModal');location.href=location.pathname+'?panel='+cod;}
function registrarRevPublico(){let n=document.getElementById('regNombre').value.trim().toUpperCase();let w=document.getElementById('regWhats').value.trim();let c=document.getElementById('regCodigo').value.trim().toLowerCase();if(!n||!w||!c){alert('Llena todo');return;}let revs=getRevs();revs.push({nombre:n,codigo:c,whatsapp:w,ventas:0,ganancia:0});setRevs(revs);closeModal('revRegisterModal');alert('Creado');}
function render(){let p=getProds();let c=document.getElementById('lista');c.innerHTML='';p.forEach(x=>{let d=document.createElement('div');d.className='prod';d.innerHTML='<div><b>'+x.i+' '+x.n+'</b></div><button style="padding:10px 20px;background:#f00;color:#000;border:none;border-radius:20px;font-weight:900" onclick=ver("'+x.id+'")>VER</button>';c.appendChild(d)});let pagos=getPagos();document.getElementById('pagosFront').innerHTML='<div class=pagosBox>'+pagos.map(p=>'<div style="display:flex;justify-content:space-between;border:2px solid #f00;padding:10px;margin:6px 0;border-radius:10px"><b>'+p.nombre+'</b><span>'+p.dato+'</span></div>').join('')+'</div>';}
render();
let codAct='';
function mostrarPanelRev(codigo){codAct=codigo;let r=getRevs().find(x=>x.codigo.toLowerCase()===codigo.toLowerCase());if(!r) return;let log=JSON.parse(localStorage.getItem('temo_ventas_log')||'[]').filter(v=>v.codigo===codigo.toLowerCase());let link=location.origin+location.pathname+'?ref='+codigo;document.getElementById('revPanelTitle').innerText='👥 PANEL DE '+r.nombre;document.getElementById('revPanelBody').innerHTML='<div style="text-align:center"><button onclick=openModal("ventaModal") style="width:100%;padding:18px;background:#000;border:3px solid #f00;color:#f00;border-radius:15px;font-weight:900;box-shadow:0 0 20px #f00;margin:10px 0">✅ YA HICE UNA VENTA<br><small>AVISAR AL JEFE '+MI_NUMERO+'</small></button><div style="display:flex;gap:10px"><div style="flex:1;border:2px solid #f00;padding:14px;border-radius:15px"><b>'+(r.ventas||0)+'</b><br><small>VENTAS</small></div><div style="flex:1;border:2px solid #f00;padding:14px;border-radius:15px"><b>$'+(r.ganancia||0).toFixed(2)+'</b><br><small>GANADO</small></div></div><div style="margin-top:10px;border:2px dashed #f00;padding:10px;border-radius:12px;font-size:11px;word-break:break-all">'+link+'<br><button onclick=navigator.clipboard.writeText("'+link+'") style="margin-top:8px;padding:8px 14px;background:#f00;color:#000;border:none;border-radius:8px">COPIAR LINK</button></div><div style="margin-top:10px;max-height:180px;overflow:auto;text-align:left">'+(log.length?log.map(v=>'<div style="border-bottom:1px solid #f00;padding:6px 0"><small>📅 '+v.fecha+'<br>📦 '+v.producto+' $'+v.precio+' → $'+v.comision+'</small></div>').join(''):'<small>Sin ventas</small>')+'</div></div>';openModal('revPanelModal');}
function abrirVentaModal(c){codAct=c;openModal('ventaModal')}
function confirmarVenta(){let prod=document.getElementById('ventaProducto').value.trim();let prec=parseFloat(document.getElementById('ventaPrecio').value);if(!prod||!prec){alert('Llena');return;}let com=prec*0.15;let revs=getRevs();let idx=revs.findIndex(x=>x.codigo.toLowerCase()===codAct.toLowerCase());if(idx>=0){revs[idx].ventas++;revs[idx].ganancia+=com;setRevs(revs);let log=JSON.parse(localStorage.getItem('temo_ventas_log')||'[]');log.push({codigo:codAct.toLowerCase(),producto:prod,precio:prec,comision:com.toFixed(2),fecha:new Date().toLocaleString()});localStorage.setItem('temo_ventas_log',JSON.stringify(log));closeModal('ventaModal');window.open('https://wa.me/'+MI_NUMERO+'?text=VENTA '+revs[idx].nombre+' '+prod+' $'+prec+' com $'+com.toFixed(2),'_blank');mostrarPanelRev(codAct);}}
function ver(id){let p=getProds().find(x=>x.id===id);document.getElementById('planTitle').innerText=p.n;let l=document.getElementById('planList');l.innerHTML='';p.ps.forEach(pl=>{let d=document.createElement('div');d.style.cssText='display:flex;justify-content:space-between;align-items:center;border:2px solid #f00;padding:12px;margin:8px 0;border-radius:12px';d.innerHTML='<div><b>'+pl.d+'</b><br>$'+pl.p+'</div><a href="https://wa.me/'+MI_NUMERO+'" target="_blank" style="padding:10px 16px;background:#f00;color:#000;border-radius:20px;text-decoration:none">COMPRAR</a>';l.appendChild(d)});openModal('planModal');}
let params=new URLSearchParams(location.search);
if(params.has('panel')){mostrarPanelRev(params.get('panel'));}
if(params.has('temo7')){document.getElementById('loginAdmin').style.display='flex';}
function checkAdmin(){if(document.getElementById('adminUser').value==="TEMOSTOR"&&document.getElementById('adminPass').value==="TEMOSTOR"){document.getElementById('loginAdmin').style.display='none';document.getElementById('admin').style.display='block';}}
</script></body></html>
