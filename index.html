<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>TEMO STORE</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0a0a0a;color:#fff;font-family:Arial}.h{background:#000;border-bottom:3px solid red;padding:14px;text-align:center;font-weight:900;font-size:20px}.h span{color:red}.c{max-width:500px;margin:10px auto;background:#111;border-radius:12px;padding:12px;border:1px solid #222}.cg{border:2px solid #0f0}.b{width:100%;padding:12px;border-radius:10px;font-weight:900;border:none;margin-top:6px}.buy{background:red;color:#fff}.w{background:#25D366;color:#fff}input,select,textarea{width:100%;padding:12px;margin:4px 0;background:#000;color:#fff;border:1px solid #333;border-radius:8px}.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}.p{background:#1a1a1a;border:1px solid #333;border-radius:10px;padding:8px;text-align:center;font-size:12px}#adm{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:9999;overflow:auto;padding:12px}</style></head><body>
<div id=adm><h1 style="color:red;text-align:center">ADMIN</h1><div class=c style="border-color:#0f0"><input id=nu placeholder=usuario><input id=np placeholder=pass><input id=nm type=number placeholder=saldo><button onclick="cu()" class=b style=background:#0f0>CREAR</button><input id=au placeholder="usuario existente" style="margin-top:10px"><input id=am type=number placeholder=monto><button onclick="as()" class=b style=background:#0f0>DAR SALDO</button><div id=lu style="font-size:11px;margin-top:8px;background:#000;padding:6px"></div></div><button onclick="adm.style.display='none'" class=b style=background:#333>CERRAR</button></div>
<div class=h onclick="toc()">TEMO <span>STORE</span></div>
<div class="c cg" id=lc><input id=u placeholder=Usuario><input id=p type=password placeholder=Pass><button onclick="lg()" class=b style=background:#0f0>ENTRAR</button><input id=ru placeholder="Nuevo usuario"><input id=rp placeholder=Pass><button onclick="rg()" class=b style=background:#fa0>CREAR CUENTA</button><div id=msg style="color:#0f0;text-align:center"></div></div>
<div id=shop style=display:none><div class=c><div id=info style=background:#000;padding:10px;border-radius:8px;text-align:center></div><button onclick="localStorage.removeItem('ts');location.reload()" class=b style=background:#333>SALIR</button></div><div style="max-width:500px;margin:0 auto;padding:0 10px"><div class=g>
<div class=p><b>DRIP 1 DIA</b><br>$80<br><button onclick="by('DRIP 1 DIA',80)" class="b buy">COMPRAR</button></div>
<div class=p><b>DRIP 7 DIAS</b><br>$240<br><button onclick="by('DRIP 7 DIAS',240)" class="b buy">COMPRAR</button></div>
<div class=p><b>DRIP 15 DIAS</b><br>$350<br><button onclick="by('DRIP 15 DIAS',350)" class="b buy">COMPRAR</button></div>
<div class=p><b>DRIP 30 DIAS</b><br>$500<br><button onclick="by('DRIP 30 DIAS',500)" class="b buy">COMPRAR</button></div>
<div class=p><b>CUBAN 30 DIAS</b><br>$200<br><button onclick="by('CUBAN 30 DIAS',200)" class="b buy">COMPRAR</button></div>
<div class=p><b>PATO 30 DIAS</b><br>$280<br><button onclick="by('PATO 30 DIAS',280)" class="b buy">COMPRAR</button></div>
<div class=p><b>FLOURITE 7 DIAS</b><br>$150<br><button onclick="by('FLOURITE 7 DIAS',150)" class="b buy">COMPRAR</button></div>
<div class=p><b>FLOURITE 30 DIAS</b><br>$350<br><button onclick="by('FLOURITE 30 DIAS',350)" class="b buy">COMPRAR</button></div>
<div class=p style=border:2px solid #f3ba2f><b>💎 110 DIAM</b><br>$18<br><button onclick="by('110 DIAM',18)" class="b buy">COMPRAR</button></div>
<div class=p style=border:2px solid #f3ba2f><b>💎 341 DIAM</b><br>$56<br><button onclick="by('341 DIAM',56)" class="b buy">COMPRAR</button></div>
<div class=p style=border:2px solid #f3ba2f><b>💎 581 DIAM</b><br>$93<br><button onclick="by('581 DIAM',93)" class="b buy">COMPRAR</button></div>
<div class=p style=border:2px solid #f3ba2f><b>💎 1166 DIAM</b><br>$185<br><button onclick="by('1166 DIAM',185)" class="b buy">COMPRAR</button></div>
</div></div></div>
<script>
var cc=0;function toc(){cc++;if(cc>=5){adm.style.display='block';cc=0;up()}setTimeout(()=>cc=0,3000)}
function gu(){return JSON.parse(localStorage.getItem('tu')||'{}')}function su(o){localStorage.setItem('tu',JSON.stringify(o))}
function cu(){var u=nu.value.toLowerCase().trim(),p=np.value.trim(),m=+nm.value||0;if(!u||!p)return alert('Falta');var x=gu();x[u]={pass:p,saldo:m,keys:[]};su(x);alert(u+' $'+m);up()}
function as(){var u=au.value.toLowerCase().trim(),m=+am.value;var x=gu();if(!x[u])return alert('No existe');x[u].saldo+=m;su(x);alert(u+' $'+x[u].saldo);up()}
function rg(){var u=ru.value.toLowerCase().trim(),p=rp.value.trim();var x=gu();if(x[u])return alert('Ya existe');x[u]={pass:p,saldo:0,keys:[]};su(x);msg.innerHTML='Creado '+u;u_el=u;up()}
function lg(){var u=document.getElementById('u').value.toLowerCase().trim(),p=document.getElementById('p').value.trim(),x=gu();if(!x[u])return alert('No existe');if(x[u].pass!=p)return alert('Pass mal');localStorage.setItem('ts',u);sh()}
function sh(){var s=localStorage.getItem('ts');if(!s)return;var x=gu();lc.style.display='none';shop.style.display='block';info.innerHTML='👤 '+s+' | Saldo: <b style=color:#0f0>$'+x[s].saldo+'</b>';up()}
function by(pr,prc){var s=localStorage.getItem('ts'),x=gu();if(x[s].saldo<prc)return alert('Sin saldo $'+x[s].saldo);x[s].saldo-=prc;su(x);alert('Compra '+pr+' OK Saldo $'+x[s].saldo);sh()}
function up(){var x=gu(),h='';for(var k in x)h+=k+' $'+x[k].saldo+'<br>';lu.innerHTML=h}up();if(localStorage.getItem('ts'))sh();
</script></body></html>
