<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEMO STORE - OFICIAL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family: 'Segoe UI', sans-serif;}
body{background:#0f0f0f;color:#fff;padding-bottom:80px;}
.top{ background: linear-gradient(90deg, #ff0000, #8b0000); padding:12px 15px; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:100; }
.top h1{font-size:18px; letter-spacing:1px;}
.badge{ background:#000; padding:4px 10px; border-radius:20px; font-size:11px; margin-left:8px; border:1px solid #333;}
.saldo{ background:#000; border:1px solid #333; padding:6px 14px; border-radius:20px; font-weight:bold;}
.cart{ background:#fff; color:#000; padding:6px 14px; border-radius:20px; font-weight:bold; margin-left:8px;}
.banner{ margin:15px; background: linear-gradient(180deg, #1a1a1a, #0a0a0a); border:1px solid #333; border-radius:15px; padding:18px;}
.banner h2{font-size:22px;} .banner h2 span{color:#ff0000;}
.sub{color:#888; font-size:13px; margin-top:4px;}
.tags{display:flex; gap:8px; margin-top:12px;}
.tag{padding:6px 12px; border-radius:20px; font-size:12px; border:1px solid #333;}
.t1{background:#11291c; color:#2eff7a; border-color:#1a4d2e;} .t2{background:#1a1a4a; color:#8aa8ff; border-color:#2a2a6a;}
.box{ margin:15px; background:#1a1a1a; border:1px solid #2a2a2a; border-radius:15px; padding:15px;}
.input-id{display:flex; gap:8px;}
.input-id input{flex:1; background:#0f0f0f; border:1px solid #333; color:#fff; padding:12px; border-radius:10px; font-weight:bold;}
.btn-copy{background:#fff; border:none; border-radius:50%; width:44px; height:44px; cursor:pointer;}
.id-ok{ background: linear-gradient(90deg, #b8960f, #7a5a00); color:#000; text-align:center; padding:12px; border-radius:12px; margin-top:10px; font-weight:bold;}
.btns{display:flex; gap:10px; margin-top:12px;}
.btns button{flex:1; padding:10px; border-radius:20px; border:1px solid #333; background:#222; color:#fff; cursor:pointer;}
.btns button:last-child{color:#ffeb3b; border-color:#ffeb3b33;}
.search{margin:15px;}
.search input{width:100%; background:#1a1a1a; border:1px solid #2a2a2a; padding:14px; border-radius:12px; color:#fff;}
.product{margin:12px 15px; background:#1a1a1a; border:1px solid #2a2a2a; border-radius:15px; padding:15px; display:flex; align-items:center; justify-content:space-between;}
.p-left{display:flex; align-items:center; gap:12px;}
.icon{width:50px; height:50px; background:#2a1a1a; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:24px;}
.p-left b{font-size:16px;} .p-left small{color:#666; font-size:12px;}
.btn-ver{background:#e50914; color:#fff; border:none; padding:10px 18px; border-radius:20px; font-weight:bold; cursor:pointer;}
#adminPanel{display:none; position:fixed; inset:0; background:#0a0a0a; z-index:999; overflow:auto; padding:15px;}
.admin-card{background:#1a1a1a; border:1px solid #333; border-radius:12px; padding:12px; margin-bottom:12px;}
.admin-card h3{color:#2eff7a; margin-bottom:6px;}
.admin-card textarea{width:100%; background:#000; color:#0f0; border:1px solid #333; padding:8px; border-radius:8px; min-height:70px;}
.admin-card button{background:#2eff7a; color:#000; border:none; padding:8px 12px; border-radius:8px; font-weight:bold; margin-top:6px; cursor:pointer; width:100%;}
.login{max-width:400px; margin:50px auto; background:#1a1a1a; padding:20px; border-radius:15px; border:1px solid #333; text-align:center;}
.login input{width:100%; padding:12px; margin:6px 0; background:#000; border:1px solid #333; color:#fff; border-radius:8px;}
.login button{width:100%; padding:12px; background:#2eff7a; border:none; border-radius:8px; font-weight:bold; cursor:pointer; margin-top:10px;}
</style>
</head>
