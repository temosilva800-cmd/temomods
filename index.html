<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TEMO STORE</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-black text-white">
<header class="bg-red-600 p-3 flex justify-between sticky top-0 z-50"><b>TEMO STORE 🔥</b><div class="flex gap-2"><span id="saldoDisplay" class="bg-black px-2 py-1 rounded-full text-[10px] border">💰 $0</span><button id="cartBtn" class="bg-white text-black px-3 py-1 rounded-full font-black">🛒 <span id="cartCount">0</span></button></div></header>
<div class="max-w-md mx-auto p-3"><div class="flex gap-2 mb-2"><input id="userId" placeholder="TEMO-XXXX" class="flex-1 p-3 rounded-full text-black font-bold uppercase text-xs"><button id="btnCopiar" class="bg-white text-black px-3 rounded-full font-black text-xs">📋</button><button id="btnEntrar" class="bg-red-600 px-4 rounded-full font-black text-xs">ENTRAR</button></div><button id="btnCrear" class="bg-yellow-400 text-black w-full py-3 rounded-full font-black">🎲 CREAR TU ID</button><div class="flex gap-2 mt-2"><button id="btnHistorial" class="bg-zinc-800 border flex-1 py-2 rounded-full text-[10px]">📜 HISTORIAL</button><button id="btnResetear" class="bg-zinc-800 border border-yellow-400 flex-1 py-2 rounded-full text-[10px]">♻️ RESETEAR</button></div><p id="miIdTexto" class="text-[10px] text-center mt-2 text-zinc-400"></p></div>
<main id="productos" class="max-w-md mx-auto p-3 grid gap-3"></main>
<div id="adminPanel" class="hidden fixed inset-0 bg-black z-[100] overflow-auto p-4"><div class="max-w-md mx-auto bg-zinc-900 p-4 rounded-2xl border-2 border-green-500 mt-6"><div class="flex justify-between"><b class="text-green-400">ADMIN TEMO</b><button onclick="location.href='/'" class="bg-red-600 px-3 py-1 rounded-full text-xs">X CERRAR</button></div><div id="loginDiv" class="mt-3 space-y-2"><input id="adminUser" type="text" placeholder="Usuario" class="w-full p-3 rounded text-black"><input id="pass" type="password" placeholder="Contraseña" class="w-full p-3 rounded text-black"><button id="btnLogin" class="bg-white text-black w-full p-3 rounded-full font-black mt-2">ENTRAR ADMIN</button></div><div id="panel" class="hidden mt-3"><button onclick="restaurarTodo()" class="bg-green-500 w-full py-2 rounded-full font-black text-xs">✅ RESTAURAR PRODUCTOS</button><div class="bg-blue-500/10 border border-blue-500 rounded-xl p-2 mt-2"><div class="flex gap-1"><input id="recargaId" placeholder="TEMO-XXXX" class="flex-1 p-2 rounded text-black text-xs"><input id="recargaMonto" type="number" placeholder="$" class="w-16 p-2 rounded text-black"><button id="btnRecarga" class="bg-green-500 px-3 rounded-full">+</button></div><div class="flex gap-1 mt-2"><input id="verHistorialId" placeholder="ID para ver historial / resetear" class="flex-1 p-2 rounded text-black text-xs"><button id="btnVerHistorialAdmin" class="bg-blue-500 px-3 rounded-full text-xs">VER</button><button id="btnResetAdmin" class="bg-red-600 px-3 rounded-full text-xs">RESETEAR</button></div><div id="historialAdmin" class="bg-black rounded p-2 mt-2 text-[10px] max-h-40 overflow-auto"></div></div><div class="bg-yellow-400/10 border border-yellow-400 rounded-xl p-2 mt-2"><input id="newId" placeholder="id ej: vlt" class="w-full p-2 rounded text-black text-xs mt-1"><input id="newNombre" placeholder="Nombre nuevo" class="w-full p-2 rounded text-black text-xs mt-1"><div class="flex gap-1 mt-1"><input id="newDias" type="number" placeholder="Dias" class="flex-1 p-2 rounded text-black text-xs"><input id="newPrecio" type="number" placeholder="$" class="flex-1 p-2 rounded text-black text-xs"></div><button onclick="crearNuevoProd()" class="bg-yellow-400 text-black w-full py-1 rounded-full font-black text-xs mt-1">GUARDAR / CREAR</button></div><div id="lista" class="grid gap-2 mt-3"></div></div></div></div>
<div id="cartModal" class="fixed inset-0 bg-black/80 hidden z-50 flex items-end justify-center"><div class="bg-white text-black w-full max-w-md rounded-t-2xl p-4"><div id="cartItems"></div><div id="cartTotal" class="font-black mt-2"></div><button id="checkout" class="bg-green-500 text-white w-full p-3 rounded-full mt-3 font-black">COMPRAR</button><button onclick="cartModal.classList.add('hidden')" class="w-full mt-2 text-xs">Cerrar</button></div></div>
<div id="keyModal" class="fixed inset-0 bg-black/95 hidden z-50 flex items-center justify-center p-4"><div class="bg-zinc-900 border-2 border-red-600 w-full max-w-md rounded-2xl p-5 text-center"><h2 class="font-black text-green-400">COMPRA EXITOSA 🔥</h2><div id="keysEntregadas" class="bg-black rounded-xl p-3 mt-3 text-left text-xs"></div><button onclick="keyModal.classList.add('hidden')" class="bg-red-600 w-full mt-4 py-3 rounded-full font-black">LISTO</button></div></div>
<div id="historialModal" class="fixed inset-0 bg-black/90 hidden z-50 flex items-center justify-center p-4"><div class="bg-zinc-900 border w-full max-w-md rounded-2xl p-4"><div class="flex justify-between"><b>📜 TU HISTORIAL</b><button onclick="historialModal.classList.add('hidden')" class="bg-red-600 px-2 rounded-full text-xs">X</button></div><div id="historialLista" class="mt-3 grid gap-2 text-[11px] max-h-96 overflow-auto"></div></div></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,collection,doc,setDoc,getDoc,deleteDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyDFsZ812v6bExs5VkjOA5T3YIBoW_0zGeU",authDomain:"temo-store-5b025.firebaseapp.com",projectId:"temo-store-5b025",storageBucket:"temo-store-5b025.firebasestorage.app",messagingSenderId:"18400776607",appId:"1:18400776607:web:79cc6e9e716afcd41c6daa"};
const app=initializeApp(firebaseConfig),db=getFirestore(app);
const BASE={drip:{nombre:"DRIP",opciones:[{dias:1,precio:4,keys:[]},{dias:7,precio:12,keys:[]},{dias:15,precio:15,keys:[]},{dias:30,precio:20,keys:[]}]},cuban:{nombre:"CUBAN",opciones:[{dias:1,precio:3,keys:[]},{dias:7,precio:5,keys:[]},{dias:30,precio:10,keys:[]}]},hg:{nombre:"HG",opciones:[{dias:1,precio:5,keys:[]},{dias:10,precio:12,keys:[]},{dias:30,precio:18,keys:[]}]},vlt:{nombre:"VLT",opciones:[{dias:1,precio:5,keys:[]},{dias:7,precio:12,keys:[]},{dias:30,precio:25,keys:[]}]},pato:{nombre:"PATO",opciones:[{dias:30,precio:14,keys:[]}]},flourite:{nombre:"FLOURITE",opciones:[{dias:7,precio:30,keys:[]},{dias:30,precio:50,keys:[]}]}};
let preciosLocal=BASE;
function renderTiendaLocal(){let c=document.getElementById('productos');c.innerHTML='';Object.entries(preciosLocal).forEach(([id,prod])=>{let ops=(prod.opciones||[]).sort((a,b)=>a.dias-b.dias);let html='';ops.forEach((op,i)=>{html+=`<div class="flex justify-between items-center bg-zinc-800 rounded-full p-1 pl-3 mt-2"><div><b class="text-[11px]">${op.dias}D</b><p class="text-green-400 font-black text-xs">$${op.precio} - ${op.keys?.length||0} keys</p></div><button onclick="addCart('${id}','${prod.nombre}',${op.precio},${op.dias},${i})" class="bg-white text-black px-4 py-2 rounded-full font-black text-[10px]">COMPRAR</button></div>`});c.innerHTML+=`<div class="bg-zinc-900 border border-red-600 rounded-2xl p-3"><div class="flex justify-between" onclick="document.getElementById('opts_${id}').classList.toggle('hidden')"><b>${prod.nombre}</b><span class="bg-red-600 px-3 py-1 rounded-full text-[10px]">VER ${ops.length}</span></div><div id="opts_${id}" class="hidden">${html}</div></div>`});}
let cart=[];window.addCart=(id,n,p,d,i)=>{cart.push({id,n,p,d,idx:i});document.getElementById('cartCount').innerText=cart.length};
renderTiendaLocal();
document.getElementById('cartBtn').onclick=()=>{let h='',t=0;cart.forEach(i=>{h+=`<div class='flex justify-between'><span>${i.n} ${i.d}D</span><span>$${i.p}</span></div>`;t+=i.p});document.getElementById('cartItems').innerHTML=h;document.getElementById('cartTotal').innerText='Total $'+t;document.getElementById('cartModal').classList.remove('hidden')};
if(new URLSearchParams(window.location.search).get('admin')==='Temo2007'){document.getElementById('adminPanel').classList.remove('hidden')}
try{onSnapshot(collection(db,"temo_precios"),snap=>{if(snap.empty){for(let id in BASE){setDoc(doc(db,"temo_precios",id),BASE[id]);}preciosLocal=BASE;renderTiendaLocal();return;}let tmp={};snap.forEach(d=>{if(d.data().opciones)tmp[d.id]=d.data()});if(Object.keys(tmp).length>0){preciosLocal=tmp;renderTiendaLocal();if(document.getElementById('panel')&&!document.getElementById('panel').classList.contains('hidden'))renderAdminFirebase(tmp)}})}catch(e){renderTiendaLocal();}
window.renderAdminFirebase=(precios)=>{let h='';Object.entries(precios).forEach(([id,prod])=>{let o='';(prod.opciones||[]).forEach((op,i)=>{o+=`<div class="bg-zinc-800 rounded p-2 mt-2"><b class="text-[10px] text-yellow-400">${op.dias}D $${op.precio} - ${op.keys?.length||0}</b><textarea id="keys_${id}_${i}" class="w-full p-1 rounded text-black text-[10px] h-12 mt-1" placeholder="KEYS"></textarea><button onclick="addKeys('${id}',${i})" class="bg-green-500 w-full py-1 rounded-full text-[9px] font-black mt-1">GUARDAR KEYS ${op.dias}D</button></div>`});h+=`<div class="bg-black p-2 rounded border border-zinc-800"><b class="text-[11px]">${prod.nombre} (${id})</b><button onclick="eliminarProd('${id}')" class="bg-red-600 px-2 rounded-full text-[8px]">BORRAR</button>${o}</div>`});document.getElementById('lista').innerHTML=h;};
window.addKeys=async(id,i)=>{let txt=document.getElementById('keys_'+id+'_'+i).value.trim();if(!txt)return;let r=doc(db,"temo_precios",id);let s=await getDoc(r);let p=s.data();let n=txt.split('\n').map(k=>k.trim()).filter(k=>k);p.opciones[i].keys=[...(p.opciones[i].keys||[]),...n];await setDoc(r,p);alert(n.length+" guardadas");};
window.crearNuevoProd=async()=>{let id=document.getElementById('newId').value.toLowerCase().trim();let nom=document.getElementById('newNombre').value.trim();let d=Number(document.getElementById('newDias').value)||30;let pr=Number(document.getElementById('newPrecio').value);if(!id||!nom||!pr)return alert("llena todo");let r=doc(db,"temo_precios",id);let s=await getDoc(r);let p=s.exists()?s.data():{nombre:nom.toUpperCase(),opciones:[]};p.nombre=nom.toUpperCase();let ex=p.opciones.findIndex(o=>o.dias===d);if(ex>=0)p.opciones[ex].precio=pr;else p.opciones.push({dias:d,precio:pr,keys:[]});await setDoc(r,p);alert("Guardado "+p.nombre);};
window.eliminarProd=async(id)=>{if(!confirm("Borrar "+id+"?"))return;await deleteDoc(doc(db,"temo_precios",id))};
window.restaurarTodo=async()=>{for(let id in BASE){await setDoc(doc(db,"temo_precios",id),BASE[id])}alert("restaurado");location.reload()};
document.getElementById('btnLogin').onclick=()=>{let u=document.getElementById('adminUser').value.trim();let p=document.getElementById('pass').value.trim();if(u==='Temo2007' && p==='Temo2007'){document.getElementById('loginDiv').classList.add('hidden');document.getElementById('panel').classList.remove('hidden');renderAdminFirebase(preciosLocal)}else alert("Usuario o contraseña incorrectos");};
async function cargarUsuario(id){try{let ref=doc(db,"users",id);let snap=await getDoc(ref);if(!snap.exists()){await setDoc(ref,{saldo:0, creado:Date.now(), historial:[]}); snap=await getDoc(ref);}let saldo=snap.data().saldo||0;document.getElementById('saldoDisplay').innerText="💰 $"+saldo;document.getElementById('miIdTexto').innerHTML=`Tu ID: <b>${id}</b> | $${saldo}`;document.getElementById('userId').value=id;document.getElementById('btnCrear').innerText="✅ ID: "+id;document.getElementById('btnCrear').disabled=true;document.getElementById('btnCrear').classList.add('opacity-50');}catch(e){document.getElementById('userId').value=id;}}
let idGuardado=localStorage.getItem('temo_id');if(idGuardado) cargarUsuario(idGuardado);
document.getElementById('btnCrear').onclick=async()=>{let existe=localStorage.getItem('temo_id');if(existe){alert("Ya tienes ID: "+existe);return;}let c="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",r="";for(let i=0;i<5;i++)r+=c[Math.floor(Math.random()*c.length)];let id="TEMO-"+r;localStorage.setItem('temo_id',id);try{await setDoc(doc(db,"users",id),{saldo:0, creado:Date.now(), historial:[]});}catch(e){}alert("Tu ID creado: "+id);cargarUsuario(id);};
document.getElementById('btnEntrar').onclick=()=>{let id=document.getElementById('userId').value.trim().toUpperCase();if(!id.includes("TEMO-")){alert("Escribe TEMO-XXXX");return;}localStorage.setItem('temo_id',id);cargarUsuario(id);};
document.getElementById('btnCopiar').onclick=()=>{let id=document.getElementById('userId').value||localStorage.getItem('temo_id');if(!id)return alert("Primero crea ID");navigator.clipboard.writeText(id).then(()=>alert("Copiado: "+id));};
document.getElementById('btnHistorial').onclick=async()=>{let id=localStorage.getItem('temo_id'); if(!id) return alert("Crea tu ID primero"); let snap=await getDoc(doc(db,"users",id)); let hist=snap.exists()?(snap.data().historial||[]):[]; let cont=document.getElementById('historialLista'); cont.innerHTML=''; if(hist.length===0) cont.innerHTML='<p class="text-zinc-400">Sin compras aún</p>'; else hist.slice().reverse().forEach(h=>{cont.innerHTML+=`<div class="bg-black p-2 rounded border flex justify-between"><div><b>${h.producto}</b> - ${h.dias}D<br><span class="text-[9px] text-zinc-400">${new Date(h.fecha).toLocaleString()}</span></div><div class="text-right"><span class="text-green-400">$${h.precio}</span><br><span class="text-[9px] font-mono">${h.key||''}</span></div></div>`}); document.getElementById('historialModal').classList.remove('hidden');};
document.getElementById('btnResetear').onclick=()=>{let id=localStorage.getItem('temo_id'); if(!id) return alert("Crea ID primero"); let num="523322207690"; let msg=`Hola Temo, quiero resetear mi dispositivo.%0AID: ${id}`; window.open(`https://wa.me/${num}?text=${msg}`,"_blank");};
document.getElementById('checkout').onclick=async()=>{let id=localStorage.getItem('temo_id'); if(!id) return alert("Crea tu ID primero"); let snap=await getDoc(doc(db,"users",id)); if(!snap.exists()) return alert("ID no existe"); let saldo=snap.data().saldo||0; let total=cart.reduce((a,b)=>a+b.p,0); if(saldo<total) return alert(`Saldo insuficiente. Tienes $${saldo} y necesitas $${total}.`); let nuevoSaldo=saldo-total; let historialActual=snap.data().historial||[]; let nuevasCompras=[]; let keysHtml=''; cart.forEach(c=>{let prod=preciosLocal[c.id]; let op=prod?.opciones[c.idx]; let keyDisponible=op?.keys?.length?op.keys[0]:"KEY-DEMO-"+Math.random().toString(36).substr(2,8).toUpperCase(); nuevasCompras.push({fecha:Date.now(), producto:c.n, dias:c.d, precio:c.p, key:keyDisponible}); keysHtml+=`<div class="mt-2 border-t border-zinc-700 pt-1"><b>${c.n} ${c.d}D</b><br><span class="text-green-400 font-mono">${keyDisponible}</span></div>`;}); await setDoc(doc(db,"users",id),{saldo:nuevoSaldo, historial:[...historialActual,...nuevasCompras]},{merge:true}); for(let c of cart){ try{ let r=doc(db,"temo_precios",c.id); let s=await getDoc(r); if(s.exists()){ let p=s.data(); if(p.opciones[c.idx].keys?.length>0){ p.opciones[c.idx].keys.shift(); await setDoc(r,p);} } }catch(e){} } document.getElementById('keysEntregadas').innerHTML=keysHtml; document.getElementById('keyModal').classList.remove('hidden'); document.getElementById('saldoDisplay').innerText="💰 $"+nuevoSaldo; cart=[];document.getElementById('cartCount').innerText=0;document.getElementById('cartModal').classList.add('hidden');};
document.getElementById('btnVerHistorialAdmin').onclick=async()=>{let id=document.getElementById('verHistorialId').value.trim().toUpperCase()||document.getElementById('recargaId').value.trim().toUpperCase(); if(!id) return alert("Pon ID"); let snap=await getDoc(doc(db,"users",id)); if(!snap.exists()){document.getElementById('historialAdmin').innerHTML="ID no encontrado"; return;} let h=snap.data().historial||[]; document.getElementById('historialAdmin').innerHTML=h.length?h.map(x=>`${new Date(x.fecha).toLocaleDateString()} - ${x.producto} ${x.dias}D $${x.precio} | ${x.key}`).join('<br>'):'Sin compras';};
document.getElementById('btnResetAdmin').onclick=async()=>{let id=document.getElementById('verHistorialId').value.trim().toUpperCase()||document.getElementById('recargaId').value.trim().toUpperCase(); if(!id) return alert("Pon ID a resetear"); if(!confirm(`¿Resetear ${id}?`)) return; await setDoc(doc(db,"users",id),{resetPermitido:true},{merge:true}); alert(`Reseteado ${id}. Link:?reset=${id}`);};
document.getElementById('btnRecarga').onclick=async()=>{let id=document.getElementById('recargaId').value.trim().toUpperCase();let m=Number(document.getElementById('recargaMonto').value);if(!id||!m)return alert("Pon ID y monto");let ref=doc(db,"users",id);let s=await getDoc(ref);let tot=(s.exists()?s.data().saldo:0)+m;await setDoc(ref,{saldo:tot},{merge:true});alert("Recargado $"+m+" a "+id);if(id===localStorage.getItem('temo_id'))cargarUsuario(id);};
if(new URLSearchParams(window.location.search).get('reset')){let resetId=new URLSearchParams(window.location.search).get('reset'); getDoc(doc(db,"users",resetId)).then(s=>{ if(s.exists()&&s.data().resetPermitido){ localStorage.removeItem('temo_id'); alert("Reseteado "+resetId); location.href='/'; } });}
</script></body></html>
