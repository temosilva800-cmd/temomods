<script>

const BANCOS_POR_PAIS={
"MEXICO 🇲🇽":["OXXO","CLABE STP","BBVA MX","Banorte","Santander MX","Azteca","Nu MX","Mercado Pago MX","Binance ID","Spin OXXO","HSBC MX"],

"PERU 🇵🇪":["Yape","Yape QR","Plin","BCP Ahorros","Interbank","BBVA Peru","Scotiabank Peru","Banco de la Nacion","Caja Arequipa"],
"CHILE 🇨🇱":["Banco Estado Caja Vecina","Banco Estado Transferencia","CuentaRUT","Mach","Mercado Pago CL","Banco de Chile","Santander CL","BCI","Tenpo"],

"ARGENTINA 🇦🇷":["Mercado Pago","CBU / CVU","Uala","Brubank","Naranja X","BBVA AR","Lemon Cash","Prex AR","Personal Pay AR"],

"COSTA RICA 🇨🇷":["SINPE Movil","BAC CR","BNCR","Davivienda CR","BCR"],
"GUATEMALA 🇬🇹":["Nequi GT","Bi Bank","Banrural","Promerica GT","BAC GT"],
"EL SALVADOR 🇸🇻":["Chivo Wallet","Banco Agricola","Davivienda SV","BAC SV"],
"HONDURAS 🇭🇳":["Tigo Money HN","BAC HN","Atlantida","Ficohsa"],

let PAISES_INICIAL=[
{nombre:'🇲🇽 MEXICO - Binance ID',dato:'1150540078'},
{nombre:'🇲🇽 MEXICO - OXXO',dato:''},{nombre:'🇲🇽 MEXICO - CLABE STP',dato:''},
{nombre:'🇨🇴 COLOMBIA - Bancolombia Ahorros',dato:''},{nombre:'🇨🇴 COLOMBIA - Nequi',dato:''},
{nombre:'🇵🇪 PERU - Yape',dato:''},{nombre:'🇨🇱 CHILE - Banco Estado',dato:''}
];
if(!localStorage.getItem('temo_prods')) localStorage.setItem('temo_prods',JSON.stringify(BASE));
let guardados = JSON.parse(localStorage.getItem('temo_pagos')||'[]');
if(guardados.length===0){
localStorage.setItem('temo_pagos',JSON.stringify(PAISES_INICIAL));
}else{
let merge=[...guardados];
PAISES_INICIAL.forEach(n=>{
if(!merge.find(e=>e.nombre.toLowerCase().trim()===n.nombre.toLowerCase().trim())){
merge.push(n);
}
});
localStorage.setItem('temo_pagos',JSON.stringify(merge));
}
function getProds(){return JSON.parse(localStorage.getItem('temo_prods'))}function setProds(p){localStorage.setItem('temo_prods',JSON.stringify(p));render();renderPagosFront()}
function getPagos(){return JSON.parse(localStorage.getItem('temo_pagos'))}function setPagos(p){localStorage.setItem('temo_pagos',JSON.stringify(p));renderPagosFront();renderPagos()}
function getKeys(){try{return JSON.parse(localStorage.getItem('temo_keys')||'{}')}catch(e){return{}}}function setKeys(k){localStorage.setItem('temo_keys',JSON.stringify(k))}
function render(){let prods=getProds();let keys=getKeys();let c=document.getElementById('lista');c.innerHTML='';prods.forEach(p=>{let s=0;p.ps.forEach(pl=>s+=(keys[pl.id]?keys[pl.id].length:0));let d=document.createElement('div');d.className='prod';d.innerHTML='<div><b style=text-shadow:0 0 20px #f00>'+p.i+' '+p.n+'</b><br><small>Stock: '+s+'</small></div><button class=btn onclick=ver(\''+p.id+'\')>VER</button>';c.appendChild(d)})}

render();renderPagosFront();
function ver(pid){let p=getProds().find(x=>x.id===pid);document.getElementById('planTitle').innerText=p.i+' '+p.n;let l=document.getElementById('planList');l.innerHTML='';p.ps.forEach(pl=>{let div=document.createElement('div');div.style.cssText='display:flex;justify-content:space-between;align-items:center;background:#000;border:3px solid #f00;padding:14px;border-radius:14px;margin:10px 0;box-shadow:0 0 30px #f00';div.innerHTML='<div><b>'+pl.d+'</b><br><b style=color:#f00>$'+pl.p+'</b></div><a href="https://wa.me/523224528803?text=Hola%20quiero%20'+encodeURIComponent(p.n+' '+pl.d)+'" target="_blank" style="padding:12px 18px;background:#f00;color:#fff;border-radius:24px;text-decoration:none;font-weight:900;box-shadow:0 0 25px #f00">COMPRAR</a>';l.appendChild(div)});document.getElementById('planModal').style.display='flex'}
if(location.search.includes('temo7'))document.getElementById('loginAdmin').style.display='flex';
function checkAdmin(){if(document.getElementById('adminUser').value==="TEMOSTOR"&&document.getElementById('adminPass').value==="TEMOSTOR"){document.getElementById('loginAdmin').style.display='none';document.getElementById('admin').style.display='block';renderAdmin();renderPagos();}}
function crearProducto(){let n=document.getElementById('newProdName').value.trim().toUpperCase();let i=document.getElementById('newProdIcon').value.trim()||'🔥';if(!n)return;let pr=getProds();pr.push({n:n,i:i,id:n.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-'+Date.now(),ps:[]});setProds(pr);document.getElementById('newProdName').value='';renderAdmin();}
function renderPagos(){let pagos=getPagos();let c=document.getElementById('pagosList');c.innerHTML='';pagos.forEach((p,i)=>{let d=document.createElement('div');d.className='barraDespliegue';d.innerHTML=`<input id="pagoN-${i}" value="${p.nombre}" class="barraInput" style="flex:1"><input id="pagoD-${i}" value="${p.dato}" class="barraInput" style="flex:1" placeholder="NUMERO"><button onclick="savePago(${i})" style="width:54px;height:54px;background:#f00;color:#fff;border:none;border-radius:13px;box-shadow:0 0 20px #f00">💾</button><button onclick="delPago(${i})" style="width:54px;height:54px;background:#000;border:3px solid #f00;color:#f00;border-radius:13px">X</button>`;c.appendChild(d);});}
function addBarraPago(){
let cont=document.getElementById('contPagos');
let id='pago-'+Date.now();
let paises=Object.keys(BANCOS_POR_PAIS);
let d=document.createElement('div');
d.id='row-'+id;
d.className='barraDespliegueCol';
d.innerHTML=`
<div style="display:flex;gap:9px;width:100%;flex-wrap:wrap">
<select id="paisSel-${id}" onchange="cambiarBancos('${id}')" class="barraInput" style="flex:1;min-width:160px;border:4px solid #f00;box-shadow:0 0 30px #f00;color:#f00">
<option value="">🌎 ELIGE PAIS</option>
${paises.map(p=>`<option value="${p}">${p}</option>`).join('')}
<option value="OTRO">✏️ OTRO PAIS</option>
</select>
<select id="bancoSel-${id}" onchange="autoFill('${id}')" class="barraInput" style="flex:1;min-width:160px;border:4px solid #f00;box-shadow:0 0 30px #f00;color:#f00">
<option value="">🏦 ELIGE BANCO</option>
</select>
</div>
<div style="display:flex;gap:9px;width:100%">
<input id="newPN-${id}" class="barraInput" style="flex:1;border:4px solid #f00;box-shadow:0 0 35px #f00" placeholder="Nombre final: EJ: 🇲🇽 MEXICO - BBVA">
<input id="newPD-${id}" class="barraInput" style="flex:1;border:4px solid #f00;box-shadow:0 0 35px #f00" placeholder="NUMERO / ID / CORREO">
<button onclick="guardarNuevoPago('${id}')" style="width:70px;height:70px;background:#f00;color:#fff;border:none;border-radius:18px;font-size:34px;box-shadow:0 0 40px #f00">✔</button>
<button onclick="document.getElementById('row-${id}').remove()" style="width:56px;height:56px;background:#000;border:3px solid #f00;color:#f00;border-radius:13px">X</button>
</div>
`;
cont.appendChild(d);
d.scrollIntoView({behavior:'smooth'});
}
function cambiarBancos(id){
let pais=document.getElementById('paisSel-'+id).value;
let sel=document.getElementById('bancoSel-'+id);
sel.innerHTML='<option value="">🏦 ELIGE BANCO</option>';
if(BANCOS_POR_PAIS[pais]){
BANCOS_POR_PAIS[pais].forEach(b=>{
let o=document.createElement('option');o.value=b;o.innerText=b;sel.appendChild(o);
});
let o=document.createElement('option');o.value='CUSTOM';o.innerText='✏️ OTRO BANCO (escribir)';sel.appendChild(o);
}
}
function autoFill(id){
let pais=document.getElementById('paisSel-'+id).value;
let banco=document.getElementById('bancoSel-'+id).value;
let input=document.getElementById('newPN-'+id);
if(!banco || banco==='CUSTOM'){input.value='';input.focus();return;}
let flag=pais.split(' ')[pais.split(' ').length-1]||'';
let nombrePais=pais.replace(/🇲🇽|🇨🇴|🇵🇪|🇨🇱|🇪🇨|🇧🇷|🇦🇷|🇧🇴|🇻🇪|🇺🇾|🇵🇾|🇩🇴|🇵🇦|🇨🇷|🇬🇹|🇸🇻|🇭🇳|🇺🇸|🇪🇸/g,'').trim();
input.value=(flag?flag+' ':'')+nombrePais+' - '+banco;
}
function guardarNuevoPago(id){
let n=document.getElementById('newPN-'+id).value.trim();
let d=document.getElementById('newPD-'+id).value.trim();
if(!n||!d){alert('Llena nombre y numero');return}
let p=getPagos();p.push({nombre:n.toUpperCase(),dato:d});setPagos(p);document.getElementById('row-'+id).remove();
}
function savePago(i){let p=getPagos();p[i].nombre=document.getElementById(`pagoN-${i}`).value.toUpperCase();p[i].dato=document.getElementById(`pagoD-${i}`).value;setPagos(p);}
function delPago(i){if(!confirm('Borrar?'))return;let p=getPagos();p.splice(i,1);setPagos(p);}

h:0})</button>`;});html+=`</div>`;card.innerHTML=html;c.appendChild(card)});}
function addBarra(pid){let cont=document.getElementById('cont-'+pid);let id='temp-'+Date.now();let d=document.createElement('div');d.id='row-'+id;d.className='barraDespliegue';d.innerHTML=`<input id="newD-${id}" class="barraInput" style="flex:1;border:4px solid #f00;box-shadow:0 0 40px #f00" placeholder="EJ: 7 DIAS"><input id="newP-${id}" type="number" class="barraInput" style="width:115px;border:4px solid #f00;box-shadow:0 0 40px #f00" placeholder="$"><button onclick="guardarNuevaBarra('${pid}','${id}')" style="width:70px;height:70px;background:#f00;color:#fff;border:none;border-radius:18px;font-size:34px;box-shadow:0 0 40px #f00">✔</button><button onclick="document.getElementById('row-${id}').remove()" style="width:54px;height:54px;background:#000;border:3px solid #f00;color:#f00;border-radius:13px">X</button>`;cont.appendChild(d);d.scrollIntoView({behavior:'smooth'});}
function guardarNuevaBarra(pid,id){let d=document.getElementById('newD-'+id).value.trim().toUpperCase();let pr=parseInt(document.getElementById('newP-'+id).value);if(!d||isNaN(pr))return;let prods=getProds();prods.find(x=>x.id===pid).ps.push({id:pid+'-'+Date.now(),d:d,p:pr});setProds(prods);renderAdmin();}
function saveName(pid){let prods=getProds();let p=prods.find(x=>x.id===pid);p.n=document.getElementById('name-'+pid).value.toUpperCase();p.i=document.getElementById('icon-'+pid).value;setProds(prods);renderAdmin()}
function delProd(pid){setProds(getProds().filter(x=>x.id!==pid));renderAdmin()}
function savePlan(pid,plid){let pl=getProds().find(x=>x.id===pid).ps.find(x=>x.id===plid);pl.d=document.getElementById('d-'+plid).value.toUpperCase();pl.p=parseInt(document.getElementById('p-'+plid).value);setProds(getProds());}
function delPlan(pid,plid){let p=getProds().find(x=>x.id===pid);p.ps=p.ps.filter(x=>x.id!==plid);setProds(getProds());renderAdmin();}
function saveKeys(id){let lines=document.getElementById('ta-'+id).value.split('\n').map(s=>s.trim()).filter(s=>s);let k=getKeys();k[id]=lines;setKeys(k);render();renderAdmin();}
</script></body></html>
