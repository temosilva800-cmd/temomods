<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TEMO STORE</title><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></head>
<body class="bg-[#0a0a0a] text-white">
<header class="bg-gradient-to-r from-red-700 to-red-500 p-3 sticky top-0 z-50"><div class="max-w-6xl mx-auto flex justify-between items-center"><div class="flex gap-2 items-center"><span>🔥</span><b class="tracking-widest">TEMO STORE</b><span class="bg-black text-[8px] px-2 py-1 rounded-full">OFICIAL</span></div><div class="flex gap-2"><span id="saldoDisplay" class="bg-black/80 px-3 py-1.5 rounded-full text-xs border">💰 $0</span><button id="cartBtn" class="bg-white text-black px-4 py-1.5 rounded-full font-black text-sm">🛒 <span id="cartCount">0</span></button></div></div></header>
<div class="max-w-6xl mx-auto p-3"><div class="bg-gradient-to-br from-zinc-900 to-black border border-red-600/50 rounded-[20px] p-4"><h1 class="text-2xl font-black">BIENVENIDO A <span class="text-red-500">TEMO STORE</span> 🔥</h1><p class="text-[11px] text-zinc-400">Las mejores herramientas Free Fire - Entrega inmediata</p><div class="flex gap-2 mt-3"><span class="bg-green-500/20 text-green-400 text-[10px] px-3 py-1 rounded-full border">⚡ ENTREGA AUTO</span><span class="bg-blue-500/20 text-blue-400 text-[10px] px-3 py-1 rounded-full border">🛡️ SEGURO</span></div></div>
<div class="bg-zinc-900 border border-zinc-800 rounded-[20px] p-3 mt-3"><div class="flex gap-2"><input id="userId" placeholder="TEMO-XXXX" class="flex-1 bg-black border border-zinc-700 p-3 rounded-full text-white font-bold uppercase text-xs outline-none"><button id="btnCopiar" class="bg-white text-black px-4 rounded-full font-black text-xs">📋</button><button id="btnEntrar" class="bg-red-600 px-5 rounded-full font-black text-xs">ENTRAR</button></div><button id="btnCrear" class="bg-gradient-to-r from-yellow-400 to-orange-400 text-black w-full py-3.5 rounded-full font-black mt-2">🎲 CREAR TU ID UNICO</button><div class="grid grid-cols-2 gap-2 mt-2"><button id="btnHistorial" class="bg-zinc-800 border py-3 rounded-full text-[11px] font-bold">📜 HISTORIAL</button><button id="btnResetear" class="bg-zinc-800 border border-yellow-400/50 py-3 rounded-full text-[11px] font-bold text-yellow-400">♻️ RESETEAR</button></div><p id="miIdTexto" class="text-[10px] text-center mt-2 text-zinc-400"></p></div>
<input id="buscador" placeholder="Buscar DRIP, CUBAN, VLT..." class="w-full bg-zinc-900 border border-zinc-800 p-3 rounded-full text-xs mt-3 outline-none">
<h2 class="font-black text-sm mt-4 mb-3">🔥 PRODUCTOS DISPONIBLES</h2><div id="productos" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div></div>

<div id="cartModal" class="fixed inset-0 bg-black/80 hidden z-50 flex items-end justify-center"><div class="bg-white text-black w-full max-w-md rounded-t-[20px] p-4"><div id="cartItems"></div><div id="cartTotal" class="font-black mt-2"></div><button id="checkout" class="bg-green-500 text-white w-full p-3 rounded-full mt-3 font-black">COMPRAR</button><button onclick="cartModal.classList.add('hidden')" class="w-full mt-2 text-xs">Cerrar</button></div></div>
<div id="keyModal" class="fixed inset-0 bg-black/95 hidden z-50 flex items-center justify-center p-4"><div class="bg-zinc-900 border-2 border-red-600 w-full max-w-md rounded-[20px] p-5 text-center"><h2 class="font-black text-green-400">COMPRA EXITOSA 🔥</h2><div id="keysEntregadas" class="bg-black rounded-xl p-3 mt-3 text-left text-xs"></div><button onclick="keyModal.classList.add('hidden')" class="bg-red-600 w-full mt-4 py-3 rounded-full font-black">LISTO</button></div></div>
<div id="historialModal" class="fixed inset-0 bg-black/90 hidden z-50 flex items-center justify-center p-4"><div class="bg-zinc-900 border w-full max-w-md rounded-[20px] p-4 max-h-[85vh] flex flex-col"><div class="flex justify-between"><b>📜 HISTORIAL</b><button onclick="historialModal.classList.add('hidden')" class="bg-red-600 px-3 py-1 rounded-full text-xs">X</button></div><div id="historialLista" class="mt-3 grid gap-3 text-[11px] overflow-auto flex-1"></div><button id="btnResetDesdeHistorial" class="bg-yellow-400 text-black w-full py-3 rounded-full font-black text-xs mt-3">♻️ RESETEAR POR WHATSAPP</button></div></div>
<div id="adminPanel" class="hidden fixed inset-0 bg-black z-[100] overflow-auto p-4"><div class="max-w-md mx-auto bg-zinc-900 p-4 rounded-2xl border-2 border-green-500 mt-6"><div class="flex justify-between"><b class="text-green-400">ADMIN</b><button onclick="location.href='/'" class="bg-red-600 px-3 py-1 rounded-full text-xs">X</button></div><div id="loginDiv" class="mt-3 space-y-2"><input id="adminUser" placeholder="Usuario" class="w-full p-3 rounded text-black"><input id="pass" type="password" placeholder="Contraseña" class="w-full p-3 rounded text-black"><button id="btnLogin" class="bg-white text-black w-full p-3 rounded-full font-black mt-2">ENTRAR</button></div><div id="panel" class="hidden mt-3"><button onclick="restaurarTodo()" class="bg-green-500 w-full py-2 rounded-full font-black text-xs">✅ RESTAURAR</button><div class="bg-blue-500/10 border border-blue-500 rounded-xl p-2 mt-2"><div class="flex gap-1"><input id="recargaId" placeholder="TEMO-XXXX" class="flex-1 p-2 rounded text-black text-xs"><input id="recargaMonto" type="number" placeholder="$" class="w-16 p-2 rounded text-black"><button id="btnRecarga" class="bg-green-500 px-3 rounded-full">+</button></div><div class="flex gap-1 mt-2"><input id="verHistorialId" placeholder="ID" class="flex-1 p-2 rounded text-black text-xs"><button id="btnVerHistorialAdmin" class="bg-blue-500 px-3 rounded-full text-xs">VER</button><button id="btnResetAdmin" class="bg-red-600 px-3 rounded-full text-xs">RESET</button></div><div id="historialAdmin" class="bg-black rounded p-2 mt-2 text-[10px] max-h-40 overflow-auto"></div></div><div id="lista" class="grid gap-2 mt-3"></div></div></div></div>

<script>
// ESTE SCRIPT DIBUJA SIN NECESIDAD DE FIREBASE - FIX PANTALLA NEGRA
const BASE_FIJO={drip:{nombre:"DRIP",icono:"💧",opciones:[{dias:1,precio:4,keys:[]},{dias:7,precio:12,keys:[]},{dias:15,precio:15,keys:[]},{dias:30,precio:20,keys:[]}]},cuban:{nombre:"CUBAN",icono:"🇨🇺",opciones:[{dias:1,precio:3,keys:[]},{dias:7,precio:5,keys:[]},{dias:30,precio:10,keys:[]}]},hg:{nombre:"HG",icono:"⚡",opciones:[{dias:1,precio:5,keys:[]},{dias:10,precio:12,keys:[]},{dias:30,precio:18,keys:[]}]},vlt:{nombre:"VLT",icono:"🔮",opciones:[{dias:1,precio:5,keys:[]},{dias:7,precio:12,keys:[]},{dias:30,precio:25,keys:[]}]},pato:{nombre:"PATO",icono:"🦆",opciones:[{dias:30,precio:14,keys:[]}]},flourite:{nombre:"FLOURITE",icono:"💎",opciones:[{dias:7,precio:30,keys:[]},{dias:30,precio:50,keys:[]}]}};
let preciosLocal=BASE_FIJO; let cart=[];
function renderTiendaLocal(filtro=""){let c=document.getElementById('productos'); if(!c) return; c.innerHTML=''; Object.entries(preciosLocal).forEach(([id,prod])=>{ if(filtro&&!prod.nombre.toLowerCase().includes(filtro.toLowerCase())) return; let ops=(prod.opciones||[]).sort((a,b)=>a.dias-b.dias); let html=''; ops.forEach((op,i)=>{ html+=`<div class="flex justify-between items-center bg-black/50 rounded-full p-1.5 pl-4 mt-2 border border-zinc-800"><div><b class="text-[11px]">${op.dias} DIAS</b><p class="text-green-400 font-black text-xs">$${op.precio} MXN • ${op.keys?.length||0} keys</p></div><button onclick="addCart('${id}','${prod.nombre}',${op.precio},${op.dias},${i})" class="bg-white text-black px-5 py-2 rounded-full font-black text-[10px]">COMPRAR</button></div>`}); c.innerHTML+=`<div class="bg-gradient-to-br from-zinc-900 to-black border border-zinc-800 rounded-[20px] p-4"><div class="flex justify-between items-center cursor-pointer" onclick="document.getElementById('opts_${id}').classList.toggle('hidden')"><div class="flex items-center gap-3"><div class="w-12 h-12 bg-red-600/20 rounded-full flex items-center justify-center text-xl">${prod.icono}</div><div><b class="text-sm">${prod.nombre}</b><p class="text-[10px] text-zinc-500">${ops.length} planes</p></div></div><span class="bg-red-600 px-4 py-1.5 rounded-full text-[10px] font-black">VER</span></div><div id="opts_${id}" class="hidden mt-3">${html}</div></div>`; });}
window.addCart=(id,n,p,d,i)=>{cart.push({id,n,p,d,idx:i}); document.getElementById('cartCount').innerText=cart.length; let h='',t=0; cart.forEach(i=>{h+=`<div class='flex justify-between py-1'><span>${i.n} ${i.d}D</span><span class='font-black'>$${i.p}</span></div>`;t+=i.p}); document.getElementById('cartItems').innerHTML=h; document.getElementById('cartTotal').innerText='Total $'+t; document.getElementById('cartModal').classList.remove('hidden');};
renderTiendaLocal();
document.getElementById('buscador').oninput=e=>renderTiendaLocal(e.target.value);
document.getElementById('cartBtn').onclick=()=>{ let h='',t=0; cart.forEach(i=>{h+=`<div class='flex justify-between'><span>${i.n} ${i.d}D</span><span>$${i.p}</span></div>`;t+=i.p}); document.getElementById('cartItems').innerHTML=h; document.getElementById('cartTotal').innerText='Total $'+t; document.getElementById('cartModal').classList.remove('hidden'); };
</script>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,collection,doc,setDoc,getDoc,deleteDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyDFsZ812v6bExs5VkjOA5T3YIBoW_0zGeU",authDomain:"temo-store-5b025.firebaseapp.com",projectId:"temo-store-5b025",storageBucket:"temo-store-5b025.firebasestorage.app",messagingSenderId:"18400776607",appId:"1:18400776607:web:79cc6e9e716afcd41c6daa"};
const app=initializeApp(firebaseConfig),db=getFirestore(app);
try{
onSnapshot(collection(db,"temo_precios"),snap=>{
 if(!snap.empty){ let tmp={}; snap.forEach(d=>{if(d.data().opciones)tmp[d.id]=d.data()}); if(Object.keys(tmp).length>0){ preciosLocal=tmp; renderTiendaLocal(document.getElementById('buscador').value); if(document.getElementById('panel')&&!document.getElementById('panel').classList.contains('hidden'))renderAdminFirebase(tmp); } }
},{error:(e)=>{console.log("firebase off",e);}});
}catch(e){}

window.renderAdminFirebase=(precios)=>{let h='';Object.entries(precios).forEach(([id,prod])=>{let o='';(prod.opciones||[]).forEach((op,i)=>{o+=`<div class="bg-zinc-800 rounded p-2 mt-2"><b class="text-[10px] text-yellow-400">${op.dias}D $${op.precio} - ${op.keys?.length||0}</b><textarea id="keys_${id}_${i}" class="w-full p-1 rounded text-black text-[10px] h-12 mt-1"></textarea><button onclick="addKeys('${id}',${i})" class="bg-green-500 w-full py-1 rounded-full text-[9px] font-black mt-1">GUARDAR</button></div>`});h+=`<div class="bg-black p-2 rounded border"><b>${prod.nombre} (${id})</b>${o}</div>`});document.getElementById('lista').innerHTML=h;};
window.addKeys=async(id,i)=>{let txt=document.getElementById('keys_'+id+'_'+i).value.trim();if(!txt)return;let r=doc(db,"temo_precios",id);let s=await getDoc(r);let p=s.data();let n=txt.split('\n').map(k=>k.trim()).filter(k=>k);p.opciones[i].keys=[...(p.opciones[i].keys||[]),...n];await setDoc(r,p);alert(n.length+" guardadas");};
window.restaurarTodo=async()=>{for(let id in BASE_FIJO){await setDoc(doc(db,"temo_precios",id),BASE_FIJO[id])}alert("restaurado");};
document.getElementById('btnLogin').onclick=()=>{let u=document.getElementById('adminUser').value.trim();let p=document.getElementById('pass').value.trim();if(u==='Temo2007' && p==='Temo2007'){document.getElementById('loginDiv').classList.add('hidden');document.getElementById('panel').classList.remove('hidden');renderAdminFirebase(preciosLocal)}};
async function cargarUsuario(id){try{let ref=doc(db,"users",id);let snap=await getDoc(ref);if(!snap.exists()){await setDoc(ref,{saldo:0, creado:Date.now(), historial:[]}); snap=await getDoc(ref);}let saldo=snap.data().saldo||0;document.getElementById('saldoDisplay').innerText="💰 $"+saldo;document.getElementById('miIdTexto').innerHTML=`Tu ID: <b>${id}</b> | $${saldo}`;document.getElementById('userId').value=id;document.getElementById('btnCrear').innerText="✅ ID: "+id;document.getElementById('btnCrear').disabled=true;}catch(e){}}
let idGuardado=localStorage.getItem('temo_id');if(idGuardado) cargarUsuario(idGuardado);
document.getElementById('btnCrear').onclick=async()=>{let existe=localStorage.getItem('temo_id');if(existe){alert("Ya tienes ID: "+existe);return;}let c="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",r="";for(let i=0;i<5;i++)r+=c[Math.floor(Math.random()*c.length)];let id="TEMO-"+r;localStorage.setItem('temo_id',id);try{await setDoc(doc(db,"users",id),{saldo:0, creado:Date.now(), historial:[]});}catch(e){}alert("Tu ID: "+id);cargarUsuario(id);};
document.getElementById('btnEntrar').onclick=()=>{let id=document.getElementById('userId').value.trim().toUpperCase();if(!id.includes("TEMO-"))return;localStorage.setItem('temo_id',id);cargarUsuario(id);};
document.getElementById('btnCopiar').onclick=()=>{let id=document.getElementById('userId').value||localStorage.getItem('temo_id');if(!id)return;navigator.clipboard.writeText(id).then(()=>alert("Copiado: "+id));};
document.getElementById('btnHistorial').onclick=async()=>{let id=localStorage.getItem('temo_id'); if(!id) return alert("Crea ID"); let snap=await getDoc(doc(db,"users",id)); let hist=snap.exists()?(snap.data().historial||[]):[]; let cont=document.getElementById('historialLista'); cont.innerHTML=''; if(hist.length===0){cont.innerHTML='<p class="text-center py-10 text-zinc-500">Sin compras</p>';} else {hist.slice().reverse().forEach(h=>{let fecha=new Date(h.fecha).toLocaleString(); let num="523224528803"; let msg=`Hola Temo, quiero resetear mi dispositivo.%0AID: ${id}%0ACompra: ${h.producto} ${h.dias}D - $${h.precio}%0AFecha: ${fecha}%0AKey: ${h.key||''}`; cont.innerHTML+=`<div class="bg-black p-3 rounded-xl border border-zinc-800"><div class="flex justify-between"><div><b>${h.producto}</b> - ${h.dias}D<br><span class="text-[9px] text-zinc-400">${fecha}</span><br><span class="font-mono text-[10px] text-green-400 break-all">${h.key||''}</span></div><div class="text-green-400 font-black">$${h.precio}</div></div><a href="https://wa.me/${num}?text=${msg}" target="_blank" class="bg-zinc-800 border border-yellow-400/50 text-yellow-400 block text-center py-2.5 rounded-full text-[10px] font-black mt-3">♻️ RESETEAR ESTA COMPRA</a></div>`;});} document.getElementById('historialModal').classList.remove('hidden');};
document.getElementById('btnResetDesdeHistorial').onclick=()=>{let id=localStorage.getItem('temo_id'); let num="523224528803"; let msg=`Hola Temo, quiero resetear mi dispositivo.%0AID: ${id}`; window.open(`https://wa.me/${num}?text=${msg}`,"_blank");};
document.getElementById('btnResetear').onclick=()=>{let id=localStorage.getItem('temo_id'); if(!id) return alert("Crea ID"); let num="523224528803"; let msg=`Hola Temo, quiero resetear mi dispositivo.%0AID: ${id}`; window.open(`https://wa.me/${num}?text=${msg}`,"_blank");};
document.getElementById('checkout').onclick=async()=>{let id=localStorage.getItem('temo_id'); if(!id) return alert("Crea ID"); let snap=await getDoc(doc(db,"users",id)); let saldo=snap.data()?.saldo||0; let total=cart.reduce((a,b)=>a+b.p,0); if(saldo<total) return alert(`Saldo $${saldo} necesitas $${total}`); let nuevoSaldo=saldo-total; let historialActual=snap.data()?.historial||[]; let nuevas=[]; let html=''; cart.forEach(c=>{let op=preciosLocal[c.id]?.opciones[c.idx]; let key=op?.keys?.length?op.keys[0]:"KEY-"+Math.random().toString(36).substr(2,8).toUpperCase(); nuevas.push({fecha:Date.now(), producto:c.n, dias:c.d, precio:c.p, key}); html+=`<div class="mt-2 border-t border-zinc-700 pt-2"><b>${c.n} ${c.d}D</b><br><span class="text-green-400 font-mono">${key}</span></div>`;}); await setDoc(doc(db,"users",id),{saldo:nuevoSaldo, historial:[...historialActual,...nuevas]},{merge:true}); for(let c of cart){ try{ let r=doc(db,"temo_precios",c.id); let s=await getDoc(r); if(s.exists()&&s.data().opciones[c.idx].keys?.length>0){ let p=s.data(); p.opciones[c.idx].keys.shift(); await setDoc(r,p);} }catch(e){} } document.getElementById('keysEntregadas').innerHTML=html; document.getElementById('keyModal').classList.remove('hidden'); document.getElementById('saldoDisplay').innerText="💰 $"+nuevoSaldo; cart=[];document.getElementById('cartCount').innerText=0;document.getElementById('cartModal').classList.add('hidden');};
document.getElementById('btnVerHistorialAdmin').onclick=async()=>{let id=document.getElementById('verHistorialId').value.trim().toUpperCase()||document.getElementById('recargaId').value.trim().toUpperCase(); if(!id) return; let snap=await getDoc(doc(db,"users",id)); document.getElementById('historialAdmin').innerHTML=snap.exists()?(snap.data().historial||[]).map(x=>`${new Date(x.fecha).toLocaleDateString()} ${x.producto} ${x.dias}D $${x.precio} | ${x.key}`).join('<br>'):'Sin compras';};
document.getElementById('btnResetAdmin').onclick=async
