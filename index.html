<div class="max-w-md mx-auto p-3"><div class="flex gap-2 mb-2"><input id="userId" placeholder="TEMO-XXXX" class="flex-1 p-3 rounded-full text-black font-bold uppercase text-xs"><button id="btnEntrar" class="bg-red-600 px-4 rounded-full font-black text-xs">ENTRAR</button></div><button id="btnCrear" class="bg-yellow-400 text-black w-full py-3 rounded-full font-black">🎲 CREAR TU ID (1 POR CELULAR)</button><p id="bloqueoMsg" class="hidden text-center text-[11px] text-red-400 font-black mt-2 bg-red-900/30 border border-red-600 rounded-full p-2"></p><div id="boxNuevoId" class="hidden bg-zinc-900 border-2 border-yellow-400 rounded-xl p-3 mt-3"><p id="miIdGenerado" class="text-center text-green-400 font-black mb-2"></p><div id="historialBox" class="mt-3 space-y-2"></div></div></div>

<div id="panel" class="hidden">

<button onclick="restaurarTodo()" class="bg-green-500 w-full py-4 rounded-full font-black text-[14px] mt-2 border-2 border-white animate-pulse">✅ RESTAURAR MIS PRODUCTOS</button>

import {initializeApp} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import {getFirestore,collection,doc,setDoc,getDoc,updateDoc,deleteDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyDFsZ812v6bExs5VkjOA5T3YIBoW_0zGeU",authDomain:"temo-store-5b025.firebaseapp.com",projectId:"temo-store-5b025",storageBucket:"temo-store-5b025.firebasestorage.app",messagingSenderId:"18400776607",appId:"1:18400776607:web:79cc6e9e716afcd41c6daa"};
let app=initializeApp(firebaseConfig),db=getFirestore(app);
let cart=[],precios={},usuarioActual=localStorage.getItem('temo_id')||null,saldoActual=0;
const BASE={drip:{nombre:"DRIP",opciones:[{dias:1,precio:4,keys:[]},{dias:7,precio:12,keys:[]},{dias:15,precio:15,keys:[]},{dias:30,precio:20,keys:[]}]},cuban:{nombre:"CUBAN",opciones:[{dias:1,precio:3,keys:[]},{dias:7,precio:5,keys:[]},{dias:30,precio:10,keys:[]}]},hg:{nombre:"HG",opciones:[{dias:1,precio:5,keys:[]},{dias:10,precio:12,keys:[]},{dias:30,precio:18,keys:[]}]},vlt:{nombre:"VLT",opciones:[{dias:1,precio:5,keys:[]},{dias:7,precio:12,keys:[]},{dias:30,precio:25,keys:[]}]},pato:{nombre:"PATO",opciones:[{dias:30,precio:14,keys:[]}]},flourite:{nombre:"FLOURITE",opciones:[{dias:7,precio:30,keys:[]},{dias:30,precio:50,keys:[]}]}};

function renderTienda(){
  let c=document.getElementById('productos'); c.innerHTML='';
  let data = Object.keys(precios).length>0? precios : BASE;
  let vacio=true;
  Object.entries(data).forEach(([id,prod])=>{
    if(!prod.opciones || prod.opciones.length==0) return;
    vacio=false;
    let ops = prod.opciones.sort((a,b)=>a.dias-b.dias);
    let htmlOps='';
    ops.forEach((op,i)=>{
      htmlOps+=`<div class="flex justify-between items-center bg-zinc-800 rounded-full p-1 pl-3 mt-2"><div><b class="text-[11px]">${op.dias} DÍAS</b> <p class="text-green-400 font-black text-xs">$${op.precio}</p></div><button onclick="add('${id}','${prod.nombre}',${op.precio},${op.dias},${i})" class="bg-white text-black px-4 py-2 rounded-full font-black text-[10px]">COMPRAR</button></div>`;
    });
