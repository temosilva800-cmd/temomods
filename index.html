<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TEMO STORE - USUARIO Y CONTRASEÑA - SIN WHATSAPP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:Arial,sans-serif}
header{background:#000;border-bottom:2px solid #f00;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.logo{font-weight:900;font-size:22px}.logo span{color:#f00}
.hero{background:linear-gradient(135deg,#000,#1a0000,#000);padding:22px 15px;text-align:center}
.hero h1{font-size:26px;font-weight:900}.hero h1 .red{color:#f00}
.badge{display:inline-block;background:#f00;color:#fff;padding:4px 10px;border-radius:20px;font-size:10px;font-weight:900;margin:4px}
.card{max-width:600px;margin:12px auto;background:#111;border:1px solid #222;border-radius:14px;padding:14px}
.card-green{border:2px solid #0f0}.card-yellow{border:2px solid #f3ba2f}
.b{padding:12px;border-radius:10px;font-weight:900;width:100%;display:block;text-align:center;text-decoration:none;margin-top:7px;border:none;cursor:pointer}
.buy{background:linear-gradient(90deg,#f00,#ff4400);color:#fff}
.n{background:#000;padding:10px;border-radius:8px;font-weight:900;border:1px dashed #555;text-align:center;word-break:break-all;margin:6px 0}
.w{background:#25D366;color:#fff}
.i{display:flex;justify-content:space-between;background:#1a1a1a;padding:9px;border-radius:8px;margin:5px 0;font-size:13px}
.p{color:#0f0;font-weight:900}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:10px;max-width:600px;margin:0 auto}
.prod-card{background:#151515;border:1px solid #222;border-radius:12px;overflow:hidden}
.prod-img{height:70px;background:#1a1a1a;display:flex;align-items:center;justify-content:center;font-size:30px}
.prod-body{padding:8px}
.prod-title{font-weight:900;font-size:11px;min-height:26px}
.prod-price{color:#0f0;font-weight:900}
.stock-info{font-size:9px;background:#000;border:1px solid #333;border-radius:6px;padding:3px 6px;display:inline-block;margin:3px 0}
#adminPanel{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#050505;z-index:99999;overflow:auto;padding:12px}
input,select,textarea{width:100%;padding:12px;border-radius:10px;border:1px solid #333;background:#111;color:#fff;margin:5px 0}
.login-box{background:#000;border:2px solid #0f0;border-radius:12px;padding:10px;margin:10px 0}
</style>
</head>
<body>
<div id="adminPanel">
<h1 style="color:#f00;text-align:center">ADMIN TEMO2007 - USUARIOS</h1>
<div style="display:flex;gap:6px">
<button class="b" style="background:#0f0;color:#000" onclick="showTab('users')">👤
