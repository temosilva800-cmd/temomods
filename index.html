<style>

<div id="loginAdmin"><div class="loginBox"><h2 class="neon">🔥 TEMO STOR 🔥</h2><input id="adminUser" placeholder="USUARIO" style="width:100%;padding:15px;background:#000;border:3px solid #ff0000;color:#fff;border-radius:13px;margin:9px 0;text-align:center;font-weight:900"><input id="adminPass" type="password" placeholder="CONTRASEÑA" style="width:100%;padding:15px;background:#000;border:3px solid #ff0000;color:#fff;border-radius:13px;margin:9px 0;text-align:center;font-weight:900"><button onclick="checkAdmin()" style="width:100%;padding:15px;background:#ff0000;color:#fff;border:none;border-radius:13px;font-weight:900">⚡ ENTRAR ⚡</button></div></div>

</div></div>
<script>
let BASE=[
{n:'MODS ROOT',i:'🤖',id:'mods-root',ps:[{id:'mods-root-1d',d:'1 DIA - ANDROID ROOT KEY AUTO',p:0}]},
{n:'MODS STORE',i:'🎮',id:'mods-store',ps:[{id:'mods-store-1d',d:'1 DIA - +50 JUEGOS',p:0}]},
{n:'MODS PC',i:'💻',id:'mods-pc',ps:[{id:'mods-pc-1d',d:'1 DIA - AIMBOT IA',p:0}]},
{n:'DRIP MOBILE',i:'💧',id:'drip',ps:[{id:'drip-7d',d:'7 DIAS - AIMKILL TELEPORT',p:0}]},
{n:'PROJECT X FF',i:'🔥',id:'project-x',ps:[{id:'project-x-1d',d:'1 DIA - SIN ROOT',p:0}]},
{n:'UNSEEN MODS ROOT',i:'👻',id:'unseen-root',ps:[{id:'unseen-root-1d',d:'1 DIA',p:0}]},
{n:'ARIFI EXTERNAL IOS',i:'🍎',id:'arifi-ios',ps:[{id:'arifi-ios-7d',d:'7 DIAS - IPA',p:0}]},
{n:'HG PROXY',i:'🎯',id:'hg-proxy',ps:[{id:'hg-proxy-7d',d:'7 DIAS - AIMBOT+HOLO',p:0}]},
{n:'EXTERNAL IOS',i:'📱',id:'external-ios',ps:[{id:'external-ios-1d',d:'1 DIA - TODOS IOS',p:0}]},
{n:'TEAM VERDE',i:'💚',id:'team-verde',ps:[{id:'team-verde-3d',d:'3 DIAS',p:0}]},
{n:'TEAM NARANJA',i:'🧡',id:'team-naranja',ps:[{id:'team-naranja-1d',d:'1 DIA',p:0}]},
{n:'TEAM ICE',i:'🧊',id:'team-ice',ps:[{id:'team-ice-1d',d:'1 DIA',p:0}]},
{n:'TEAM AMARILLO',i:'💛',id:'team-amarillo',ps:[{id:'team-amarillo-1d',d:'1 DIA',p:0}]},
{n:'TEAM NEGRO',i:'🖤',id:'team-negro',ps:[{id:'team-negro-1d',d:'1 DIA',p:0}]},
{n:'STRICK BR / ALPHA X',i:'⚡',id:'strick-alpha',ps:[{id:'strick-alpha-1d',d:'1 DIA',p:0}]},
{n:'PANEL PERSONALIZADO PC',i:'👑',id:'panel-pc',ps:[{id:'panel-pc-1m',d:'1 MES - KEYS ILIMITADAS',p:0}]},
{n:'HG CHEATS',i:'🎯',id:'hg-cheats',ps:[{id:'hg-cheats-1d',d:'1 DIA',p:0}]},
{n:'CERTIFICADO GBOX',i:'📜',id:'cert-gbox',ps:[{id:'cert-gbox-3m',d:'3 MESES',p:0}]},
{n:'DELUXE',i:'💎',id:'deluxe',ps:[{id:'deluxe-15d',d:'15 DIAS - +100 FUNC',p:0}]},
{n:'DEATH X SILENT',i:'💀',id:'death-x',ps:[{id:'death-x-1d',d:'1 DIA - SILENT BYPASS',p:0}]},
{n:'RAGE PC',i:'😡',id:'rage-pc',ps:[{id:'rage-pc-1d',d:'1 DIA',p:0}]},
{n:'MONITE CHEATS',i:'🔥',id:'monite',ps:[{id:'monite-1d',d:'1 DIA - AUTO',p:0}]}
];
const BANCOS_POR_PAIS={"MEXICO 🇲🇽":["OXXO","CLABE STP","BBVA MX","Banorte","Santander MX","Azteca","Nu MX","Mercado Pago MX","Binance ID"],"COLOMBIA 🇨🇴":["Bancolombia Ahorros","Nequi","Daviplata"],"PERU 🇵🇪":["Yape","Plin","BCP Ahorros"],"USA 🇺🇸":["Zelle","PayPal","CashApp"]};
if(!localStorage.getItem('temo_stor_v1')){localStorage.setItem('temo_prods',JSON.stringify(BASE));localStorage.setItem('temo_stor_v1','1');}
if(!localStorage.getItem('temo_prods')) localStorage.setItem('temo_prods',JSON.stringify(BASE));
let guardados = JSON.parse(localStorage.getItem('temo_pagos')||'[]');
if(guardados.length===0){localStorage.setItem('temo_pagos',JSON.stringify([{nombre:'MEXICO 🇲🇽 - Binance ID',dato:'1150540078'}]));}
function getProds(){return JSON.parse(localStorage.getItem('temo_prods'))}function setProds(p){localStorage.setItem('temo_prods',JSON.stringify(p));render();renderPagosFront()}
function getPagos(){return JSON.parse(localStorage.getItem('temo_pagos'))}function setPagos(p){localStorage.setItem('temo_pagos',JSON.stringify(p));renderPagosFront();renderPagos()}
function getKeys(){try{return JSON.parse(localStorage.getItem('temo_keys')||'{}')}catch(e){return{}}}function setKeys(k){localStorage.setItem('temo_keys',JSON.stringify(k))}
function render(){let prods=getProds();let keys=getKeys();let c=document.getElementById('lista');c.innerHTML='';prods.forEach(p=>{let s=0;p.ps.forEach(pl=>s+=(keys[pl.id]?keys[pl.id].length:0));let d=document.createElement('div');d.className='prod';d.innerHTML='<div style="display:flex;align-items:center;gap:12px"><img src="pantera.png" style="width:58px;height:58px;border-radius:12px;box-shadow:0 0 12px #ff0000;background:#000"><div><b>'+p.i+' '+p.n+'</b><br><small style="color:#ffaaaa">TEMO STOR - Stock: '+s+'</small></div></div><button class=btn onclick=ver(\''+p.id+'\')>VER</button>';c.appendChild(d)})}
function renderPagosFront(){let pagos=getPagos().filter(p=>p.dato && p.dato.toString().trim()!=='');let c=document.getElementById('pagosFront');if(pagos.length===0){c.innerHTML='<div class=pagosBox><h3 style="color:#f00;text-align:center">💳 SIN METODOS</h3></div>';return;}c.innerHTML='<div class=pagosBox><h3 style="color:#f00;text-align:center">💳 '+pagos.length+' METODOS TEMO STOR</h3>'+pagos.map(p=>'<div class=pagoItem><b>'+p.nombre+'</b><span style=color:#f00;font-weight:900>'+p.dato+'</span></div>').join('')+'</div>';}
render();renderPagosFront();
function ver(pid){let p=getProds().find(x=>x.id===pid);document.getElementById('planTitle').innerText=p.i+' '+p.n;let l=document.getElementById('planList');l.innerHTML='';p.ps.forEach(pl=>{let div=document.createElement('div');div.style.cssText='display:flex;justify-content:space-between;align-items:center;background:#000;border:3px solid #ff0000;padding:14px;border-radius:14px;margin:10px 0;box-shadow:0 0 15px #ff0000';div.innerHTML='<div style="display:flex;align-items:center;gap:10px"><img src="pantera.png" style="width:42px;height:42px;border-radius:8px"><div><b>'+pl.d+'</b><br><small style=color:#ff0000>CONSULTAR PRECIO</small></div></div><a href="https://wa.me/523224528803?text=Hola%20quiero%20'+encodeURIComponent(p.n+' '+pl.d)+' TEMO STOR" target="_blank" style="padding:12px 18px;background:#ff0000;color:#fff;border-radius:24px;text-decoration:none;font-weight:900">COMPRAR</a>';l.appendChild(div)});document.getElementById('planModal').style.display='flex'}
if(location.search.includes('temo7'))document.getElementById('loginAdmin').style.display='flex';
function checkAdmin(){if(document.getElementById('adminUser').value==="TEMOSTOR"&&document.getElementById('adminPass').value==="TEMOSTOR"){document.getElementById('loginAdmin').style.display='none';document.getElementById('admin').style.display='block';renderAdmin();renderPagos();}}
function crearProducto(){let n=document.getElementById('newProdName').value.trim().toUpperCase();let i=document.getElementById('newProdIcon').value.trim()||'🔥';if(!n)return;let pr=getProds();pr.push({n:n,i:i,id:n.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-'+Date.now(),ps:[]});setProds(pr);document.getElementById('newProdName').value='';renderAdmin();}
function renderPagos(){let pagos=getPagos();let c=document.getElementById('pagosList');c.innerHTML='';if(pagos.length===0){c.innerHTML='<div style="text-align:center;color:#f00;padding:20px">No hay bancos</div>';return;}pagos.forEach((p,i)=>{let d=document.createElement('div');d.className='barraDespliegue';d.innerHTML=`<input id="pagoN-${i}" value="${p.nombre}" class="barraInput" style="flex:1"><input id="pagoD-${i}" value="${p.dato}" class="barraInput" style="flex:1"><button onclick="savePago(${i})" style="width:54px;height:54px;background:#ff0000;color:#fff;border:none;border-radius:13px">💾</button><button onclick="delPago(${i})" style="width:54px;height:54px;background:#000;border:3px solid #ff0000;color:#ff0000;border-radius:13px">X</button>`;c.appendChild(d);});}
function addBarraPago(){let cont=document.getElementById('contPagos');let id='pago-'+Date.now();let paises=Object.keys(BANCOS_POR_PAIS);let d=document.createElement('div');d.id='row-'+id;d.className='barraDespliegueCol';d.innerHTML=`<div style="display:flex;gap:9px;width:100%"><select id="paisSel-${id}" onchange="cambiarBancos('${id}')" class="barraInput" style="flex:1"><option value="">🌎 PAIS</option>${paises.map(p=>`<option value="${p}">${p}</option>`).join('')}<option value="OTRO">✏️ OTRO</option></select><select id="bancoSel-${id}" onchange="autoFill('${id}')" class="barraInput" style="flex:1"><option value="">🏦 BANCO</option></select></div><div style="display:flex;gap:9px;width:100%"><input id="newPN-${id}" class="barraInput" style="flex:1" placeholder="NOMBRE"><input id="newPD-${id}" class="barraInput" style="flex:1" placeholder="NUMERO"><button onclick="guardarNuevoPago('${id}')" style="width:70px;height:70px;background:#ff0000;color:#fff;border:none;border-radius:18px;font-size:34px">✔</button><button onclick="document.getElementById('row-${id}').remove()" style="width:56px;height:56px;background:#000;border:3px solid #ff0000;color:#ff0000;border-radius:13px">X</button></div>`;cont.appendChild(d);}
function cambiarBancos(id){let pais=document.getElementById('paisSel-'+id).value;let sel=document.getElementById('bancoSel-'+id);sel.innerHTML='<option value="">🏦 BANCO</option>';if(BANCOS_POR_PAIS[pais]){BANCOS_POR_PAIS[pais].forEach(b=>{let o=document.createElement('option');o.value=b;o.innerText=b;sel.appendChild(o);});}}
function autoFill(id){let pais=document.getElementById('paisSel-'+id).value;let banco=document.getElementById('bancoSel-'+id).value;let input=document.getElementById('newPN-'+id);if(!banco){input.value='';return;}input.value=pais+' - '+banco;}
function guardarNuevoPago(id){let n=document.getElementById('newPN-'+id).value.trim();let d=document.getElementById('newPD-'+id).value.trim();if(!n||!d){alert('Llena');return;}let p=getPagos();p.push({nombre:n.toUpperCase(),dato:d});setPagos(p);document.getElementById('row-'+id).remove();}
function savePago(i){let p=getPagos();p[i].nombre=document.getElementById(`pagoN-${i}`).value.toUpperCase();p[i].dato=document.getElementById(`pagoD-${i}`).value;setPagos(p);}
function delPago(i){let p=getPagos();p.splice(i,1);setPagos(p);}
function renderAdmin(){let prods=getProds();let keys=getKeys();let c=document.getElementById('aList');c.innerHTML='';prods.forEach(p=>{let card=document.createElement('div');card.className='cardA';let html=`<div style="display:flex;gap:9px"><input id="name-${p.id}" value="${p.n}" class="barraInput" style="flex:1"><input id="icon-${p.id}" value="${p.i}" class="barraInput" style="width:80px;text-align:center"><button onclick="saveName('${p.id}')" style="width:64px;height:64px;background:#ff0000;color:#fff;border:none;border-radius:14px">💾</button><button onclick="delProd('${p.id}')" style="width:64px;height:64px;background:#000;border:3px solid #ff0000;color:#ff0000;border-radius:14px">X</button></div><div style="margin:16px 0 8px;display:flex;gap:12px;align-items:center"><div style="flex:1;color:#ff0000;font-weight:900">🔴 DURACIONES:</div><button class="btnPlus" onclick="addBarra('${p.id}')">+</button></div><div id="cont-${p.id}">`;p.ps.forEach(pl=>{html+=`<div class="barraDespliegue"><input id="d-${pl.id}" value="${pl.d}" class="barraInput" style="flex:1"><input id="p-${pl.id}" type="number" value="${pl.p}" class="barraInput" style="width:115px"><button onclick="savePlan('${p.id}','${pl.id}')" style="width:54px;height:54px;background:#ff0000;color:#fff;border:none;border-radius:13px">💾</button><button onclick="delPlan('${p.id}','${pl.id}')" style="width:54px;height:54px;background:#000;border:3px solid #ff0000;color:#ff0000;border-radius:13px">X</button></div><textarea id="ta-${pl.id}" style="width:100%;min-height:65px;background:#000;border:3px solid #ff0000;color:#fff;border-radius:11px;padding:10px;margin-bottom:13px">${(keys[pl.id]?keys[pl.id].join('\n'):'')}</textarea><button onclick="saveKeys('${pl.id}')" style="width:100%;padding:11px;background:#000;border:3px solid #ff0000;color:#ff0000;border-radius:11px;margin-bottom:16px;font-weight:900">💾 GUARDAR KEYS (${keys[pl.id]?keys[pl.id].length:0})</button>`;});html+=`</div>`;card.innerHTML=html;c.appendChild(card)});}
function addBarra(pid){let cont=document.getElementById('cont-'+pid);let id='temp-'+Date.now();let d=document.createElement('div');d.id='row-'+id;d.className='barraDespliegue';d.innerHTML=`<input id="newD-${id}" class="barraInput" style="flex:1;border:4px solid #ff0000" placeholder="EJ: 7 DIAS"><input id="newP-${id}" type="number" class="barraInput" style="width:115px;border:4px solid #ff0000" placeholder="$"><button onclick="guardarNuevaBarra('${pid}','${id}')" style="width:70px;height:70px;background:#ff0000;color:#fff;border:none;border-radius:18px;font-size:34px">✔</button><button onclick="document.getElementById('row-${id}').remove()" style="width:54px;height:54px;background:#000;border:3px solid #ff0000;color:#ff0000;border-radius:13px">X</button>`;cont.appendChild(d);}
function guardarNuevaBarra(pid,id){let d=document.getElementById('newD-'+id).value.trim().toUpperCase();let pr=parseInt(document.getElementById('newP-'+id).value||0);if(!d)return;let prods=getProds();prods.find(x=>x.id===pid).ps.push({id:pid+'-'+Date.now(),d:d,p:pr});setProds(prods);renderAdmin();}
function saveName(pid){let prods=getProds();let p=prods.find(x=>x.id===pid);p.n=document.getElementById('name-'+pid).value.toUpperCase();p.i=document.getElementById('icon-'+pid).value;setProds(prods);renderAdmin()}
function delProd(pid){setProds(getProds().filter(x=>x.id!==pid));renderAdmin()}
function savePlan(pid,plid){let pl=getProds().find(x=>x.id===pid).ps.find(x=>x.id===plid);pl.d=document.getElementById('d-'+plid).value.toUpperCase();pl.p=parseInt(document.getElementById('p-'+plid).value||0);setProds(getProds());}
function delPlan(pid,plid){let p=getProds().find(x=>x.id===pid);p.ps=p.ps.filter(x=>x.id!==plid);setProds(getProds());renderAdmin();}
function saveKeys(id){let lines=document.getElementById('ta-'+id).value.split('\n').map(s=>s.trim()).filter(s=>s);let k=getKeys();k[id]=lines;setKeys(k);render();renderAdmin();}
function guardarConfig(){localStorage.setItem('temo_prods',JSON.stringify(getProds()));localStorage.setItem('temo_pagos',JSON.stringify(getPagos()));localStorage.setItem('temo_keys',JSON.stringify(getKeys()));alert('✅ TODO GUARDADO TEMO STOR');}
function limpiarVaciosForzado(){let todos = JSON.parse(localStorage.getItem('temo_pagos')||'[]');let conDato = todos.filter(x=>x.dato && x.dato.toString().trim()!=='');let borrados = todos.length - conDato.length;if(!confirm('¿Borrar '+borrados+' vacíos?')) return;localStorage.setItem('temo_pagos',JSON.stringify(conDato));renderPagos();renderPagosFront();}
</script></body></html>
