<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>TEMO STORE</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white overflow-x-hidden">

<header class="bg-red-600 p-3 flex justify-between items-center sticky top-0 z-50">
<b>TEMO STORE 🔥</b>
<div class="flex gap-2 items-center">
<span id="saldoDisplay" class="bg-black px-2 py-1 rounded-full text-[10px] font-black border">💰 $0</span>
<button onclick="adminPanel.classList.toggle('hidden')" class="bg-black px-3 py-1 rounded-full text-xs">⚙️</button>
<button id="cartBtn" class="bg-white text-black px-3 py-1 rounded-full font-black text-xs">🛒 <span id="cartCount">0</span></button>
</div>
</header>

<div class="max-w-md mx-auto p-3 space-y-3">
  <div class="flex gap-2"><input id="userId" placeholder="TU ID: TEMO-XXXX" class="flex-1 p-3 rounded-full text-black font-bold text-xs uppercase"><button onclick="cargarSaldo()" class="bg-red-600 px-4 rounded-full font-black text-xs">ENTRAR</button></div>
  <button onclick="crearAleatorio()" class="bg-yellow-400 text-black w-full py-3 rounded-full font-black">🎲 CREAR TU ID ALEATORIO</button>

  <div id="boxNuevoId" class="hidden bg-zinc-900 border-2 border-yellow-400 rounded-xl p-3">
    <p id="miIdGenerado" class="text-center text-green-400 font-black text-sm mb-3"></p>
    <div class="grid grid-cols-2 gap-2 mb-3">
      <button onclick="mostrarPago('transfer')" class="bg-[#009EE3] py-3 rounded-full font-black text-[10px]">💳 TRANSFERENCIA</button>
      <button onclick="mostrarPago('oxxo')" class="bg-yellow-400 text-black py-3 rounded-full font-black text-[10px]">🏪 PAGAR EN OXXO</button>
    </div>
    <div id="pagoTransfer" class="bg-black rounded-xl p-3 text-[11px]">
      <p class="font-black text-yellow-400 text-center mb-2">TRANSFERENCIA SPEI</p>
      <p>CLABE: <b class="select-all">722969027389252036</b></p>
      <p>Banco: <b>STP / Mercado Pago</b></p>
      <p>Titular: <b>Cuauhtémoc Martínez Silva</b></p>
      <p>Concepto: <b id="conceptoTxt" class="text-yellow-400"></b></p>
      <button onclick="copiarClabe()" class="bg-white text-black w-full mt-2 py-2 rounded-full font-black text-[10px]">COPIAR CLABE</button>
    </div>
    <div id="pagoOxxo" class="hidden bg-white text-black rounded-xl p-3 text-center">
      <p class="font-black text-xs mb-2">MUESTRA ESTO EN OXXO</p>
      <img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=2242170320800281" class="mx-auto w-56 h-56 border-2 border-black rounded-lg">
      <div class="bg-zinc-100 border-2 border-dashed rounded-lg p-2 mt-2"><b class="text-lg tracking-widest">2242 1703 2080 0281</b></div>
      <p class="text-[9px] mt-2">Hasta $5,000 por depósito - Mercado Pago</p>
    </div>
    <button onclick="enviarComprobante()" class="bg-[#25D366] w-full mt-3 py-3 rounded-full font-black text-xs">📤 ENVIAR COMPROBANTE</button>
  </div>
</div>

<div id="adminPanel" class="hidden max-w-md mx-auto bg-zinc-900 p-3 border-y border-zinc-800">
  <div id="loginDiv"><input id="email" placeholder="correo admin" class="w-full p-2 rounded text-black mb-2 text-sm"><input id="pass" type="password" placeholder="pass" class="w-full p-2 rounded text-black mb-2 text-sm"><button onclick="login()" class="bg-white text-black w-full p-2 rounded-full font-black">Entrar</button></div>
  <div id="panel" class="hidden"><div class="flex justify-between"><b>ADMIN</b><button onclick="logout()" class="bg-red-600 px-3 py-1 rounded-full text-xs">Salir</button></div><div id="lista" class="grid gap-2 mt-3"></div><div class="flex gap-1 mt-3"><input id="recargaId" placeholder="TEMO-XXXX" class="flex-1 p-2 rounded text-black text-xs"><input id="recargaMonto" type="number" placeholder="$" class="w-20 p-2 rounded text-black text-xs"><button onclick="recargar()" class="bg-green-500 px-3 rounded-full font-black">+</button></div></div>
</div>

<main id="productos" class="max-w-md mx-auto p-3 grid grid-cols-2 gap-3"></main>
<div class="text-center p-4"><button onclick="seed()" class="bg-zinc-800 px-4 py-2 rounded-full text-xs">⚠️ Restaurar productos si no aparecen</button></div>

<div id="cartModal" class="fixed inset-0 bg-black/80 hidden z-50 flex items-end justify-center"><div class="bg-white text-black w-full max-w-md rounded-t-2xl p-4"><h3 class="font-black">Pedido</h3><div id="cartItems"></div><div id="cartTotal" class="font-black mt-2"></div><button id="checkout" class="bg-green-500 text-white w-full p-3 rounded-full mt-3 font-black">COMPRAR CON SALDO</button><button onclick="cartModal.classList.add('hidden')" class="w-full mt-2 text-xs">Cerrar</button></div></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import {getFirestore,collection,doc,setDoc,getDoc,updateDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyDFsZ812v6bExs5VkjOA5T3YIBoW_0zGeU",authDomain:"temo-store-5b025.firebaseapp.com",projectId:"temo-store-5b025",storageBucket:"temo-store-5b025.firebasestorage.app",messagingSenderId:"18400776607",appId:"1:18400776607:web:79cc6e9e716afcd41c6daa"};
const app=initializeApp(firebaseConfig); const auth=getAuth(app); const db=getFirestore(app);
let cart=[], precios={}, usuarioActual=localStorage.getItem('temo_id')||null, saldoActual=0;
const base=[{id:"drip1",n:"Drip 1 Dia",p:4},{id:"drip7",n:"Drip 7 Dias",p:12},{id:"drip15",n:"Drip 15 Dias",p:15},{id:"drip30",n:"Drip 30 Dias",p:20},{id:"flou7",n:"Flourite 7 Dias",p:30},{id:"flou30",n:"Flourite 30 Dias",p:50},{id:"cuban1",n:"Cuban 1 Dia",p:3},{id:"cuban7",n:"Cuban 7 Dias",p:5},{id:"cuban30",n:"Cuban 30 Dias",p:10},{id:"hg1",n:"HG 1 Dia",p:5},{id:"hg10",n:"HG 10 Dias",p:12},{id:"hg30",n:"HG 30 Dias",p:18},{id:"pato30",n:"Pato Team 30 Dias",p:14}];

function generarId(){let c="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",r="";for(let i=0;i<5;i++)r+=c[Math.floor(Math.random()*c.length)];return"TEMO-"+r;}
window.mostrarPago=(t)=>{document.getElementById('pagoOxxo').classList.toggle('hidden',t!=='oxxo');document.getElementById('pagoTransfer').classList.toggle('hidden',t==='oxxo');}
window.crearAleatorio=async()=>{let id=generarId();await setDoc(doc(db,"users",id),{saldo:0});usuarioActual=id;saldoActual=0;localStorage.setItem('temo_id',id);document.getElementById('userId').value=id;document.getElementById('saldoDisplay').innerText=`💰 $${saldoActual} | ${id}`;document.getElementById('boxNuevoId').classList.remove('hidden');document.getElementById('miIdGenerado').innerText=`TU ID: ${id}`;document.getElementById('conceptoTxt').innerText=id;mostrarPago('transfer');}
window.copiarClabe=()=>{navigator.clipboard.writeText("722969027389252036");alert("Copiada");}
window.enviarComprobante=()=>{if(!usuarioActual)return alert("Crea ID");let m=`Hola Temo! ID ${usuarioActual} Concepto ${usuarioActual} Pagué a CLABE 722969027389252036 / OXXO 2242 1703 2080 0281`;window.open('https://wa.me/523224528803?text='+encodeURIComponent(m), '_blank');}
window.cargarSaldo=async()=>{let id=document.getElementById('userId').value.trim().toUpperCase();let s=await getDoc(doc(db,"users",id));if(!s.exists())return alert("ID no existe");usuarioActual=id;saldoActual=s.data().saldo||0;localStorage.setItem('temo_id',id);document.getElementById('saldoDisplay').innerText=`💰 $${saldoActual} | ${id}`;document.getElementById('boxNuevoId').classList.remove('hidden');document.getElementById('miIdGenerado').innerText=`TU ID: ${id} | Saldo: $${saldoActual}`;document.getElementById('conceptoTxt').innerText=id;}

function renderTienda(){
  const c=document.getElementById('productos');
  c.innerHTML='';
  let lista = Object.keys(precios).length>0? Object.entries(precios).map(([k,v])=>({id:k,...v})) : base.map(b=>({id:b.id,nombre:b.n,precio:b.p,keys:[]}));
  lista.forEach(p=>{
    let st=p.keys?p.keys.length:0;
    c.innerHTML+=`<div class="bg-zinc-900 border border-zinc-800 rounded-xl p-3"><b class="text-[11px]">${p.nombre}</b><p class="text-green-400 font-black">$${p.precio}</p><p class="text-[9px] ${st>0?'text-green-400':'text-red-400'}">${st>0?st+' keys':'Sin stock'}</p><button onclick="add('${p.id}','${p.nombre}',${p.precio})" class="bg-white text-black w-full mt-2 py-2 rounded-full font-bold text-[10px]">Comprar</button></div>`;
  });
}

onSnapshot(collection(db,"temo_precios"),snap=>{
  precios={};
  snap.forEach(d=>precios[d.id]=d.data());
  renderTienda();
  renderAdmin();
});

function renderAdmin(){
  let h=''; base.forEach(x=>{
    let d=precios[x.id]||{precio:x.p,keys:[]};
    h+=`<div class="bg-black p-2 rounded border border-zinc-800"><b class="text-[10px]">${x.n} - ${d.keys?d.keys.length:0}</b><div class="flex gap-1 mt-1"><input id="price_${x.id}" type="number" value="${d.precio||x.p}" class="w-16 p-1 rounded text-black text-xs"><button onclick="savePrice('${x.id}','${x.n}')" class="bg-white text-black px-2 rounded-full text-[10px]">OK</button></div><textarea id="keys_${x.id}" placeholder="keys" class="w-full mt-1 p-1 rounded text-black text-xs h-10"></textarea><button onclick="addKeys('${x.id}','${x.n}')" class="bg-green-500 w-full mt-1 py-1 rounded-full text-[10px] font-black">+ KEYS</button></div>`;
  });
  document.getElementById('lista').innerHTML=h;
}

window.add=(id,n,p)=>{cart.push({id,n,p});document.getElementById('cartCount').innerText=cart.length;}
document.getElementById('cartBtn').onclick=()=>{
  if(!cart.length)return alert('Vacío');
  let h='',t=0;cart.forEach(i=>{h+=`<div class="flex justify-between text-sm"><span>${i.n}</span><b>$${i.p}</b></div>`;t+=i.p;});
  document.getElementById('cartItems').innerHTML=h;
  document.getElementById('cartTotal').innerText='Total: $'+t;
  document.getElementById('cartModal').classList.remove('hidden');
}
document.getElementById('checkout').onclick=async()=>{
  let t=cart.reduce((a,b)=>a+b.p,0);
  if(!usuarioActual)return alert("Entra con ID");
  if(saldoActual<t)return alert(`Saldo insuficiente $${saldoActual}`);
  let msg='COMPRA%0A';
  for(let it of cart){
    let ref=doc(db,"temo_precios",it.id);
    let sn=await getDoc(ref);
    let key="SIN-STOCK";
    if(sn.exists()&&sn.data().keys&&sn.data().keys.length){key=sn.data().keys[0];await updateDoc(ref,{keys:sn.data().keys.slice(1)});}
    msg+=`${it.n} - ${key}%0A`;
  }
  await updateDoc(doc(db,"users",usuarioActual),{saldo:saldoActual-t});
  saldoActual-=t;
  document.getElementById('saldoDisplay').innerText=`💰 $${saldoActual} | ${usuarioActual}`;
  cart=[];document.getElementById('cartCount').innerText=0;
  document.getElementById('cartModal').classList.add('hidden');
  window.open('https://wa.me/523224528803?text='+msg,'_blank');
}

window.login=async()=>{try{await signInWithEmailAndPassword(auth,email.value,pass.value)}catch(e){alert(e.message)}}
window.logout=()=>signOut(auth);
onAuthStateChanged(auth,u=>{if(u){loginDiv.classList.add('hidden');panel.classList.remove('hidden');renderAdmin();}else{loginDiv.classList.remove('hidden');panel.classList.add('hidden');}});
window.savePrice=async(id,nom)=>{let v=Number(document.getElementById('price_'+id).value);let ref=doc(db,"temo_precios",id);let s=await getDoc(ref);let k=s.exists()?s.data().keys||[]:[];await setDoc(ref,{nombre:nom,precio:v,keys:k});}
window.addKeys=async(id,nom)=>{let txt=document.getElementById('keys_'+id).value.trim();if(!txt)return;let ns=txt.split('\n').map(s=>s.trim()).filter(s=>s);let ref=doc(db,"temo_precios",id);let s=await getDoc(ref);let d=s.exists()?s.data():{nombre:nom,precio:0,keys:[]};await setDoc(ref,{nombre:nom,precio:d.precio||0,keys:[...(d.keys||[]),...ns]});document.getElementById('keys_'+id).value='';}
window.recargar=async()=>{let id=document.getElementById('recargaId').value.trim().toUpperCase();let m=Number(document.getElementById('recargaMonto').value);let ref=doc(db,"users",id);let s=await getDoc(ref);if(!s.exists())return alert("No existe");await updateDoc(ref,{saldo:(s.data().saldo||0)+m});alert(`+ $${m} a ${id}`);}
window.seed=async()=>{for(let b of base){let ref=doc(db,"temo_precios",b.id);let s=await getDoc(ref);if(!s.exists()){await setDoc(ref,{nombre:b.n,precio:b.p,keys:[]});}}alert("Restaurados, recarga la página");}
if(usuarioActual){document.getElementById('userId').value=usuarioActual;cargarSaldo();}
renderTienda();
</script>
</body>
</html>
