<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TEMO STORE</title><style>body{background:#000;color:#fff;font-family:Arial;margin:0}#a{display:none;position:fixed;inset:0;background:#000;z-index:9999;overflow:auto;padding:12px}.c{max-width:480px;margin:10px auto;background:#111;border-radius:12px;padding:12px;border:1px solid #0f0}input,select{width:100%;padding:12px;margin:5px 0;background:#000;color:#fff;border:1px solid #333;border-radius:8px}.b{width:100%;padding:12px;border-radius:8px;font-weight:900;border:none;margin-top:6px}.t{background:#000;border-bottom:3px solid red;padding:14px;text-align:center;font-weight:900;font-size:20px}.t span{color:red}.i{background:#1a1a1a;margin:3px 0;padding:7px;border-radius:6px;display:flex;justify-content:space-between}</style></head><body>
<div id="a"><h1 style="color:red;text-align:center">👑 ADMIN TEMO - SIN PEDIR CUENTA</h1>
<div class="c"><h3 style="color:#0f0;text-align:center">👤 CREAR CLIENTE</h3><input id="n1" placeholder="Usuario"><input id="n2" placeholder="Pass"><input id="n3" type="number" placeholder="Saldo"><button onclick="let u=n1.value.toLowerCase().trim(),p=n2.value,s=parseInt(n3.value)||0,x=JSON.parse(localStorage.getItem('tu')||'{}');x[u]={pass:p,saldo:s};localStorage.setItem('tu',JSON.stringify(x));alert('Creado '+u);R()" class="b" style="background:#0f0;color:#000">✅ CREAR</button><hr style="margin:10px 0"><h3 style="color:#0f0;text-align:center">💰 SALDO</h3><input id="a1" placeholder="Usuario"><input id="a2" type="number" placeholder="100 o -50"><button onclick="let u=a1.value.toLowerCase().trim(),m=parseInt(a2.value),x=JSON.parse(localStorage.getItem('tu')||'{}');if(!x[u])return alert('No existe');x[u].saldo+=m;localStorage.setItem('tu',JSON.stringify(x));alert('Saldo '+u+' $'+x[u].saldo);R()" class="b" style="background:#0f0;color:#000">💰 APLICAR</button><hr style="margin:10px 0"><h3 style="color:#ff0;text-align:center">🔑 KEYS</h3><select id="k1"><option>DRIP 1 DIA</option><option>DRIP 7 DIAS</option><option>DRIP 30 DIAS</option><option>CUBAN 30 DIAS</option><option>PATO 30 DIAS</option></select><button onclick="let t=k1.value,a=JSON.parse(localStorage.getItem('tk')||'[]');let k=t.slice(0,4)+'-'+Math.random().toString(36).substr(2,6).toUpperCase();a.push({key:k,tipo:t});localStorage.setItem('tk',JSON.stringify(a));R()" class="b" style="background:#ff0;color:#000">GENERAR</button><div id="lk" style="background:#000;padding:6px;border-radius:8px;margin-top:6px;max-height:120px;overflow:auto;font-size:11px"></div><hr style="margin:10px 0"><div id="lu" style="background:#000;padding:6px;border-radius:8px;max-height:150px;overflow:auto;font-size:12px"></div></div><button onclick="a.style.display='none';location.href='/'" class="b" style="background:#333;max-width:480px;margin:10px auto;display:block">❌ CERRAR</button></div>
<div class="t">TEMO <span>STORE</span></div>
<script>
function R(){let x=JSON.parse(localStorage.getItem('tu')||'{}'),h='';for(let k in x)h+=`<div class=i><span>${k}/${x[k].pass}</span><b style=color:#0f0>$${x[k].saldo}</b></div>`;document.getElementById('lu').innerHTML=h||'Sin clientes';let a=JSON.parse(localStorage.getItem('tk')||'[]'),hh='';for(let i=a.length-1;i>=0;i--)hh+=`<div class=i><span>${a[i].tipo}</span><b style=color:#ff0>${a[i].key}</b></div>`;document.getElementById('lk').innerHTML=hh||'Sin keys';}
if(location.href.toLowerCase().includes('admin')){document.getElementById('a').style.display='block';}R();
</script></body></html>
