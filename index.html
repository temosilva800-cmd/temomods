<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TEMO V58 ADMIN FORZADO</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial Black}body{background:#000;color:#f00}
.top{padding:18px;border-bottom:4px solid #f00;box-shadow:0 0 30px #f00;background:#000;position:sticky;top:0;z-index:10;text-align:center}
.cardAdmin{background:#111;border:3px solid #f00;border-radius:16px;padding:14px;margin:12px 0;box-shadow:0 0 20px #f00}
.barraInput{width:100%;padding:14px;background:#000;border:2px solid #f00;color:#f00;border-radius:10px;margin:6px 0;text-align:center;font-weight:900}
.btnR{padding:10px 20px;background:#f00;color:#000;border:none;border-radius:12px;font-weight:900;cursor:pointer;margin:6px 0;width:100%}
.btnN{padding:10px 20px;background:#000;border:2px solid #f00;color:#f00;border-radius:12px;font-weight:900;cursor:pointer;margin:6px 0;width:100%}
</style></head><body>
<div class="top"><b>🔥 TEMO V58 ADMIN 🔥</b></div>

<div id="front" style="padding:12px">
<button onclick="abrirVentas()" class="btnN" style="border-color:#fff;color:#fff">💰 MIS VENTAS</button>
<div id="listaFront"></div>
<button onclick="document.getElementById('login').style.display='flex'" class="btnN">🔑 ADMIN?temo7</button>
</div>

<!-- MIS VENTAS MODAL -->
<div id="ventasModal" style="position:fixed;inset:0;background:#000;z-index:999;display:none;overflow:auto;padding:12px">
<h2 style="text-align:center" id="tituloPanel">PANEL SEBA</h2>
<div style="display:flex;gap:10px"><div class="cardAdmin" style="flex:1;text-align:center"><b id="vCount">0</b><br>VENTAS</div><div class="cardAdmin" style="flex:1;text-align:center"><b id="gCount">$0</b><br>GANADO</div></div>
<div class="cardAdmin"><div id="linkTxt" style="font-size:10px;word-break:break-all"></div><button onclick="navigator.clipboard.writeText(document.getElementById('linkTxt').innerText);alert('Copiado')" class="btnR">COPIAR LINK</button></div>
<div class="cardAdmin"><b>✅ YA HICE UNA VENTA</b><input id="vProd" class="barraInput" placeholder="Ej: Holo vip"><input id="vPrecio" type="number" class="barraInput" placeholder="Ej: 30"><button onclick="registrarVenta()" class="btnR">🔥 REGISTRAR</button></div>
<div class="cardAdmin"><div id="logVentas"></div></div>
<button onclick="document.getElementById('ventasModal').style.display='none'" class="btnN">CERRAR</button>
</div>

<!-- LOGIN -->
<div id="login" style="position:fixed;inset:0;background:#000;z-index:10000;display:flex;align-items:center;justify-content:center;padding:20px">
<div class="cardAdmin" style="width:100%;max-width:400px"><h2 style="text-align:center">TEMOSTOR</h2><input id="u" class="barraInput" placeholder="USUARIO" value="TEMOSTOR"><input id="p" type="password" class="barraInput" placeholder="CONTRA" value="TEMOSTOR"><button onclick="entrarAdmin()" class="btnR">ENTRAR</button><button onclick="document.getElementById('login').style.display='none'" class="btnN">VER TIENDA</button></div>
</div>

<!-- ADMIN -->
<div id="admin" style="position:fixed;inset:0;background:#000;z-index:10001;display:none;overflow:auto;padding:12px">
<h1 style="text-align:center">🔥 ADMIN V58 🔥</h1>
<div class="cardAdmin"><h3>👥 REVENDEDORES - Si no ves nada dale a CREAR SEBA</h3><div id="aRevs">CARGANDO...</div><button onclick="crearSebaForzado()" class="btnR">+ CREAR SEBA FORZADO</button><button onclick="crearChiri()" class="btnN">+ CREAR CHIRI</button></div>
<div class="cardAdmin"><h3>📦 PRODUCTOS</h3><div id="aProds"></div></div>
<div class="cardAdmin"><h3>📋 LOG VENTAS</h3><div id="aLogs"></div><button onclick="localStorage.setItem('temo_ventas_log','[]');renderAdmin();alert('Borrado')" class="btnN">BORRAR LOGS</button></div>
<button onclick="location.href=location.pathname" class="btnR" style="margin-top:20px">SALIR</button>
</div>

<script>
// FORZAR DATOS SI ESTA VACIO
let revs=JSON.parse(localStorage.getItem('temo_revs')||'[]');
if(revs.length==0){
  revs=[{nombre:'SEBA',codigo:'seba',ventas:1,ganancia:1.5},{nombre:'CHIRI',codigo:'chiri2370',ventas:0,ganancia:0}];
  localStorage.setItem('temo_revs',JSON.stringify(revs));
  localStorage.setItem('temo_ventas_log',JSON.stringify([{codigo:'seba',producto:'7 dias drip',precio:10,comision:1.5,fecha:new Date().toLocaleString()}]));
}
let codigoActual='seba';

function renderFront(){
  document.getElementById('listaFront').innerHTML='<div class=cardAdmin>💧 DRIP CLIENT - TIENDA ACTIVA</div>';
}
renderFront();

function abrirVentas(){
  let p=new URLSearchParams(location.search).get('panel');
  if(p && p.trim()!='') codigoActual=p.toLowerCase();
  codigoActual=localStorage.getItem('ultimo_panel')||codigoActual;
  localStorage.setItem('ultimo_panel',codigoActual);
  let r=JSON.parse(localStorage.getItem('temo_revs')||'[]').find(x=>x.codigo.toLowerCase()===codigoActual.toLowerCase())||JSON.parse(localStorage.getItem('temo_revs')||'[]')[0];
  if(!r){alert('No hay revendedores, crea uno en admin');return;}
  document.getElementById('tituloPanel').innerText='👥 PANEL DE '+r.nombre;
  document.getElementById('vCount').innerText=r.ventas;
  document.getElementById('gCount').innerText='$'+parseFloat(r.ganancia).toFixed(2);
  document.getElementById('linkTxt').innerText=location.origin+location.pathname+'?ref='+r.codigo.toLowerCase();
  let logs=JSON.parse(localStorage.getItem('temo_ventas_log')||'[]').filter(x=>x.codigo===r.codigo.toLowerCase());
  document.getElementById('logVentas').innerHTML=logs.map(l=>`<small>📅 ${l.fecha}<br>📦 ${l.producto} $${l.precio} → $${l.comision}</small><hr style="border-color:#f00">`).join('')||'Sin ventas';
  document.getElementById('ventasModal').style.display='block';
}

function registrarVenta(){
  let prod=document.getElementById('vProd').value.trim();
  let prec=parseFloat(document.getElementById('vPrecio').value);
  if(!prod||isNaN(prec)){alert('Llena producto y precio');return;}
  let com=prec*0.15;
  let revs=JSON.parse(localStorage.getItem('temo_revs')||'[]');
  let idx=revs.findIndex(x=>x.codigo.toLowerCase()===codigoActual.toLowerCase());
  if(idx<0) idx=0;
  revs[idx].ventas++;
  revs[idx].ganancia+=com;
  localStorage.setItem('temo_revs',JSON.stringify(revs));
  let logs=JSON.parse(localStorage.getItem('temo_ventas_log')||'[]');
  logs.push({codigo:codigoActual,producto:prod,precio:prec,comision:com,fecha:new Date().toLocaleString()});
  localStorage.setItem('temo_ventas_log',JSON.stringify(logs));
  document.getElementById('vProd').value='';document.getElementById('vPrecio').value='';
  abrirVentas();
  renderAdmin();
  alert('REGISTRADO '+prod+' $'+prec+' com $'+com.toFixed(2));
}

function renderAdmin(){
  let revs=JSON.parse(localStorage.getItem('temo_revs')||'[]');
  document.getElementById('aRevs').innerHTML=revs.length?revs.map((r,i)=>`<div style="border:1px solid #f00;padding:6px;margin:4px 0;border-radius:8px;display:flex;justify-content:space-between"><span>${r.nombre} (${r.codigo}) - ${r.ventas} v $${parseFloat(r.ganancia).toFixed(2)}</span><button onclick="borrarRev(${i})" style="background:#f00;color:#000;border:none;padding:4px 8px;border-radius:6px">X</button></div>`).join(''):'VACIO - Dale a CREAR SEBA FORZADO';
  let logs=JSON.parse(localStorage.getItem('temo_ventas_log')||'[]');
  document.getElementById('aLogs').innerHTML=logs.slice().reverse().map(l=>`<div><small>${l.fecha} - ${l.codigo} - ${l.producto} $${l.precio}</small></div>`).join('')||'Sin logs';
  document.getElementById('aProds').innerHTML='DRIP CLIENT ACTIVO';
}

function entrarAdmin(){
  if(document.getElementById('u').value==='TEMOSTOR' && document.getElementById('p').value==='TEMOSTOR'){
    document.getElementById('login').style.display='none';
    document.getElementById('admin').style.display='block';
    renderAdmin();
  }else{alert('Usuario o contra mal');}
}

function crearSebaForzado(){
  let revs=JSON.parse(localStorage.getItem('temo_revs')||'[]');
  if(!revs.find(x=>x.codigo==='seba')) revs.push({nombre:'SEBA',codigo:'seba',ventas:1,ganancia:1.5});
  localStorage.setItem('temo_revs',JSON.stringify(revs));
  renderAdmin();
  alert('SEBA CREADO');
}
function crearChiri(){
  let revs=JSON.parse(localStorage.getItem('temo_revs')||'[]');
  if(!revs.find(x=>x.codigo==='chiri2370')) revs.push({nombre:'CHIRI',codigo:'chiri2370',ventas:0,ganancia:0});
  localStorage.setItem('temo_revs',JSON.stringify(revs));
  renderAdmin();
}
function borrarRev(i){let revs=JSON.parse(localStorage.getItem('temo_revs')||'[]');revs.splice(i,1);localStorage.setItem('temo_revs',JSON.stringify(revs));renderAdmin();}

// Si viene con?temo7 auto muestra login
if(location.search.includes('temo7')){
  document.getElementById('login').style.display='flex';
}else{
  document.getElementById('login').style.display='none';
}
renderAdmin();
</script></body></html>
