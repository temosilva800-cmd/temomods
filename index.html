<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TEMO STORE</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#000 url('fondo-rojo-neon.webp') center/cover fixed; color:white; font-family:Arial}
  .overlay{background:rgba(0,0,0,0.75); min-height:100vh; padding:20px; display:flex; flex-direction:column; align-items:center}
  h1{font-size: clamp(40px, 12vw, 75px); color:#ff0000; text-shadow:0 0 20px red; text-align:center; margin-top:30px; line-height:0.9}
  h2{font-size: clamp(20px, 6vw, 32px); margin:15px 0 30px; text-align:center}
  #tienda{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:20px; width:100%; max-width:1100px}
  .producto{background:#111; border:1px solid #ff0000; border-radius:15px; padding:15px; text-align:center; box-shadow:0 0 15px #ff000033}
  .producto img{width:100%; height:180px; object-fit:cover; border-radius:10px}
  .btn{padding:10px 25px; background:#ff0000; color:white; text-decoration:none; border-radius:30px; display:inline-block; margin-top:10px; font-weight:bold}
  /* PANEL OCULTO */
  #admin{display:none; max-width:600px; width:100%; margin:50px auto; background:#1a1a1a; padding:20px; border-radius:15px; border:2px solid red}
  #admin input{width:100%; padding:12px; margin:8px 0; border-radius:8px; border:none}
  #admin button{width:100%; padding:12px; background:red; color:white; border:none; border-radius:8px; margin-top:10px; font-weight:bold}
</style>
</head>
<body>
<div class="overlay">
  <h1>TEMO<br>STORE</h1>
  <h2>TEMO NG ⁶⁶⁶</h2>
  <div id="tienda"></div>

  <div id="admin">
    <h3 style="color:red; text-align:center">PANEL TEMO</h3>
    <input id="nombre" placeholder="Nombre: Ej Mod Menu">
    <input id="precio" placeholder="Precio: Ej $99">
    <input id="imagen" placeholder="Link imagen https://...">
    <input id="link" value="https://wa.me/523224528803">
    <input id="duracion" type="number" value="1" placeholder="Duración animación">
    <button onclick="agregarProducto()">AGREGAR PRODUCTO</button>
    <button onclick="localStorage.clear(); location.reload()" style="background:#550000">BORRAR TODO</button>
  </div>
  <p style="margin-top:30px; font-size:12px; color:#666">Toca 5 veces el título para abrir el panel admin</p>
</div>

<script>
let productos = JSON.parse(localStorage.getItem('temo_productos')) || [
  {nombre:"MOD MENU VIP", precio:"$150", imagen:"https://via.placeholder.com/300x180/ff0000/ffffff?text=MOD+MENU", link:"https://wa.me/523224528803"},
  {nombre:"CUENTA CHE TADA", precio:"$250", imagen:"https://via.placeholder.com/300x180/111111/ff0000?text=CUENTA", link:"https://wa.me/523224528803"}
];
function mostrarProductos(){
  document.getElementById('tienda').innerHTML = productos.map((p,i)=>`
    <div class="producto">
      <img src="${p.imagen}">
      <h3 style="color:#ff0000; margin:10px 0">${p.nombre}</h3>
      <div style="font-weight:bold; font-size:20px">${p.precio}</div>
      <a href="${p.link}" target="_blank" class="btn">COMPRAR POR WHATSAPP</a>
    </div>
  `).join('');
}
function agregarProducto(){
  let n={nombre:nombre.value, precio:precio.value, imagen:imagen.value || "https://via.placeholder.com/300x180/ff0000/ffffff?text=TEMO", link:link.value};
  if(!n.nombre) return alert("Pon nombre");
  productos.push(n); localStorage.setItem('temo_productos', JSON.stringify(productos)); mostrarProductos();
}
// TRUCO: 5 toques en el titulo para abrir admin
let toques=0; document.querySelector('h1').addEventListener('click', ()=>{
  toques++; if(toques>=5){ let pass=prompt("Contraseña:"); if(pass==="temo666"){ document.getElementById('admin').style.display='block'; } toques=0; }
});
mostrarProductos();
</script>
</body>
</html>
