<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Temo Store</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-gray-50">
<header class="bg-black text-white p-4 flex justify-between"><b>TEMO STORE</b><button id="cartBtn">🛒 <span id="cartCount">0</span></button></header>
<div class="p-4 bg-yellow-100"><input id="pName" placeholder="Nombre producto" class="border p-2 w-full mb-2 rounded"><input id="pPrice" type="number" placeholder="Precio" class="border p-2 w-full mb-2 rounded"><input id="pImage" placeholder="Link imagen" class="border p-2 w-full mb-2 rounded"><button id="addProduct" class="bg-black text-white p-2 w-full rounded">Agregar</button></div>
<main id="products" class="p-4 grid grid-cols-2 gap-4"></main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import {getFirestore,collection,addDoc,onSnapshot,deleteDoc,doc} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyDFsZ812v6bExs5VkjOA5T3YIBoW_0zGeU",authDomain:"temo-store-5b025.firebaseapp.com",projectId:"temo-store-5b025",storageBucket:"temo-store-5b025.firebasestorage.app",messagingSenderId:"18400776607",appId:"1:18400776607:web:79cc6e9e716afcd41c6daa",measurementId:"G-XVNNBVCE7Z"};
const app=initializeApp(firebaseConfig);const db=getFirestore(app);const col=collection(db,"productos");
let cart=[];onSnapshot(col,s=>{const c=document.getElementById('products');c.innerHTML='';s.forEach(d=>{const p=d.data();c.innerHTML+=`<div class="bg-white rounded shadow p-2"><img src="${p.image||'https://via.placeholder.com/300'}" class="w-full h-32 object-cover"><b>${p.name}</b><p class="text-red-600 font-bold">$${p.price}</p><button onclick="addToCart('${p.name}',${p.price})" class="bg-black text-white w-full py-1 rounded mt-1">Agregar</button><button onclick="del('${d.id}')" class="text-xs text-gray-400">Borrar</button></div>`});if(s.empty)c.innerHTML='<p class="col-span-2 text-center mt-10">No hay productos aún. Agrega uno arriba 👆</p>'});
window.addToCart=(n,p)=>{cart.push({n,p});document.getElementById('cartCount').innerText=cart.length;alert(n+' agregado')};window.del=async id=>{if(confirm('¿Borrar?'))await deleteDoc(doc(db,"productos",id))};
document.getElementById('addProduct').onclick=async()=>{const n=document.getElementById('pName').value,pr=document.getElementById('pPrice').value,im=document.getElementById('pImage').value;if(!n||!pr)return alert('Falta nombre/precio');await addDoc(col,{name:n,price:Number(pr),image:im});document.getElementById('pName').value='';document.getElementById('pPrice').value='';document.getElementById('pImage').value='';};
document.getElementById('cartBtn').onclick=()=>{if(!cart.length)return alert('Carrito vacío');let m='Hola Temo! Quiero:%0A',t=0;cart.forEach(i=>{m+=`- ${i.n} $${i.p}%0A`;t+=i.p});m+=`Total $${t}`;window.open('https://wa.me/523921234567?text='+m)};
</script></body></html>
