<script>

],

{nombre:'MEXICO 🇲🇽 - OXXO 2242 1703 2080 0281',dato:'2242 1703 2080 0281'},
{nombre:'MEXICO 🇲🇽 - CLABE STP 722969027389252036',dato:'722969027389252036'},
{nombre:'BINANCE ID 1150540078',dato:'1150540078'}
],

async function cargarNube(){
try{
document.getElementById('status').innerText="☁️ CARGANDO...";
let r=await fetch(BIN_URL);

async function guardarNube(){

function copiar(t){navigator.clipboard.writeText(t).then(()=>{let b=event.target;let o=b.innerText;b.innerText="✅ COPIADO!";setTimeout(()=>b.innerText=o,1500);});}
function render(){let c=document.getElementById('lista');c.innerHTML='';DB.prods.forEach(p=>{let d=document.createElement('div');d.className='prod';d.innerHTML='<div><b>'+p.i+' '+p.n+'</b><br><small>'+p.ps.length+' planes</small></div><button class=btn onclick=ver(\''+p.id+'\')>VER</button>';c.appendChild(d);});}
function renderPagosFront(){
let c=document.getElementById('pagosFront');
let pagos=DB.pagos.filter(p=>p.dato && p.dato.trim()!=='');
c.innerHTML='<div class=pagosBox><h3 style="color:#f00;text-align:center">💳 '+pagos.length+' PAGOS - DALE COPIAR 📋</h3>'+pagos.map(p=>'<div class=pagoItem><div><b>'+p.nombre+'</b><br><span style=color:#f00>'+p.dato+'</span></div><button class=btnCopy onclick=copiar(\''+p.dato+'\')>📋 COPIAR</button></div>').join('')+'<div style="text-align:center;margin-top:10px;padding:10px;border:2px dashed #f00;border-radius:10px"><b>👉🏻 ASEPTO CUALQUIER METODO DE PAGO ✅</b><br><small>+523224528803 AQUI TU MAGIA</small></div></div>';
document.getElementById('grupoFront').href=DB.grupo;

function ver(pid){let p=DB.prods.find(x=>x.id===pid);document.getElementById('planTitle').innerText=p.i+' '+p.n;let l=document.getElementById('planList');l.innerHTML='';p.ps.forEach(pl=>{let div=document.createElement('div');div.style.cssText='display:flex;justify-content:space-between;align-items:center;background:#000;border:3px solid #f00;padding:14px;border-radius:14px;margin:10px 0;box-shadow:0 0 30px #f00';div.innerHTML='<div><b>'+pl.d+'</b><br><b style=color:#f00>$'+pl.p+'</b></div><a href="https://wa.me/523224528803?text=Hola%20quiero%20'+encodeURIComponent(p.n+' '+pl.d)+'" target="_blank" style="padding:12px 18px;background:#f00;color:#fff;border-radius:24px;text-decoration:none;font-weight:900">COMPRAR</a>';l.appendChild(div);});document.getElementById('planPagosList').innerHTML='<div class=pagosBox>'+DB.pagos.map(p=>'<div class=pagoItem><div><b>'+p.nombre+'</b><br><span style=color:#f00>'+p.dato+'</span></div><button class=btnCopy onclick=copiar(\''+p.dato+'\')>📋 COPIAR</button></div>').join('')+'</div><a href="'+DB.grupo+'" target="_blank" style="display:block;padding:14px;background:#000;border:3px solid #f00;color:#f00;border-radius:12px;text-align:center;margin-top:10px;text-decoration:none">👥 UNIRME A GRUPO</a>';document.getElementById('planModal').style.display='flex';}

function checkAdmin(){if(document.getElementById('adminUser').value==="TEMOSTOR"&&document.getElementById('adminPass').value==="TEMOSTOR"){document.getElementById('loginAdmin').style.display='none';document.getElementById('admin').style.display='block';renderAdmin();renderPagosAdmin();}}
function crearProducto(){let n=document.getElementById('newProdName').value.trim().toUpperCase();let i=document.getElementById('newProdIcon').value.trim()||'🔥';if(!n)return alert('Nombre');DB.prods.push({n:n,i:i,id:n.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-'+Date.now(),ps:[{id:'p-'+Date.now(),d:'7 DIAS',p:10}]});document.getElementById('newProdName').value='';guardarNube();}
function renderPagosAdmin(){let c=document.getElementById('pagosList');c.innerHTML='';DB.pagos.forEach((p,i)=>{let d=document.createElement('div');d.style.cssText='display:flex;gap:8px;margin:8px 0';d.innerHTML='<input id="pn-'+i+'" value="'+p.nombre+'" class="barraInput" style="flex:1"><input id="pd-'+i+'" value="'+p.dato+'" class="barraInput" style="flex:1"><button onclick="DB.pagos['+i+'].nombre=document.getElementById(\'pn-'+i+'\').value.toUpperCase();DB.pagos['+i+'].dato=document.getElementById(\'pd-'+i+'\').value;guardarNube()" style="width:54px;height:54px;background:#f00;color:#fff;border:none;border-radius:13px">💾</button><button onclick="DB.pagos.splice('+i+',1);guardarNube()" style="width:54px;height:54px;background:#000;border:3px solid #f00;color:#f00;border-radius:13px">X</button>';c.appendChild(d);});}
function addPago(){let n=prompt('Nombre:');let d=prompt('Numero:');if(!n||!d)return;DB.pagos.push({nombre:n.toUpperCase(),dato:d});guardarNube();}
function renderAdmin(){let c=document.getElementById('aList');c.innerHTML='';DB.prods.forEach(p=>{let card=document.createElement('div');card.className='cardA';let html='<div style="display:flex;gap:9px"><input id="name-'+p.id+'" value="'+p.n+'" class="barraInput" style="flex:1"><input id="icon-'+p.id+'" value="'+p.i+'" class="barraInput" style="width:80px;text-align:center"><button onclick="saveName(\''+p.id+'\')" style="width:64px;height:64px;background:#f00;color:#fff;border:none;border-radius:14px">💾</button><button onclick="delProd(\''+p.id+'\')" style="width:64px;height:64px;background:#000;border:3px solid #f00;color:#f00;border-radius:14px">X</button></div><div style="margin:14px 0;display:flex;justify-content:space-between"><b style="color:#f00">PLANES:</b><button class=btnPlus onclick=addPlan(\''+p.id+'\')>+</button></div><div id="cont-'+p.id+'">';p.ps.forEach(pl=>{html+='<div style="display:flex;gap:8px;margin:8px 0"><input id="d-'+pl.id+'" value="'+pl.d+'" class="barraInput" style="flex:1"><input id="p-'+pl.id+'" type="number" value="'+pl.p+'" class="barraInput" style="width:110px"><button onclick="savePlan(\''+p.id+'\',\''+pl.id+'\')" style="width:54px;height:54px;background:#f00;color:#fff;border:none;border-radius:13px">💾</button><button onclick="delPlan(\''+p.id+'\',\''+pl.id+'\')" style="width:54px;height:54px;background:#000;border:3px solid #f00;color:#f00;border-radius:13px">X</button></div>';});html+='</div>';card.innerHTML=html;c.appendChild(card);});}
function saveName(pid){let p=DB.prods.find(x=>x.id===pid);p.n=document.getElementById('name-'+pid).value.toUpperCase();p.i=document.getElementById('icon-'+pid).value;guardarNube();}
function delProd(pid){DB.prods=DB.prods.filter(x=>x.id!==pid);guardarNube();}
function addPlan(pid){let d=prompt('Duracion:');let pr=prompt('Precio:');if(!d||!pr)return;DB.prods.find(x=>x.id===pid).ps.push({id:pid+'-'+Date.now(),d:d.toUpperCase(),p:parseInt(pr)});guardarNube();}
function savePlan(pid,plid){let pl=DB.prods.find(x=>x.id===pid).ps.find(x=>x.id===plid);pl.d=document.getElementById('d-'+plid).value.toUpperCase();pl.p=parseInt(document.getElementById('p-'+plid).value);guardarNube();}
function delPlan(pid,plid){let p=DB.prods.find(x=>x.id===pid);p.ps=p.ps.filter(x=>x.id!==plid);guardarNube();}
