<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Temo Store</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-black text-white">
<header class="bg-red-600 p-3 flex justify-between sticky top-0 z-50"><b>TEMO STORE 🔥</b><div class="flex gap-2 items-center"><span id="saldoDisplay" class="bg-black px-3 py-1 rounded-full text-xs font-black">Saldo: $0</span><button onclick="document.getElementById('adminPanel').classList.toggle('hidden')" class="bg-black px-3 py-1 rounded-full text-xs">⚙️ Admin</button><button id="cartBtn" class="bg-white text-black px-3 py-1 rounded-full font-black">🛒 <span id="cartCount">0</span></button></div></header>
<div class="bg-yellow-400 text-black text-center p-1 font-black text-[10px]">PAGO INMEDIATO | ENTREGA AUTOMATICA</div>

<!-- LOGIN USUARIO TEMO1 -->
<div class="bg-zinc-900 p-3 flex gap-2">
  <input id="userId" placeholder="Tu ID: temo1" class="flex-1 p-2 rounded text-black text-sm font-bold">
  <button onclick="cargarSaldo()" class="bg-red-600 px-4 py-2 rounded-full font-black text-xs">CARGAR SALDO</button>
</div>

<div id="adminPanel" class="hidden bg-zinc-900 p-3 border-b-2 border-red-600"><div id="loginDiv"><input id="email" placeholder="tu correo" class="w-full p-2 rounded text-black mb-1 text-sm"><input id="pass" type="password" placeholder="contraseña" class="w-full p-2 rounded text-black mb-1 text-sm"><button onclick="login()" class="bg-white text-black w-full p-2 rounded-full font-black">Entrar</button></div><div id="panel" class="hidden"><p id="userEmail" class="text-green-400 text-xs mb-2"></p><div id="lista" class="grid gap-2"></div><button onclick="logout()" class="bg-red-600 w-full p-2 rounded-full mt-2 text-xs">Salir</button></div></div>

<main id="productos" class="p-3 grid grid-cols-2 gap-3"></main>
<div class="p-4 text-center"><button onclick="seed()" class="bg-zinc-800 text-xs px-4 py-2 rounded-full">⚠️ Si no ves productos, pícale aquí</button></div>

<div id="cartModal" class="fixed inset-0 bg-black/80 hidden z-50 flex items-end"><div class="bg-white text-black w-full rounded-t-2xl p-4"><h3 class="font-black">Tu Pedido</h3><div id="cartItems"></div><div id="cartTotal" class="font-black text-xl mt-2"></div><button id="checkout" class="bg-[#25D366] text-white w-full p-3 rounded-full mt-3 font-black">PEDIR POR WHATSAPP</button><button onclick="cartModal.classList.add('hidden')" class="w-full mt-2 text-xs">Cerrar</button></div></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import {getFirestore,collection,doc,setDoc,onSnapshot,getDoc,updateDoc} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyDFsZ812v6bExs5VkjOA5T3YIBoW_0zGeU",authDomain:"temo-store-5b025.firebaseapp.com",projectId:"temo-store-5b025",storageBucket:"temo-store-5b025.firebasestorage.app",messagingSenderId:"18400776607",appId:"1:18400776607:web:79cc6e9e716afcd41c6daa"};
const app=initializeApp(firebaseConfig); const auth=getAuth(app); const db=getFirestore(app);
let cart=[]; let precios={}; let usuarioActual=null; let saldoActual=0;
const base=[{id:"drip1",n:"Drip 1 Dia",p:4},{id:"drip7",n:"Drip 7 Dias",p:12},{id:"drip15",n:"Drip 15 Dias",p:15},{id:"drip30",n:"Drip 30 Dias",p:20},{id:"flou7",n:"Flourite 7 Dias",p:30},{id:"flou30",n:"Flourite 30 Dias",p:50},{id:"cuban1",n:"Cuban 1 Dia",p:3},{id:"cuban7",n:"Cuban 7 Dias",p:5},{id:"cuban30",n:"Cuban 30 Dias",p:10},{id:"hg1",n:"HG 1 Dia",p:5},{id:"hg10",n:"HG 10 Dias",p:12},{id:"hg30",n:"HG 30 Dias",p:18},{id:"pato30",n:"Pato Team 30 Dias",p:14}];

// --- NUEVO: CARGAR SALDO DE TEMO1 ---
window.cargarSaldo = async () => {
  let id = document.getElementById('userId').value.trim();
  if(!id) return alert("Pon tu ID, ej: temo1");
  let ref = doc(db, "users", id);
  let snap = await getDoc(ref);
  if(!snap.exists()) return alert("Usuario "+id+" no existe. Créalo en Firebase /users");
  usuarioActual = id;
  saldoActual = snap.data().saldo || 0;
  document.getElementById('saldoDisplay').innerText = `ID: ${id} | Saldo: $${saldoActual}`;
  alert(`Bienvenido ${id}, tu saldo es $${saldoActual}`);
};

function renderTienda(){
  let c=document.getElementById('productos'); c.innerHTML='';
  let listaParaMostrar = Object.keys(precios).length>0? Object.entries(precios).map(([id,p])=>[id,p]) : base.map(b=>[b.id,{nombre:b.n,precio:b.p,keys:[]}]);
  listaParaMostrar.forEach(([id,p])=>{ let stock=p.keys?p.keys.length:0; let color=stock>0?'text-green-400':'text-red-400'; let txt=stock>0?`${stock} keys`:'Sin stock'; c.innerHTML+=`<div class="bg-zinc-900 border border-zinc-800 rounded-xl p-3"><b class="text-xs">${p.nombre||p.n}</b><p class="text-green-400 font-black">$${p.precio||p.p} USD</p><p class="${color} text-[10px] font-bold">📦 ${txt}</p><button onclick="add('${id}','${p.nombre||p.n}',${p.precio||p.p})" class="bg-white text-black w-full mt-2 py-1 rounded-full font-bold text-xs">Comprar</button></div>`; });
}
onSnapshot(collection(db,"temo_precios"), snap=>{
  if(snap.empty){ renderTienda(); return; }
  snap.forEach(d=>precios[d.id]=d.data()); renderTienda(); renderAdmin();
}, err=>{ console.log("Error firestore",err); renderTienda(); });

function renderAdmin(){ let h=''; base.forEach(x=>{ let d=precios[x.id]||{precio:x.p,keys:[]}; let stock=d.keys?d.keys.length:0; h+=`<div class="bg-black p-2 rounded-xl"><div class="flex justify-between"><b class="text-xs">${x.n}</b><span class="text-[10px] bg-zinc-800 px-2 rounded-full">${stock} keys</span></div><div class="flex gap-1 mt-1"><input id="price_${x.id}" type="number" value="${d.precio||x.p}" class="w-16 p-1 rounded text-black text-xs"><button onclick="savePrice('${x.id}','${x.n}')" class="bg-white text-black px-2 rounded-full text-xs">OK</button></div><textarea id="keys_${x.id}" placeholder="Pega keys 1 por línea" class="w-full mt-1 p-1 rounded text-black text-xs h-14"></textarea><button onclick="addKeys('${x.id}','${x.n}')" class="bg-green-500 text-black w-full mt-1 py-1 rounded-full font-black text-xs">+ AGREGAR KEYS</button></div>`;}); document.getElementById('lista').innerHTML=h; }

window.add=(id,n,p)=>{cart.push({id,n,p}); document.getElementById('cartCount').innerText=cart.length;};
document.getElementById('cartBtn').onclick=()=>{ if(!cart.length)return alert('vacío'); let h='',t=0; cart.forEach(i=>{h+=`<div class="flex justify-between text-sm"><span>${i.n}</span><b>$${i.p}</b></div>`; t+=i.p;}); document.getElementById('cartItems').innerHTML=h; document.getElementById('cartTotal').innerText='Total: $'+t; document.getElementById('cartModal').classList.remove('hidden'); };

document.getElementById('checkout').onclick=async()=>{
  let t = cart.reduce((a,b)=>a+b.p,0);
  if(usuarioActual && saldoActual < t) return alert(`Saldo insuficiente. Tienes $${saldoActual} y necesitas $${t}`);

  let msg='Hola Temo! 🔥%0AQuiero:%0A';
  for(let item of cart){
    let ref=doc(db,"temo_precios",item.id); let snap=await getDoc(ref); let data=snap.data();
    let key="SIN-STOCK"; if(data&&data.keys&&data.keys.length>0){ key=data.keys[0]; await updateDoc(ref,{keys:data.keys.slice(1)}); }
    msg+=`✅ ${item.n} - KEY: ${key}%0A`;
  }
  // Descontar saldo si está logueado como temo1
  if(usuarioActual){
    let userRef = doc(db,"users",usuarioActual);
    await updateDoc(userRef, {saldo: saldoActual - t});
    saldoActual -= t;
    document.getElementById('saldoDisplay').innerText = `ID: ${usuarioActual} | Saldo: $${saldoActual}`;
  }
  msg+=`%0ATOTAL: $${t} | Cliente: ${usuarioActual||'Invitado'}`;
  cart=[]; document.getElementById('cartCount').innerText=0; document.getElementById('cartModal').classList.add('hidden');
  window.open('https://wa.me/523224528803?text='+msg,'_blank');
};

window.login=async()=>{try{await signInWithEmailAndPassword(auth,email.value,pass.value)}catch(e){alert(e.message)}}; window.logout=()=>signOut(auth);
onAuthStateChanged(auth,u=>{ if(u){ loginDiv.classList.add('hidden'); panel.classList.remove('hidden'); userEmail.innerText=u.email; renderAdmin(); }else{ loginDiv.classList.remove('hidden'); panel.classList.add('hidden'); } });
window.savePrice=async(id,nom)=>{ let v=Number(document.getElementById('price_'+id).value); let ref=doc(db,"temo_precios",id); let snap=await getDoc(ref); let keys=snap.exists()?snap.data().keys||[]:[]; await setDoc(ref,{nombre:nom,precio:v,keys:keys}); alert("Guardado $"+v); };
window.addKeys=async(id,nom)=>{ let txt=document.getElementById('keys_'+id).value.trim(); if(!txt)return; let nuevas=txt.split('\n').map(s=>s.trim()).filter(s=>s); let ref=doc(db,"temo_precios",id); let snap=await getDoc(ref); let data=snap.exists()?snap.data():{nombre:nom,precio:0,keys:[]}; let todas=[...(data.keys||[]),...nuevas]; await setDoc(ref,{nombre:nom,precio:data.precio||0,keys:todas}); document.getElementById('keys_'+id).value=''; alert(nuevas.length+' agregadas. Total: '+todas.length); };
window.seed=async()=>{ for(let b of base){ let ref=doc(db,"temo_precios",b.id); let snap=await getDoc(ref); if(!snap.exists()){ await setDoc(ref,{nombre:b.n,precio:b.p,keys:[]}); } } alert("Productos restaurados! Recarga la página"); };
renderTienda();
</script></body></html>
<div class="bg-black p-2 flex gap-2">
  <input id="newUserId" placeholder="Crea tu ID nuevo" class="flex-1 p-2 rounded-full text-black text-xs font-bold px-3">
  <button onclick="registrar()" class="bg-white text-black px-4 py-2 rounded-full font-black text-[10px]">REGISTRARSE +$20</button>
</div>
<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Temo Store</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-black text-white">
<header class="bg-red-600 p-3 flex justify-between sticky top-0 z-50"><b>TEMO STORE 🔥</b><div class="flex gap-2 items-center"><span id="saldoDisplay" class="bg-black px-3 py-1 rounded-full text-[10px] font-black border border-white/20">💰 $0</span><button onclick="document.getElementById('adminPanel').classList.toggle('hidden')" class="bg-black px-3 py-1 rounded-full text-xs">⚙️ Admin</button><button id="cartBtn" class="bg-white text-black px-3 py-1 rounded-full font-black">🛒 <span id="cartCount">0</span></button></div></header>
<div class="bg-yellow-400 text-black text-center p-1 font-black text-[10px]">PAGO INMEDIATO | ENTREGA AUTOMATICA</div>

<div class="bg-zinc-900 p-2 flex flex-col gap-2">
  <div class="flex gap-2">
    <input id="userId" placeholder="Ya
