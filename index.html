<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TEMO STORE OFICIAL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#000;color:#fff;padding-bottom:20px}
.top{background:red;padding:12px;display:flex;justify-content:space-between;font-weight:bold;position:sticky;top:0;z-index:10}
.banner{margin:12px;border:2px solid red;border-radius:12px;padding:12px;background:#140000;text-align:center}
.box{margin:12px;background:#111;border:1px solid #333;border-radius:12px;padding:12px;text-align:center}
.box input{width:100%;padding:12px;background:#000;color:#fff;border:1px solid #333;border-radius:8px;text-align:center;font-weight:bold}
.prod{margin:10px 12px;background:#111;border:1px solid #333;border-radius:10px;padding:12px;display:flex;justify-content:space-between;align-items:center}
.btn{background:red;color:#fff;border:none;padding:8px 14px;border-radius:20px;font-weight:bold}
#admin{position:fixed;inset:0;background:#000;z-index:9999;display:none;overflow:auto;padding:15px}
</style>
</head>
<body>
<div class="top"><span>🔥 TEMO STORE</span><span>💰 $<span id="sTop">0</span></span></div>
<div class="banner"><h3 style="color:red">BIENVENIDO A TEMO STORE 🔥</h3><small style="color:#888">ID único - entrega auto</small></div>
<div class="box">
<input id="idIn" readonly>
<div style="margin-top:8px">ID: <b id="idTxt"></b> | Saldo: $<b id="sTxt" style="color:yellow">0</b></div>
<div style="display:flex;gap:6px;margin-top:8px"><button onclick="navigator.clipboard.writeText(ID);alert('Copiado '+ID)" style="flex:1;padding:10px;background:#222;border:1px solid #444;border-radius:8px;color:#fff">📋 Copiar ID</button><button onclick="crearID()" style="flex:1;padding:10px;background:#ff0;border:none;border-radius:8px;color:#000;font-weight:bold">🎲 Nuevo ID</button></div>
</div>
<div id="lista"></div>

<div id="admin">
<div id="aLogin" style="max-width:360px;margin:60px auto;background:#111;border:2px solid #0f0;border-radius:12px;padding:20px;text-align:center">
<h2 style="color:#0f0">ADMIN TEMO</h2>
<input id="aUser" placeholder="Usuario" style="width:100%;padding:12px;margin:6px 0;background:#000;border:1px solid #333;color:#fff;border-radius:6px">
<input id="aPass" type="password" placeholder="Contraseña" style="width:100%;padding:12px;margin:6px 0;background:#000;border:1px solid #333;color:#fff;border-radius:6px">
<button onclick="loginA()" style="width:100%;padding:12px;background:#0f0;border:none;border-radius:8px;font-weight:bold">ENTRAR</button>
<p id="aErr" style="color:red;display:none;margin-top:8px">Datos mal</p>
<button onclick="document.getElementById('admin').style.display='none';history.replaceState(null,'','/')" style="margin-top:10px;width:100%;padding:8px;background:#333;border:none;border-radius:6px;color:#fff">Cerrar</button>
</div>
<div id="aContent" style="display:none;max-width:600px;margin:0 auto">
<h2 style="color:#0f0;text-align:center;margin-bottom:10px">PANEL ADMIN</h2>
<button onclick="restaurarTodo()" style="width:100%;padding:12px;background:#0f0;color:#000;border:none;border-radius:8px;font-weight:900;margin-bottom:10px">✅ RESTAURAR PRODUCTOS ORIGINALES</button>

<div style="background:#111;border:1px solid #ff0;border-radius:10px;padding:10px;margin-bottom:12px">
<b style="color:#ff0">✏️ CREAR / EDITAR PRODUCTO</b>
<input id="newId" placeholder="id ej: vlt (sin espacios)" style="width:100%;padding:8px;margin:5px 0;background:#000;border:1px solid #333;color:#fff;border-radius:6px">
<input id="newNombre" placeholder="Nombre ej: VLT MODS" style="width:100%;padding:8px;margin:5px 0;background:#000;border:1px solid #333;color:#fff;border-radius:6px">
<div style="display:flex;gap:5px"><input id="newDias" type="number" placeholder="Días ej:30" style="flex:1;padding:8px;background:#000;border:1px solid #333;color:#fff;border-radius:6px"><input id="newPrecio" type="number" placeholder="$ ej:20" style="flex:1;padding:8px;background:#000;border:1px solid #333;color:#fff;border-radius:6px"></div>
<button onclick="crearNuevoProd()" style="width:100%;margin-top:6px;padding:10px;background:#ff0;border:none;border-radius:8px;font-weight:bold;color:#000">GUARDAR / CREAR</button>
<small style="color:#888">Si el ID existe, cambia nombre/precio. Si no existe, lo crea.</small>
</div>

<div style="background:#111;border:1px solid #0af;border-radius:10px;padding:10px;margin-bottom:12px">
<b style="color:#0af">💳 RECARGA SALDO</b>
<div style="display:flex;gap:5px;margin-top:6px"><input id="rID" placeholder="ID TEMO-XXXX" style="flex:1;padding:8px;background:#000;border:1px solid #333;color:#fff;border-radius:6px"><input id="rM" type="number" placeholder="$" style="width:70px;padding:8px;background:#000;border:1px solid #333;color:#fff;border-radius:6px"><button onclick="recargar()" style="padding:8px 14px;background:#0af;border:none;border-radius:6px;font-weight:bold;color:#fff">+</button></div>
</div>

<div id="aList"></div>
</div>
</div>
