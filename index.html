<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TemoMods - Mods Premium</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050507;color:#fff;font-family:'Inter',sans-serif}
.bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 50% 0%, #3a0a0a 0%, #0a0a0a 60%, #000 100%)}
.neon-text{font-family:'Orbitron';color:#ff1a1a;text-shadow:0 0 10px #ff0000,0 0 20px #ff0000,0 0 40px #ff0000;letter-spacing:4px}
.header{padding:20px 40px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,0,0,0.3);background:rgba(0,0,0,0.8)}
.logo{font-family:'Orbitron';font-weight:900;color:#ff3333;font-size:28px;text-shadow:0 0 10px red}
.hero{text-align:center;padding:80px 20px 40px}
.hero h1{font-size:60px;font-weight:900}
.pricing{display:flex;gap:30px;justify-content:center;flex-wrap:wrap;padding:50px 20px;max-width:1200px;margin:0 auto}
.card{flex:1;min-width:280px;max-width:350px;background:rgba(15,15,15,0.9);border:1px solid #ff0000;border-radius:16px;padding:30px;position:relative;box-shadow:0 0 20px rgba(255,0,0,0.4)}
.card.popular{border-width:2px;transform:scale(1.05)}
.badge{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:#ff0000;color:#000;padding:4px 15px;border-radius:20px;font-weight:700;font-size:12px}
.price{font-size:52px;font-weight:900;color:#ff9999;margin:15px 0;text-shadow:0 0 10px red}
.btn{display:block;width:100%;padding:16px;background:linear-gradient(90deg,#ff0000,#aa0000);color:#000;font-weight:900;border:none;border-radius:10px;text-align:center;text-decoration:none;box-shadow:0 0 20px red;font-family:'Orbitron'}
</style>
</head>
<body>
<div class="bg"></div>
<div class="header"><div class="logo">TemoMods</div><div style="color:#ff6666">temomods.is-a.dev</div></div>
<div class="hero">
<h1 class="neon-text">TEMOMODS</h1>
<p>MODS PREMIUM • ANTIDETEC • RAPIDO • SEGURO</p>
</div>
<div class="pricing">
<div class="card"><h3>1 MES</h3><div class="price">$9.99</div><a class="btn" href="https://wa.me/523224528803?text=Hola%20quiero%20TemoMods%201%20MES">COMPRAR AHORA</a></div>
<div class="card popular"><div class="badge">MAS POPULAR</div><h3>3 MESES</h3><div class="price">$24.99</div><a class="btn" href="https://wa.me/523224528803?text=Hola%20quiero%20TemoMods%203%20MESES">COMPRAR AHORA</a></div>
<div class="card"><h3>PERMANENTE</h3><div class="price">$59.99</div><a class="btn" href="https://wa.me/523224528803?text=Hola%20quiero%20TemoMods%20PERMANENTE">COMPRAR AHORA</a></div>
</div>
</body>
</html>
