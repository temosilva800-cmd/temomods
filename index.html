<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>TEMO</title><style>body{background:#111;color:#fff;font-family:Arial;padding:10px}.h{background:#000;padding:15px;text-align:center;font-weight:900;border-bottom:3px solid red}.box{max-width:400px;margin:15px auto;background:#222;padding:15px;border-radius:12px;border:2px solid #0f0}input{width:100%;padding:12px;margin:6px 0;background:#000;color:#fff;border:1px solid #555;border-radius:8px}button{width:100%;padding:12px;margin:6px 0;border:none;border-radius:8px;font-weight:900}#adm{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#000;z-index:9999;padding:15px;overflow:auto}</style></head><body>
<div id=adm><h2 style="color:red;text-align:center">ADMIN</h2><div class=box><input id=nu placeholder="usuario"><input id=np placeholder="pass"><input id=nm type=number placeholder="saldo"><button onclick="CU()" style="background:#0f0">CREAR</button><input id=au placeholder="usuario existente" style="margin-top:15px"><input id=am type=number placeholder="monto"><button onclick="DS()" style="background:#0f0">DAR SALDO</button><div id=lista style="font-size:11px;margin-top:10px;background:#111;padding:8px"></div><button onclick="document.getElementById('adm').style.display='none'" style="background:#333;color:#fff">CERRAR</button></div></div>
<div class=h onclick="T()"><span style="color:red">TEMO</span> STORE - toca 5 veces</div>
<div class=box id=lb><h3 style="color:#0f0;text-align:center">LOGIN</h3><input id=u placeholder="Usuario"><input id=p type=password placeholder="Pass"><button onclick="LG()" style="background:#0f0">ENTRAR</button><div style="text-align:center;color:#888;margin:8px 0">-- O --</div><input id=ru placeholder="Nuevo usuario"><input id=rp placeholder="Nuevo pass"><button onclick="RG()" style="background:#fa0">CREAR CUENTA $0</button><div id=msg style="color:#0f0;text-align:center;margin-top:8px"></div></div>
<div class=box id=tb style="display:none"><div id=info></div><button onclick="LS()" style="background:#333;color:#fff">SALIR</button></div>
<script>
var c=0;function T(){c++;if(c>=5){document.getElementById('adm').style.display='block';c=0;alert('ADMIN');LU();}setTimeout(function(){c=0},3000);}
function GU(){try{var d=localStorage.getItem('U');return d?JSON.parse(d):{}}catch(e){alert('Error memoria: '+e);return{}}}function SU(o){localStorage.setItem('U',JSON.stringify(o));}
function CU(){var u=document.getElementById('nu').value.toLowerCase().trim();var p=document.getElementById('np').value.trim();var m=parseFloat(document.getElementById('nm').value)||0;if(!u||!p){alert('Falta usuario');return;}var a=GU();a[u]={p:p,s:m};SU(a);alert('OK '+u+' $'+m);LU();}
function DS(){var u=document.getElementById('au').value.toLowerCase().trim();var m=parseFloat(document.getElementById('am').value);var a=GU();if(!a[u]){alert('No existe');return;}a[u].s+=m;SU(a);alert(u+' ahora $'+a[u].s);LU();}
function LU(){var a=GU();var h='';for(var k in a)h+=k+' | '+a[k].p+' | $'+a[k].s+'<br>';document.getElementById('lista').innerHTML=h||'vacio';}
function RG(){var u=document.getElementById('ru').value.toLowerCase().trim();var p=document.getElementById('rp').value.trim();alert('Intentando crear '+u);if(!u||!p){alert('Falta');return;}var a=GU();if(a[u]){alert('Ya existe');return;}a[u]={p:p,s:0};SU(a);document.getElementById('msg').innerHTML='Creado '+u+'! Entra arriba';document.getElementById('u').value=u;alert('Cuenta '+u+' creada OK');LU();}
function LG(){var u=document.getElementById('u').value.toLowerCase().trim();var p=document.getElementById('p').value.trim();var a=GU();if(!a[u]){alert('No existe '+u);return;}if(a[u].p!=p){alert('Pass mal');return;}localStorage.setItem('S',u);alert('Bienvenido '+u);ST();}
function ST(){var s=localStorage.getItem('S');if(!s)return;var a=GU();document.getElementById('lb').style.display='none';document.getElementById('tb').style.display='block';document.getElementById('info').innerHTML='Usuario: '+s+' Saldo: $'+a[s].s;}
function LS(){localStorage.removeItem('S');document.getElementById('lb').style.display='block';document.getElementById('tb').style.display='none';}
LU();var s=localStorage.getItem('S');if(s)ST();
</script></body></html>
