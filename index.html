<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TEMO STORE</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-black text-white">
<header class="bg-red-600 p-3 flex justify-between sticky top-0"><b>TEMO STORE 🔥</b><div class="flex gap-2"><span id="saldoDisplay" class="bg-black px-2 py-1 rounded-full text-[10px]">💰 $0</span><button id="btnAdmin" class="bg-black px-2 py-1 rounded-full">⚙️</button></div></header>
<main id="productos" class="max-w-md mx-auto p-3 grid gap-3"></main>
<div id="adminPanel" class="max-w-md mx-auto bg-zinc-900 p-3 border-t border-zinc-700 mt-4">
<div id="loginDiv"><input id="pass" type="password" placeholder="temo123" class="w-full p-2 rounded text-black"><button id="btnLogin" class="bg-white text-black w-full p-2 rounded-full font-black mt-2">ENTRAR ADMIN</button></div>
<div id="panel" class="hidden">
<b>ADMIN - DONDE AGREGAR KEYS</b>
<button onclick="restaurarTodo()" class="bg-green-500 w-full py-2 rounded-full font-black text-xs mt-2">✅ RESTAURAR SI NO VES NADA</button>
<div id="lista" class="grid gap-3 mt-3"></div>
<button onclick="adminPanel.classList.add('hidden')" class="w-full mt-3 bg-zinc-700 py-2 rounded-full text-xs">CERRAR</button>
</div></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import {getFirestore,collection,doc,setDoc,getDoc,onSnapshot,deleteDoc} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyDFsZ812v6bExs5VkjOA5T3YIBoW_0zGeU",authDomain:"temo-store-5b025.firebaseapp.com",projectId:"temo-store-5b025",storageBucket:"temo-store-5b025.firebasestorage.app",messagingSenderId:"18400776607",appId:"1:18400776607:web:79cc6e9e716afcd41c6daa"};
let app=initializeApp(firebaseConfig),db=getFirestore(app);
let precios={};
const BASE={drip:{nombre:"DRIP",opciones:[{dias:1,precio:4,keys:[]},{dias:7,precio:12,keys:[]},{dias:15,precio:15,keys:[]},{dias:30,precio:20,keys:[]}]},cuban:{nombre:"CUBAN",opciones:[{dias:1,precio:3,keys:[]},{dias:7,precio:5,keys:[]},{dias:30,precio:10,keys:[]}]},hg:{nombre:"HG",opciones:[{dias:1,precio:5,keys:[]},{dias:10,precio:12,keys:[]},{dias:30,precio:18,keys:[]}]},vlt:{nombre:"VLT",opciones:[{dias:1,precio:5,keys:[]},{dias:7,precio:12,keys:[]},{dias:30,precio:25,keys:[]}]},pato:{nombre:"PATO",opciones:[{dias:30,precio:14,keys:[]}]},flourite:{nombre:"FLOURITE",opciones:[{dias:7,precio:30,keys:[]},{dias:30,precio:50,keys:[]}]}};

function renderTienda(){
  let c=document.getElementById('productos'); c.innerHTML='';
  let data = Object.keys(precios).length>0? precios : BASE;
  Object.entries(data).forEach(([id,prod])=>{
    let ops=(prod.opciones||[]).sort((a,b)=>a.dias-b.dias);
    let htmlOps=''; ops.forEach(op=>{ htmlOps+=`<div class="flex justify-between bg-zinc-800 rounded-full px-3 py-1 mt-1 text-[11px]"><span>${op.dias}D - ${op.keys?.length||0} keys</span><span class="text-green-400 font-black">$${op.precio}</span></div>`; });
    c.innerHTML+=`<div class="bg-zinc-900 border border-red-600 rounded-xl p-3"><b>${prod.nombre}</b>${htmlOps}</div>`;
  });
}
onSnapshot(collection(db,"temo_precios"),snap=>{ precios={}; snap.forEach(d=>{ if(d.data().opciones) precios[d.id]=d.data(); }); renderTienda(); renderAdmin(); });
function renderAdmin(){
  let h='';
  Object.entries(precios).forEach(([id,prod])=>{
    let opsHtml='';
    (prod.opciones||[]).forEach((op,idx)=>{
      opsHtml+=`
      <div class="bg-zinc-800 rounded-xl p-2 mt-2 border border-zinc-700">
        <div class="flex justify-between"><b class="text-[11px] text-yellow-400">📦 ${op.dias} DÍAS - $${op.precio}</b><span class="text-[9px] bg-black px-2 rounded-full">${op.keys?.length||0} keys guardadas</span></div>
        <textarea id="keys_${id}_${idx}" class="w-full p-2 rounded text-black text-[10px] mt-1 h-16" placeholder="Pega aquí tus keys, una por linea&#10;EJ:&#10;DRIP-123&#10;DRIP-456"></textarea>
        <button onclick="addKeys('${id}',${idx})" class="bg-green-500 w-full py-2 rounded-full font-black text-[10px] mt-1">💾 GUARDAR KEYS PARA ${op.dias}D</button>
        <div class="text-[8px] text-zinc-400 mt-1 break-all">${(op.keys||[]).slice(0,3).join(', ')}</div>
      </div>`;
    });
    h+=`<div class="bg-black p-3 rounded-xl border border-zinc-800"><b class="text-sm">${prod.nombre.toUpperCase()} (${id})</b>${opsHtml}</div>`;
  });
  document.getElementById('lista').innerHTML=h;
}
window.addKeys=async(id,idx)=>{
  let txt=document.getElementById('keys_'+id+'_'+idx).value.trim(); if(!txt) return alert("Pega keys");
  let ref=doc(db,"temo_precios",id); let s=await getDoc(ref); let prod=s.data();
  let nuevas=txt.split('\n').map(k=>k.trim()).filter(k=>k);
  prod.opciones[idx].keys=[...(prod.opciones[idx].keys||[]),...nuevas];
  await setDoc(ref,prod);
  document.getElementById('keys_'+id+'_'+idx).value=''; alert("✅ "+nuevas.length+" keys guardadas para "+prod.opciones[idx].dias+" días");
}
window.restaurarTodo=async()=>{ for(let id in BASE){ await setDoc(doc(db,"temo_precios",id), BASE[id]); } alert("Restaurado"); }
document.getElementById('btnAdmin').onclick=()=>document.getElementById('adminPanel').classList.toggle('hidden');
document.getElementById('btnLogin').onclick=()=>{ if(document.getElementById('pass').value==='temo123'){document.getElementById('loginDiv').classList.add('hidden');document.getElementById('panel').classList.remove('hidden');renderAdmin();}else alert("mal"); }
renderTienda();
if(window.location.href.includes('admin')) document.getElementById('adminPanel').classList.remove('hidden');
</script></body></html>
