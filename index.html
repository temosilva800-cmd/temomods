lex:1;padding:12px;background:red;color:#fff;border:none;border-radius:8px;font-weight:900">🗑️ BORRAR KEYS</button></div><div class="cardA"><h3 style="color:yellow">💰 RECARGA DIRECTA</h3><input id="recId" placeholder="TEMO-XXXX" class="in"><input id="recMonto" type="number" placeholder="Monto" class="in"><button onclick="addSaldo()" style="width:100%;padding:10px;background:#0f0;color:#000;border:none;border-radius:6px;font-weight:900;margin-top:6px">+ AGREGAR</button></div><div id="aList"></div><button onclick="location.href=location.pathname" style="width:100%;padding:12px;background:#222;border:1px solid #444;color:#fff;border-radius:8px;margin:20px 0">← SALIR</button></div></div>
<script>
function genID(){return 'TEMO-'+Math.random().toString(36).substring(2,8).toUpperCase()}
var ID = localStorage.getItem('temo_myID')||'';
ID = (ID+'').trim().toUpperCase();
if(!ID || ID==='|' || ID.indexOf('|')!==-1 || ID.length<6 || ID.indexOf('TEMO-')!==0){
  ID = genID();
  localStorage.setItem('temo_myID', ID);
}
function copyID(){navigator.clipboard.writeText(ID);alert(ID)}
const BASE=[{n:'DRIP CLIENT',i:'💧',id:'drip',ps:[{id:'drip-1d',d:'1 DIA',p:4},{id:'drip-7d',d:'7 DIAS',p:12},{id:'drip-15d',d:'15 DIAS',p:15},{id:'drip-30d',d:'30 DIAS',p:20}]},{n:'FLOURITE',i:'💎',id:'flou',ps:[{id:'flou-7d',d:'7 DIAS',p:30},{id:'flou-30d',d:'30 DIAS',p:50}]},{n:'CUBAN MODS',i:'🇨🇺',id:'cuban',ps:[{id:'cuban-1d',d:'1 DIA',p:3},{id:'cuban-7d',d:'7 DIAS',p:5},{id:'cuban-30d',d:'30 DIAS',p:10}]},{n:'HG CHEATS',i:'⚡',id:'hg',ps:[{id:'hg-1d',d:'1 DIA',p:5},{id:'hg-10d',d:'10 DIAS',p:12},{id:'hg-30d',d:'30 DIAS',p:18}]},{n:'PATO TEAM',i:'🦆',id:'pato',ps:[{id:'pato-30d',d:'30 DIAS',p:14}]},{n:'CAKE',i:'🎂',id:'cake',ps:[{id:'cake-1d',d:'1 DIA',p:4},{id:'cake-7d',d:'7 DIAS',p:10},{id:'cake-15d',d:'15 DIAS',p:16},{id:'cake-30d',d:'30 DIAS',p:22}]},{n:'ANDROID PROXY',i:'📦',id:'proxy',ps:[{id:'proxy-30d',d:'30 DIAS',p:8}]}];
function getProds(){try{var c=localStorage.getItem('temo_prods');if(!c)return BASE;var p=JSON.parse(c);if(!p||!p.length)return BASE;return p}catch(e){return BASE}}function setProds(p){localStorage.setItem('temo_prods',JSON.stringify(p))}
function getKeys(){try{return JSON.parse(localStorage.getItem('temo_keys')||'{}')||{}}catch(e){return{}}}function setKeys(k){localStorage.setItem('temo_keys',JSON.stringify(k))}
function getUsers(){try{return JSON.parse(localStorage.getItem('temo_users')||'{}')||{}}catch(e){return{}}}function setUsers(u){localStorage.setItem('temo_users',JSON.stringify(u))}
function getHist(){try{return JSON.parse(localStorage.getItem('temo_hist')||'{}')||{}}catch(e){return{}}}function setHist(h){localStorage.setItem('temo_hist',JSON.stringify(h))}
function getUsed(){try{return JSON.parse(localStorage.getItem('temo_used')||'[]')}catch(e){return[]}}function setUsed(u){localStorage.setItem('temo_used',JSON.stringify(u))}
function getWA(){return localStorage.getItem('temo_wa')||'523224528803'}function setWA(n){localStorage.setItem('temo_wa',n)}
var users=getUsers();if(!users[ID]){users[ID]={saldo:0};setUsers(users)}
document.getElementById('idIn').value=ID;document.getElementById('idTxt').innerText=ID;document.getElementById('sTop').innerText=users[ID].saldo;document.getElementById('sTxt').innerText=users[ID].saldo;
function render(){try{var prods=getProds();var keys=getKeys();var c=document.getElementById('lista');c.innerHTML='';for(var i=0;i<prods.length;i++){var p=prods[i];var stock=0;for(var j=0;j<p.ps.length;j++){var pl=p.ps[j];stock+=(keys[pl.id]?keys[pl.id].length:0)}c.innerHTML+='<div class=prod><div><b>'+p.i+' '+p.n+'</b><br><small style=color:#888>'+p.ps.length+' planes - '+stock+' keys</small></div><button class=btn onclick=ver(\''+p.id+'\')>VER</button></div>'}}catch(e){document.getElementById('lista').innerHTML='<p style=color:red;padding:20px>Error render: '+e+'</p>'}}render();
var lastKey="",lastProd="",lastPlan="",lastCode="";
function genCode(){var monto=parseInt(document.getElementById('genMonto').value);if(!monto||monto<=0)return alert('Pon monto');var rand=Math.random().toString(36).substring(2,6).toUpperCase();var check=btoa(monto+"|TEMO2007").substring(0,4).toUpperCase().replace(/[^A-Z0-9]/g,'X');var code='TEMO-'+monto+'-'+rand+'-'+check;lastCode=code;document.getElementById('codeTxt').innerText=code;document.getElementById('codeMonto').innerText='$'+monto+' MXN';document.getElementById('codeModal').style.display='flex';document.getElementById('waCodeBtn').onclick=function(){window.open('https://wa.me/?text='+encodeURIComponent('🎟️ Tu código TEMO STORE: '+code+' - $'+monto), '_blank')};var lc=JSON.parse(localStorage.getItem('temo_gen_codes')||'[]');lc.unshift({code:code,monto:monto,date:new Date().toLocaleString()});localStorage.setItem('temo_gen_codes',JSON.stringify(lc.slice(0,20)));renderLastCodes();}
function copyCode(){navigator.clipboard.writeText(lastCode);alert(lastCode)}
function renderLastCodes(){var lc=JSON.parse(localStorage.getItem('temo_gen_codes')||'[]');document.getElementById('lastCodes').innerHTML=lc.map(function(c){return '<div style=background:#000;padding:6px;margin:4px 0;border-radius:6px;display:flex;justify-content:space-between><span style=color:#ff0>'+c.code+'</span><span style=color:#0f0>$'+c.monto+'</span></div>'}).join('')}
function redeemCode(){var input=document.getElementById('codeIn').value.trim().toUpperCase();if(!input)return alert('Pega código');var parts=input.split('-');if(parts.length!==4||parts[0]!=='TEMO'){alert('Código inválido');return}var monto=parseInt(parts[1]);if(isNaN(monto)){alert('Inválido');return}var check=btoa(monto+"|TEMO2007").substring(0,4).toUpperCase().replace(/[^A-Z0-9]/g,'X');if(parts[3]!==check){alert('Código falso');return}var used=getUsed();if(used.indexOf(input)!==-1){alert('Ya usado');return}var u=getUsers();if(!u[ID])u[ID]={saldo:0};u[ID].saldo+=monto;setUsers(u);used.push(input);setUsed(used);document.getElementById('sTop').innerText=u[ID].saldo;document.getElementById('sTxt').innerText=u[ID].saldo;document.getElementById('codeIn').value='';alert('✅ +$'+monto+' Saldo: $'+u[ID].saldo)}
function openHist(){var h=getHist()[ID]||[];document.getElementById('histList').innerHTML=h.length?h.slice().reverse().map(function(x){return '<div style=background:#000;padding:8px;margin:6px 0;border-radius:6px><b style=color:#0f0>'+x.prod+'-'+x.plan+'</b><br><small>'+x.date+'</small><br><span style=color:#0f0>'+x.key+'</span></div>'}).join(''):'<p style=color:#888>Sin compras</p>';document.getElementById('histModal').style.display='flex'}
function resetWA(){window.open('https://wa.me/'+getWA()+'?text='+encodeURIComponent('RESET ID:'+ID+' '+lastProd+' '+lastPlan+' '+lastKey),'_blank')}
function ver(pid){var keys=getKeys();var us=getUsers();var p=getProds().find(function(x){return x.id===pid});var txt=p.n+"\n";for(var i=0;i<p.ps.length;i++){var pl=p.ps[i];txt+=pl.d+" $"+pl.p+" ("+(keys[pl.id]?keys[pl.id].length:0)+")\n"}var ans=prompt(txt+"\nSaldo $"+us[ID].saldo+"\nEscribe plan");if(!ans)return;var plan=null;for(var i=0;i<p.ps.length;i++){if(p.ps[i].d.toLowerCase()===ans.trim().toLowerCase()){plan=p.ps[i]}}if(!plan)return alert('Plan mal');if((keys[plan.id]?keys[plan.id].length:0)<=0)return alert('Sin stock');if(us[ID].saldo<plan.p)return alert('Saldo insuficiente');var k=keys[plan.id].shift();setKeys(keys);us[ID].saldo-=plan.p;setUsers(us);var hist=getHist();if(!hist[ID])hist[ID]=[];hist[ID].push({date:new Date().toLocaleString(),prod:p.n,plan:plan.d,key:k});setHist(hist);render();lastKey=k;lastProd=p.n;lastPlan=plan.d;document.getElementById('modalProd').innerText=p.n+" - "+plan.d;document.getElementById('modalKey').innerText=k;document.getElementById('keyModal').style.display='flex';document.getElementById('sTop').innerText=us[ID].saldo;document.getElementById('sTxt').innerText=us[ID].saldo;}
if(location.search.toLowerCase().indexOf('admin')!==-1)document.getElementById('admin').style.display='block';
function loginA(){var u=document.getElementById('aUser').value.trim();var p=document.getElementById('aPass').value.trim();if(u==='Temo2007'&&p==='Temo2007'){document.getElementById('aLogin').style.display='none';document.getElementById('aContent').style.display='block';document.getElementById('waNum').value=getWA();document.getElementById('waActual').innerText='Actual: '+getWA();renderAdmin();renderLastCodes()}}
function saveWA(){var n=document.getElementById('waNum').value.replace(/[^0-9]/g,'');setWA(n);document.getElementById('waActual').innerText=n;alert(n)}
function renderAdmin(){var prods=getProds();var keys=getKeys();var c=document.getElementById('aList');c.innerHTML='';for(var pi=0;pi<prods.length;pi++){var p=prods[pi];var html='<div class=cardA><div style=display:flex;gap:6px><input id=icon-'+p.id+' value=\''+p.i+'\' class=in style=width:60px><input id=name-'+p.id+' value=\''+p.n+'\' class=in><button onclick=saveProdName(\''+p.id+'\') style=background:#ff0;border:none;padding:7px 12px;border-radius:6px;font-weight:900>💾</button><button onclick=deleteProduct(\''+p.id+'\') style=background:red;color:#fff;border:none;padding:7px 10px;border-radius:6px>🗑️</button></div>';for(var j=0;j<p.ps.length;j++){var pl=p.ps[j];var cnt=keys[pl.id]?keys[pl.id].length:0;var st=keys[pl.id]?keys[pl.id].join('\n'):'';html+='<div style=background:#000;padding:10px;margin:8px 0;border-radius:8px><div class=row><input id=d-'+pl.id+' value=\''+pl.d+'\' class=in><input id=p-'+pl.id+' type=number value=\''+pl.p+'\' class=in><button onclick=deletePlan(\''+p.id+'\',\''+pl.id+'\') style=background:#300;color:#f55;border:1px solid #f55;border-radius:6px;padding:7px>X</button></div><div class=row style=margin-top:4px><button style=flex:1;background:#222;border:1px solid #555;color:#fff;padding:7px 12px;border-radius:6px;font-weight:900 onclick=savePlan(\''+p.id+'\',\''+pl.id+'\')>✏️ EDITAR</button><span style=color:#0f0;padding:7px;font-size:
