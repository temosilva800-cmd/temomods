<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TEMO V12.3 ENTREGA</title>
<script>try{let id=localStorage.getItem('temo_myID')||'';if(!id||id=='|'||id.includes('|')||id.length<6||!id.toUpperCase().startsWith('TEMO-')){localStorage.setItem('temo_myID','TEMO-'+Math.random().toString(36).substr(2,6).toUpperCase())}}catch(e){localStorage.clear();localStorage.setItem('temo_myID','TEMO-'+Math.random().toString(36).substr(2,6).toUpperCase())}</script>
<style>body{background:#000;color:#fff;font-family:Arial;margin:0;padding-bottom:90px}.top{background:red;padding:14px;font-weight:900;display:flex;justify-content:space-between;position:sticky;top:0;z-index:99}.banner{margin:12px;border:2px solid red;border-radius:14px;padding:14px;text-align:center;background:#140000}.box{margin:12px;background:#111;border:1px solid #333;border-radius:14px;padding:14px;text-align:center}.box input{width:100%;padding:12px;background:#000;color:#0f0;border:2px solid #0f0;border-radius:8px;text-align:center;font-weight:900}.prod{margin:10px 12px;background:#111;border:1px solid #333;border-radius:12px;padding:14px;display:flex;justify-content:space-between;align-items:center}.btn{background:red;color:#fff;border:none;padding:10px 18px;border-radius:20px;font-weight:900}.btn2{background:#0f0;color:#000;border:none;padding:10px;border-radius:8px;font-weight:900;width:100%;margin-top:8px}.in{width:100%;padding:9px;background:#000;border:1px solid #444;color:#fff;border-radius:6px;margin:4px 0}.row{display:flex;gap:6px}#admin{position:fixed;inset:0;background:#000;z-index:9999;display:none;overflow:auto;padding:12px}.cardA{background:#151515;border:1px solid #333;border-radius:12px;padding:12px;margin:12px 0}.cardA textarea{width:100%;min-height:90px;background:#000;color:#0f0;border:1px solid #333;border-radius:8px;padding:8px;margin-top:6px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:99999;display:none;align-items:center;justify-content:center;padding:16px}.modalBox{background:#111;border:2px solid #0f0;border-radius:16px;padding:18px;max-width:420px;width:100%;text-align:center}.keyBox{background:#000;border:1px solid #333;border-radius:8px;padding:12px;color:#0f0;font-weight:900;word-break:break-all;margin:12px 0}.sBtn{padding:6px 10px;border:none;border-radius:6px;font-weight:900;margin:2px;font-size:12px}</style>
</head><body>
<div class="top"><span>🔥 TEMO V12.3 ENTREGA AUTO</span><span id="sTop">$0</span></div>
<div class="banner">✅ TIENDA SURTIDA - YA ENTREGA KEYS SOLA<br><small>Demo: 3 keys por plan - Cámbialas por las tuyas en?admin</small><br><button onclick="localStorage.clear();localStorage.setItem('temo_myID','TEMO-'+Math.random().toString(36).substr(2,6).toUpperCase());location.reload()" style="margin-top:8px;padding:8px 14px;background:#0f0;color:#000;border:none;border-radius:8px;font-weight:900">🔧 REINICIAR</button></div>
<div class="box"><input id="idIn" readonly><div>ID: <b id="idTxt" style="color:#0f0"></b> | Saldo: $<b id="sTxt" style="color:yellow">0</b></div><div class="row" style="margin-top:10px"><button onclick="copyID()" style="flex:1;padding:11px;background:#111;border:2px solid #0f0;border-radius:10px;color:#fff;font-weight:900">📋 ID</button><button onclick="openHist()" style="flex:1;padding:11px;background:#222;border:1px solid #555;border-radius:10px;color:#fff;font-weight:900">📜 HIST</button></div></div>
<div id="lista"></div>
<div id="keyModal" class="modal"><div class="modalBox"><h3 style="color:#0f0">✅ COMPRA EXITOSA - KEY ENTREGADA</h3><p id="modalProd"></p><div id="modalKey" class="keyBox"></div><button onclick="copyKey()" style="width:100%;padding:14px;background:#0f0;color:#000;border:none;border-radius:10px;font-weight:900">📋 COPIAR KEY</button><button id="waKeyBtn" style="width:100%;padding:12px;background:#25D366;color:#fff;border:none;border-radius:8px;font-weight:900;margin-top:8px">📱 ENVIAR POR WHATSAPP</button><button onclick="document.getElementById('keyModal').style.display='none'" style="width:100%;padding:10px;background:#222;color:#fff;border-radius:8px;margin-top:8px">Cerrar</button></div></div>
<div id="histModal" class="modal"><div class="modalBox"><h3>HISTORIAL</h3><div id="histList"></div><button onclick="document.getElementById('histModal').style.display='none'" style="width:100%;padding:10px;background:#222;color:#fff;border-radius:8px;margin-top:10px">Cerrar</button></div></div>
<div id="admin"><div id="aLogin" style="max-width:360px;margin:80px auto;background:#111;border:2px solid #0f0;border-radius:14px;padding:20px;text-align:center"><h2 style="color:#0f0">ADMIN</h2><input id="aUser" placeholder="Temo2007" class="in"><input id="aPass" type="password" placeholder="Temo2007" class="in"><button onclick="doLogin()" style="width:100%;padding:12px;background:#0f0;border:none;border-radius:8px;font-weight:900;margin-top:8px">ENTRAR</button></div>
<div id="aContent" style="display:none;max-width:800px;margin:0 auto">
<h2 style="color:#0f0;text-align:center">ADMIN ENTREGA AUTO</h2>
<div class="cardA" style="border:2px solid #0f0"><h3 style="color:#0f0">💰 PONER SALDO (Prueba entrega)</h3><div class="row"><input id="targetID" placeholder="ID cliente o vacío para ti" class="in"><input id="addSaldo" type="number" value="50" class="in" style="width:110px"></div><button onclick="addSaldo()" style="width:100%;padding:11px;background:#0f0;color:#000;border:none;border-radius:8px;font-weight:900;margin-top:6px">💸 PONER SALDO</button></div>
<div id="aList"></div>
<button onclick="location.href=location.pathname" style="width:100%;padding:12px;background:#222;color:#fff;border-radius:8px;margin:20px 0">← SALIR</button>
</div></div>
<script>
const BASE=[
 {n:'DRIP CLIENT',i:'💧',id:'drip',ps:[{id:'drip-1d',d:'1 DIA',p:4},{id:'drip-7d',d:'7 DIAS',p:12},{id:'drip-15d',d:'15 DIAS',p:15},{id:'drip-30d',d:'30 DIAS',p:20}]},
 {n:'FLOURITE',i:'💎',id:'flou',ps:[{id:'flou-7d',d:'7 DIAS',p:30},{id:'flou-30d',d:'30 DIAS',p:50}]},
 {n:'CUBAN MODS',i:'🇨🇺',id:'cuban',ps:[{id:'cuban-1d',d:'1 DIA',p:3},{id:'cuban-7d',d:'7 DIAS',p:5},{id:'cuban-30d',d:'30 DIAS',p:10}]},
 {n:'HG CHEATS',i:'⚡',id:'hg',ps:[{id:'hg-1d',d:'1 DIA',p:5},{id:'hg-10d',d:'10 DIAS',p:12},{id:'hg-30d',d:'30 DIAS',p:18}]},
 {n:'PATO TEAM',i:'🦆',id:'pato',ps:[{id:'pato-30d',d:'30 DIAS',p:14}]},
 {n:'CAKE',i:'🎂',id:'cake',ps:[{id:'cake-1d',d:'1 DIA',p:4},{id:'cake-7d',d:'7 DIAS',p:10},{id:'cake-15d',d:'15 DIAS',p:16},{id:'cake-30d',d:'30 DIAS',p:22}]},
 {n:'ANDROID PROXY',i:'📦',id:'proxy',ps:[{id:'proxy-30d',d:'30 DIAS',p:8}]}
];
// KEYS DEMO - CAMBIA ESTAS POR LAS TUYAS REALES
const DEMO_KEYS={
 'drip-1d':['DRIP-1D-ABC123-XYZ','DRIP-1D-DEF456-XYZ','DRIP-1D-GHI789-XYZ'],
 'drip-7d':['DRIP-7D-ABC123-XYZ','DRIP-7D-DEF456-XYZ'],
 'drip-15d':['DRIP-15D-ABC123-XYZ'], 'drip-30d':['DRIP-30D-ABC123-XYZ','DRIP-30D-DEF456-XYZ'],
 'flou-7d':['FLOU-7D-KEY1','FLOU-7D-KEY2'], 'flou-30d':['FLOU-30D-KEY1'],
 'cuban-1d':['CUBAN-1D-KEY1','CUBAN-1D-KEY2','CUBAN-1D-KEY3'], 'cuban-7d':['CUBAN-7D-KEY1'], 'cuban-30d':['CUBAN-30D-KEY1'],
 'hg-1d':['HG-1D-KEY1','HG-1D-KEY2'], 'hg-10d':['HG-10D-KEY1'], 'hg-30d':['HG-30D-KEY1'],
 'pato-30d':['PATO-30D-KEY1','PATO-30D-KEY2'],
 'cake-1d':['CAKE-1D-KEY1'], 'cake-7d':['CAKE-7D-KEY1'], 'cake-15d':['CAKE-15D-KEY1'], 'cake-30d':['CAKE-30D-KEY1'],
 'proxy-30d':['PROXY-30D-KEY1','PROXY-30D-KEY2']
};

let ID=localStorage.getItem('temo_myID');function L(k,d){try{let v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}function S(k,v){localStorage.setItem(k,JSON.stringify(v))}
let prodsCache=L('temo_prods',BASE);if(!prodsCache||prodsCache.length==0){prodsCache=BASE;S('temo_prods',BASE)}
let keysCache=L('temo_keys',null);
if(!keysCache||Object.keys(keysCache).length==0){keysCache=DEMO_KEYS;S('temo_keys',DEMO_KEYS)}
let users=L('temo_users',{});if(!users[ID]){users[ID]={saldo:0};S('temo_users',users)}
document.getElementById('idIn').value=ID;document.getElementById('idTxt').innerText=ID;
function upd(){let u=L('temo_users',{})[ID]||{saldo:0};document.getElementById('sTop').innerText='$'+u.saldo;document.getElementById('sTxt').innerText=u.saldo}upd();
function render(){let k=L('temo_keys',{});let html='';for(let p of prodsCache){let stock=0;for(let pl of p.ps){if(k[pl.id])stock+=k[pl.id].length}html+=`<div class=prod><div><b>${p.i} ${p.n}</b><br><small>${p.ps.length} planes - ${stock} keys - ENTREGA AUTO</small></div><button class=btn onclick="ver('${p.id}')">VER</button></div>`}document.getElementById('lista').innerHTML=html}render();
let lastKey='';
function ver(pid){let k=L('temo_keys',{});let u=L('temo_users',{});let p=prodsCache.find(x=>x.id==pid);let txt=p.n+'\n';for(let pl of p.ps){txt+=`${pl.d} $${pl.p} (${k[pl.id]?k[pl.id].length:0} keys)\n`}let ans=prompt(txt+`\nSaldo $${u[ID].saldo}\nEscribe plan (ej: 1 DIA):`);if(!ans)return;let plan=p.ps.find(x=>x.d.toLowerCase()==ans.trim().toLowerCase());if(!plan)return alert('Plan mal');if(!k[plan.id]||k[plan.id].length==0)return alert('Sin stock - Ve a?admin y agrega keys');if(u[ID].saldo<plan.p)return alert('Saldo insuficiente - Ve a?admin y ponte saldo');let key=k[plan.id].shift();S('temo_keys',k);u[ID].saldo-=plan.p;S('temo_users',u);let hist=L('temo_hist',{});if(!hist[ID])hist[ID]=[];hist[ID].push({prod:p.n,plan:plan.d,key:key,date:new Date().toLocaleString()});S('temo_hist',hist);lastKey=key;document.getElementById('modalProd').innerText=p.n+' - '+plan.d;document.getElementById('modalKey').innerText=key;document.getElementById('waKeyBtn').onclick=()=>window.open('https://wa.me/?text='+encodeURIComponent(`🔥 Tu key ${p.n} ${plan.d}: ${key}`),'_blank');document.getElementById('keyModal').style.display='flex';upd();render();renderAdmin();}
function copyID(){navigator.clipboard.writeText(ID);alert('Copiado')}function copyKey(){navigator.clipboard.writeText(lastKey);alert('Key copiada')}function openHist(){let h=L('temo_hist',{})[ID]||[];let html=h.length?h.slice().reverse().map(x=>`<div style=background:#000;padding:8px;margin:6px 0;border-radius:6px><b style=color:#0f0>${x.prod}-${x.plan}</b><br><small>${x.date}</small><br><span style=color:#0f0>${x.key}</span></div>`).join(''):'<p>Sin compras</p>';document.getElementById('histList').innerHTML=html;document.getElementById('histModal').style.display='flex'}
function doLogin(){if(document.getElementById('aUser').value=='Temo2007'&&document.getElementById('aPass').value=='Temo2007'){document.getElementById('aLogin').style.display='none';document.getElementById('aContent').style.display='block';renderAdmin()}else alert('mal')}
function addSaldo(){let tid=document.getElementById('targetID').value.trim().toUpperCase()||ID;let m=parseInt(document.getElementById('addSaldo').value);if(!m)return alert('Monto');let u=L('temo_users',{});if(!u[tid])u[tid]={saldo:0};u[tid].saldo+=m;S('temo_users',u);if(tid==ID)upd();alert('✅ $'+m+' a '+tid)}
function renderAdmin(){let k=L('temo_keys',{});let c=document.getElementById('aList');c.innerHTML='';for(let p of prodsCache){let html=`<div class=cardA><b>${p.i} ${p.n}</b><br><small>Cuando guardas aquí, la web entrega sola</small>`;for(let pl of p.ps){let cnt=k[pl.id]?k[pl.id].length:0;let st=k[pl.id]?k[pl.id].join('\n'):'';html+=`<div style=background:#000;padding:10px;margin:8px 0;border-radius:8px><b>${pl.d} $${pl.p} - ${cnt} keys restantes</b><textarea id="ta-${pl.id}">${st}</textarea><button class=btn2 onclick="saveKeys('${pl.id}')">💾 GUARDAR - AHORA LA WEB ENTREGA ESTAS KEYS SOLA</button></div>`}html+='</div>';let d=document.createElement('div');d.innerHTML=html;c.appendChild(d)}}
function saveKeys(id){let ta=document.getElementById('ta-'+id);let clean=ta.value.split('\n').map(s=>s.trim()).filter(s=>s.length>=2);let k=L('temo_keys',{});k[id]=clean;S('temo_keys',k);alert('✅ Guardado '+clean.length+' keys - La web ya las entrega auto');render();renderAdmin()}
if(location.search.toLowerCase().includes('admin'))document.getElementById('admin').style.display='block';
</script></body></html>
